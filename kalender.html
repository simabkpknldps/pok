            kantor: kantor
        })
    });

    const result = await response.json();

    if(result.status === "success"){
        calendarData = result.data;
    } else {
        alert("Gagal ambil data kalender");
    }
}
    
function renderCalendar(){
    const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const year = currentDate.getFullYear();
    const month = currentDate.getMonth();

    document.getElementById("calendarMonth").textContent = `${monthNames[month]} ${year}`;

    const firstDay = new Date(year, month, 1).getDay(); // 0=minggu
    const lastDate = new Date(year, month+1, 0).getDate();
    const prevLastDate = new Date(year, month, 0).getDate();

    const tbody = document.getElementById("calendarBody");
    tbody.innerHTML = "";

    let day = 1;
    for(let week=0; week<6; week++){
        const tr = document.createElement("tr");
        for(let d=0; d<7; d++){
            const td = document.createElement("td");
            let dayNum = 0;
            let isOtherMonth = false;

            if(week===0 && d<firstDay){
                dayNum = prevLastDate - firstDay + d + 1;
                isOtherMonth = true;
            } else if(day > lastDate){
                dayNum = day - lastDate;
                isOtherMonth = true;
                day++;
            } else {
                dayNum = day;
                day++;
            }

            td.innerHTML = `<span class="day-number">${dayNum}</span>`;

            if(isOtherMonth){
                td.classList.add("other-month");
            } else {
                // tambahkan contoh event
                const events = getEventsForDay(dayNum, month+1, year);
                events.forEach(ev=>{
                    const span = document.createElement("span");
                    span.className = `calendar-event event-${ev.color}`;
                    span.textContent = ev.title;
                    td.appendChild(span);
                });

                // highlight hari ini
                const today = new Date();
                if(dayNum === today.getDate() && month === today.getMonth() && year === today.getFullYear()){
                    td.classList.add("today");
                }
            }

            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    }
}

initMonthYearDropdowns();
renderCalendar();  // <-- panggil ini supaya kalender muncul
monthSelect.addEventListener("change", changeMonthYear);
yearSelect.addEventListener("change", changeMonthYear);

function getEventsForDay(day, month, year){

    const key = `${year}-${String(month).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    if(!calendarData[key]) return [];

    const items = calendarData[key];
    const maxShow = 3;
    const events = [];

    items.slice(0, maxShow).forEach(item=>{
        let title = item.c;

        if(title.length > 25){
            title = title.substring(0,25) + "...";
        }

        events.push({
            title: title,
            color: "blue"
        });
    });

    if(items.length > maxShow){
        events.push({
            title: "+" + (items.length - maxShow),
            color: "purple"
        });
    }

    return events;
}

// Populate dropdown bulan & tahun
function initMonthYearDropdowns() {
    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");
    const monthNames = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

    // bulan
    monthNames.forEach((name, index)=>{
        const opt = document.createElement("option");
        opt.value = index;
        opt.textContent = name;
        monthSelect.appendChild(opt);
    });

    // tahun ±5 tahun dari sekarang
    const currentYear = new Date().getFullYear();
    for(let y = currentYear - 5; y <= currentYear + 5; y++){
        const opt = document.createElement("option");
        opt.value = y;
        opt.textContent = y;
        yearSelect.appendChild(opt);
    }

    // set default sesuai currentDate
    monthSelect.value = currentDate.getMonth();
    yearSelect.value = currentDate.getFullYear();
}

// ketika dropdown berubah
function changeMonthYear() {
    const monthSelect = document.getElementById("monthSelect");
    const yearSelect = document.getElementById("yearSelect");
    currentDate.setMonth(parseInt(monthSelect.value));
    currentDate.setFullYear(parseInt(yearSelect.value));
    renderCalendar();
}

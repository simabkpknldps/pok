<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daftar Kegiatan SiMAB</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
*{margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif;}
body{display:grid; grid-template-columns:240px 1fr; background:#f8fafc; color:#334155;}
.sidebar{height:100vh; background:#ffffff; border-right:1px solid #e5e7eb; display:flex; flex-direction:column; position:sticky; top:0;}
.sidebar-brand{padding:20px; background:#e0f2fe; color:#0369a1; font-weight:600; font-size:18px; display:flex; align-items:center; gap:10px;}
.sidebar ul{list-style:none; padding:20px 10px;}
.sidebar ul li{padding:10px 14px; margin-bottom:6px; border-radius:10px; cursor:pointer; display:flex; align-items:center; gap:12px; font-size:14px; color:#475569; transition:0.2s;}
.sidebar ul li:hover{background:#f1f5f9;}
.sidebar ul li.active{background:#e0f2fe; color:#0369a1; font-weight:600;}
.main{min-height:100vh; display:flex; flex-direction:column;}
.topbar{height:60px; background:#ffffff; border-bottom:1px solid #e5e7eb; display:flex; justify-content:space-between; align-items:center; padding:0 30px; position:sticky; top:0; z-index:1000;}
.topbar-left{font-weight:600;}
.topbar-right{display:flex; align-items:center; gap:18px; font-size:14px;}
.topbar-right i{font-size:16px; cursor:pointer; color:#475569; transition:0.2s;}
.topbar-right i:hover{color:#0369a1;}
.user-info{display:flex; align-items:center; gap:8px; font-weight:500;}
.content{padding:30px; padding-bottom:50px;}
.footer{position:fixed; bottom:0; left:240px; right:0; height:45px; background:#ffffff; border-top:1px solid #e5e7eb; display:flex; align-items:center; justify-content:center; font-size:13px; color:#64748b;}
@media(max-width:1000px){body{grid-template-columns:1fr;} .footer{left:0;}}

/* Overlay loading */
.loading{
  position: fixed;
  inset:0;
  background: rgba(255,255,255,0.7);
  display: none;
  justify-content:center;
  align-items:center;
  z-index: 9999;
}
.spinner{
  width:45px;
  height:45px;
  border:5px solid #e5e7eb;
  border-top:5px solid #38bdf8;
  border-radius:50%;
  animation:spin 1s linear infinite;
}
@keyframes spin{
  to { transform: rotate(360deg); }
}

/* Status colors */
td.status-RekamData{ background:#fca5a5; }       /* pink */
td.status-Terlaksana{ background:#d1d5db; }      /* abu */
td.status-LPT{ background:#fde68a; }             /* yellow */
td.status-Terbayar{ background:#4ade80; }        /* hijau */
td.status-Selesai{ background:#60a5fa; color:white; } /* biru */
  
/* --- Filter --- */
.filter-bar{display:flex; align-items:center; gap:20px; margin-bottom:15px;}
.filter-bar input[type="text"]{flex:1; padding:8px 12px; border-radius:8px; border:1px solid #cbd5e1; font-size:14px;}
.filter-bar .radio-group{display:flex; gap:12px;}
.filter-bar .radio-group label{display:flex; align-items:center; gap:4px; font-size:14px; cursor:pointer;}

/* --- Tabel --- */
.table-wrapper {
  width: 100%;
  overflow-x: auto; /* scroll horizontal */
  border: 1px solid #e5e7eb;
  border-radius: 12px;
  background: white;
}

.table-box {
  min-width: 1200px; /* minimal lebar agar kolom panjang tidak terpotong */
  overflow-y: auto;
  max-height: calc(100vh - 250px);
}

.table-box table {
  border-collapse: collapse;
  width: 100%;
  overflow-y: auto;
}

.table-box th, .table-box td {
  padding: 10px;
  border-bottom: 1px solid #e5e7eb;
  text-align: left;
  /* white-space: nowrap; */ /* hapus default nowrap */
  word-wrap: break-word;   /* agar teks bisa wrap */
  overflow-wrap: break-word;
}

  /* wrap hanya untuk kolom tertentu */
.table-box td.wrap, .table-box th.wrap {
  white-space: normal; /* memungkinkan wrap */
}

  
.table-box th {
  background: #f1f5f9;
  font-weight: 600;
  position: sticky;
  top: 0;
  z-index: 10;
}

  .table-box td.status {
  text-align: center;      /* horizontal center */
  vertical-align: middle;   /* vertical center */
  font-weight: 600;         /* opsional agar lebih jelas */
  color: white;             /* biar kontras dengan background */
  border-radius: 6px;       /* agar background lebih rapi */
}

/* freeze kolom aksi di kanan */
.table-box td.actions {
  position: sticky;
  right: 0;
  background: white;
  display: flex;
  justify-content: center;   /* horizontal center */
  align-items: center;       /* vertical center */
  gap: 5px;
  z-index: 5;
  height: 100%; /* agar flex vertical penuh */
}

.table-box td.actions button {
  border: none;
  background: none;
  cursor: pointer;
  font-size: 16px;
  display: flex;             /* agar icon juga center */
  justify-content: center;
  align-items: center;
  padding: 5px;
  width: 30px;               /* ukuran tombol seragam */
  height: 30px;              /* tinggi tombol */
  border-radius: 6px;        /* opsional */
  transition: 0.2s;
}

.table-box td.actions button:hover{
  background: #f1f5f9; /* hover tombol */
}

.table-box td.actions button:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 125%;
  left: 50%;
  transform: translateX(-50%);
  background: #000;
  color: #fff;
  padding: 3px 6px;
  border-radius: 4px;
  white-space: nowrap;
  font-size: 12px;
}

  .table-box table {
  font-size: 14px;   /* samakan dengan sidebar */
}

.table-box th {
  font-size: 14px;
}

.table-box td {
  font-size: 14px;
}

.table-box th,
.table-box td {
  font-size: 13px;
  padding: 8px 10px;
}

  
</style>
</head>

<body>

<div class="loading" id="loadingOverlay">
  <div class="spinner"></div>
</div>
  
<div class="sidebar">
    <div class="sidebar-brand"><i class="fa-solid fa-layer-group"></i> <span>SiMAB</span></div>
    <ul>
        <li onclick="goDashboard()"><i class="fa-solid fa-gauge"></i>Dashboard</li>
        <li onclick="goPOK()"><i class="fa-solid fa-folder-open"></i>POK</li>
        <li class="active" onclick="goKegiatan()"><i class="fa-solid fa-gauge"></i>Daftar Kegiatan</li>
        <li><i class="fa-solid fa-wallet"></i>Perjadinku</li>
        <li><i class="fa-solid fa-chart-column"></i>Statistik</li>
        <li><i class="fa-solid fa-circle-info"></i>Tentang</li>
    </ul>
</div>

<div class="main">
    <div class="topbar">
        <div class="topbar-left">Sistem Monitoring Anggaran Belanja</div>
        <div class="topbar-right">
            <i class="fa-regular fa-calendar"></i>
            <i class="fa-solid fa-gear"></i>
            <div class="user-info"><i class="fa-regular fa-user"></i><span id="namaUser"></span></div>
            <i class="fa-solid fa-right-from-bracket" title="Logout" onclick="logout()"></i>
        </div>
    </div>

    <div class="content">
        <div class="filter-bar">
            <input type="text" id="searchBox" placeholder="Cari data...">
            <div class="radio-group">
                <label><input type="radio" name="statusFilter" value="Dalam Proses" checked> Dalam Proses</label>
                <label><input type="radio" name="statusFilter" value="LPT"> LPT</label>
                <label><input type="radio" name="statusFilter" value="Terbayar"> Terbayar</label>
                <label><input type="radio" name="statusFilter" value="Selesai"> Selesai</label>
                <label><input type="radio" name="statusFilter" value="Semua"> Semua</label>
            </div>
        </div>

        <div class="table-wrapper">
            <div class="table-box">
                <table>
                    <thead>
                        <tr>
                            <th class="wrap">MAK</th>
                            <th class="wrap">Uraian / No ST</th>
                            <th class="wrap">Pelaksana Tugas</th>
                            <th class="wrap">Tujuan</th>
                            <th>Tgl ST/ND</th>
                            <th>Tgl Mulai</th>
                            <th>Jumlah</th>
                            <th>User</th>
                            <th>Status</th>
                            <th class="actions">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="dataTableBody">
                        <!-- Data dari GAS -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>
</div>

<div class="footer">© KPKNL Denpasar 2026</div>

<script>
const urlGAS="https://script.google.com/macros/s/AKfycbxfJo89J56489U0ljWEMjZHXbUqDcUVBMfy5e9GnkTI8gNhP6TCqaRqoVRejd0ezF29/exec";

function showOverlay(text="Menyimpan data..."){
    const ov = document.getElementById("globalOverlay");
    ov.querySelector("div").innerText = "⏳ " + text;
    ov.style.display = "flex";
}

function hideOverlay(){
    document.getElementById("globalOverlay").style.display = "none";
}
  
let pegawaiList = [];
let lokasiList = [];

  
document.addEventListener("DOMContentLoaded", async function(){
    const nama = sessionStorage.getItem("nama");
    if(!nama) window.location.replace("index.html");
    else document.getElementById("namaUser").textContent = nama;

    let allRows = [];
    const kantor = sessionStorage.getItem("kantor");
    if(!kantor){
        alert("Session kantor tidak ditemukan. Silakan login ulang.");
        window.location.replace("index.html");
    }

    const admin = sessionStorage.getItem("admin");
  
    let skipFirstLoadRows = true; // skip row 2 & 3 hanya saat load pertama

    // fungsi filter berdasarkan status radio
    function filterByStatus(rows, status){
        switch(status){
            case "Dalam Proses": return rows.filter(r => ["Rekam Data","Terlaksana"].includes(r.P));
            case "LPT": return rows.filter(r => r.P==="LPT");
            case "Terbayar": return rows.filter(r => r.P==="Terbayar");
            case "Selesai": return rows.filter(r => r.P==="Selesai");
            case "Semua": return rows.filter(r => ["Rekam Data","Terlaksana","LPT","Terbayar","Selesai"].includes(r.P));
            default: return rows;
        }
    }

    // render table
    function renderTable(rows){
        const tbody = document.getElementById("dataTableBody");
        tbody.innerHTML = "";
        rows.forEach(r=>{
            
            const tglST = r.F ? new Date(r.F) : null;
          const tglMulai = r.G ? new Date(r.G) : null;
            const tglSelesai = r.H ? new Date(r.H) : null;
              
              const formatDate = (d) => 
                d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : "";
              
              const tglSTFormatted = formatDate(tglST);
              const tglMulaiFormatted = formatDate(tglMulai);

            const jumlahFormatted = Number(r.M||0).toLocaleString('id-ID');
    
            const tr = document.createElement("tr");
            tr.dataset.id = r.A; // simpan ID di attribute (DI SINI, bukan di innerHTML)

    
            // assign class status untuk coloring
            let statusClass = "";
            switch(r.P){
                case "Rekam Data": statusClass="status-RekamData"; break;
                case "Terlaksana": statusClass="status-Terlaksana"; break;
                case "LPT": statusClass="status-LPT"; break;
                case "Terbayar": statusClass="status-Terbayar"; break;
                case "Selesai": statusClass="status-Selesai"; break;
            }
    
            tr.innerHTML = `
              <td class="wrap">${r.B}</td>
              <td class="wrap">${r.C}</td>
              <td class="wrap">${r.D}</td>
              <td class="wrap">${r.E}</td>
              <td>${tglSTFormatted}</td>
              <td>${tglMulaiFormatted}</td>
              <td style="text-align:right;">${jumlahFormatted}</td>
              <td>${r.N}</td>
              <td class="${statusClass}">${r.P}</td>
              <td class="actions">
                  <button class="btn-ubah" data-tooltip="Ubah"><i class="fa-solid fa-pen-to-square"></i></button>
                  <button class="btn-pelaksana" data-tooltip="Pelaksana"><i class="fa-solid fa-user-check"></i></button>
                  <button class="btn-lpt" data-tooltip="LPT"><i class="fa-solid fa-file-lines"></i></button>
                  <button class="btn-bayar" data-tooltip="Bayar"><i class="fa-solid fa-hand-holding-dollar"></i></button>
                  <button class="btn-sp2d" data-tooltip="SP2D"><i class="fa-solid fa-money-bill-transfer"></i></button>
                  <button class="btn-hapus" data-tooltip="Hapus"><i class="fa-solid fa-trash"></i></button>
              </td>
            `;


    
            tbody.appendChild(tr);
        });
    }
let firstLoad = true; // untuk overlay hanya saat load pertama

async function loadData(showOverlay = true){
    try{
        if(showOverlay && firstLoad) showLoading(true);

        const res = await fetch(`${urlGAS}?kantor=${kantor}`);
        const data = await res.json();

        if(showOverlay && firstLoad) showLoading(false);

        if(data.status !== "success") return;

        allRows = data.rows;
        pegawaiList = data.pegawai || [];
        lokasiList = data.lokasi || [];
        
        // 🔥 TAMBAHKAN DI SINI
        populateDatalist();

        const defaultRadio = document.querySelector('input[name="statusFilter"]:checked').value;

        // skip row 2 & 3 saat load pertama
        const initialRows = allRows.filter((r, idx) => idx !== 1 && idx !== 2);
        const filtered = filterByStatus(initialRows, defaultRadio);
        renderTable(filtered);

        firstLoad = false; // overlay hanya sekali
    } catch(e){
        if(showOverlay && firstLoad) showLoading(false);
        console.error(e);
    }
}

 // load pertama (dengan overlay)
    await loadData(true);

  
// 🔁 Reload data tiap 30 detik
    setInterval(() => {
        loadData();
    }, 30000); // 30000ms = 30 detik


  
    // search
    document.getElementById("searchBox").addEventListener("input", function(){
        const val = this.value.toLowerCase();
        const radioVal = document.querySelector('input[name="statusFilter"]:checked').value;
        let filtered = filterByStatus(allRows, radioVal);
    
        if(val){
            filtered = filtered.filter(r =>
                Object.keys(r)
                      .filter(k => k !== "N") // skip kolom User
                      .some(k => String(r[k]||"").toLowerCase().includes(val))
            );
        }
    
        renderTable(filtered);
    });


    // radio filter
    document.querySelectorAll('input[name="statusFilter"]').forEach(rb=>{
        rb.addEventListener("change", function(){
            const val = this.value;
            const searchVal = document.getElementById("searchBox").value.toLowerCase();
            let filtered = filterByStatus(allRows, val);

            if(searchVal){
                filtered = filtered.filter(r =>
                    Object.keys(r).some(k => String(r[k]||"").toLowerCase().includes(searchVal))
                );
            }

            renderTable(filtered);
        });
    });

    // tombol aksi
    // tombol aksi
document.getElementById("dataTableBody").addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    const tr = btn.closest("tr");
    const idKegiatan = tr.dataset.id;
    const statusKegiatan = tr.cells[8].textContent; // kolom Status
    const isAdmin = sessionStorage.getItem("admin") === "1";

    if(btn.classList.contains("btn-ubah")){
        if(statusKegiatan === "Rekam Data" || isAdmin){
            // tampilkan popup edit
            showEditPopup(tr);
        } else {
            alert("Anda tidak memiliki kewenangan!");
        }
    }
    else if(btn.classList.contains("btn-hapus")) alert("Hapus ID: "+idKegiatan);
    else if(btn.classList.contains("btn-pelaksana")){
        showPelaksanaPopup(tr);
    }

    else if(btn.classList.contains("btn-lpt")){
        showLPTPopup(tr);
    }
    else if(btn.classList.contains("btn-bayar")){
    const isAdmin = sessionStorage.getItem("admin") === "1"; // ambil dari session
    if(isAdmin){
        showBayarPopup(tr); // tampilkan popup
    } else {
        alert("Anda tidak memiliki kewenangan!");
    }
}
    else if(btn.classList.contains("btn-sp2d")) alert("SP2D ID: "+idKegiatan);
});

// contoh fungsi popup edit
function showEditPopup(tr){
    const idKegiatan = tr.dataset.id;
    const uraian = tr.cells[1].textContent;
    const pelaksana = tr.cells[2].textContent;
    const tujuan = tr.cells[3].textContent;
    const tglST = tr.cells[4].textContent;
    //const tglMulai = tr.cells[6].textContent;
    const jumlah = tr.cells[6].textContent.replace(/\./g,"");

    // overlay
    const overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.inset = 0;
    overlay.style.background = "rgba(0,0,0,0.4)";
    overlay.style.display = "flex";
    overlay.style.justifyContent = "center";
    overlay.style.alignItems = "center";
    overlay.style.zIndex = 9999;

    // popup card
    const popup = document.createElement("div");
    popup.style.background = "#fff";
    popup.style.borderRadius = "12px";
    popup.style.boxShadow = "0 8px 20px rgba(0,0,0,0.2)";
    popup.style.width = "400px";
    popup.style.maxWidth = "90%";
    popup.style.padding = "25px 20px";
    popup.style.display = "flex";
    popup.style.flexDirection = "column";
    popup.style.gap = "12px";

    popup.innerHTML = `
        <h3 style="margin-bottom:10px; text-align:center; color:#0369a1;">Ubah Kegiatan #${idKegiatan}</h3>

        <label>Uraian</label>
        <input type="text" value="${uraian}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">

        <label>Pelaksana</label>
        <input type="text" list="listPegawai" value="${pelaksana}"
        style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">
        
        <label>Tujuan</label>
        <input type="text" list="listLokasi" value="${tujuan}"
        style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">


        <label>Tgl ST/ND</label>
        <input type="date" value="${tglST}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">

        <label>Jumlah</label>
        <input type="number" value="${jumlah}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
            <button id="popupCancel" style="padding:8px 14px; border:none; border-radius:6px; background:#e5e7eb; color:#475569; cursor:pointer;">Batal</button>
            <button id="popupUpdate" style="padding:8px 14px; border:none; border-radius:6px; background:#38bdf8; color:white; cursor:pointer;">Update</button>
        </div>
    `;

    overlay.appendChild(popup);
    document.body.appendChild(overlay);
    //document.getElementById("uraian").value = uraian;
    //document.getElementById("tglST").value = tglST;

  
    // tombol batal
    document.getElementById("popupCancel").onclick = () => overlay.remove();

    // tombol update
    document.getElementById("popupUpdate").onclick = function(){

    const btn = this; // 🔥 ambil tombolnya sendiri
    btn.disabled = true;

    showOverlay("Menyimpan perubahan...");

    const inputs = popup.querySelectorAll("input");

    const updatedData = {
        uraian: inputs[0].value,
        pelaksana: inputs[1].value,
        tujuan: inputs[2].value,
        tglST: inputs[3].value,
        jumlah: Number(inputs[4].value)
    };

    fetch(urlGAS, {
        method: "POST",
        body: JSON.stringify({
            kantor: sessionStorage.getItem("kantor"),
            id: idKegiatan,
            uraian: updatedData.uraian,
            pelaksana: updatedData.pelaksana,
            tujuan: updatedData.tujuan,
            tglST: updatedData.tglST,
            jumlah: updatedData.jumlah
        })
    })
    .then(res => res.json())
    .then(result=>{
        hideOverlay();
        btn.disabled = false;

        if(result.status === "success"){
            overlay.remove();
            loadData(false);
        } else {
            alert("Gagal update: "+result.message);
        }
    })
    .catch(err=>{
        hideOverlay();
        btn.disabled = false;
        alert("Error koneksi");
        console.error(err);
    });
};
}


    loadData();
});

function getStatusColor(status){
    switch(status){
        case "Rekam Data": return "#f87171"; // pink
        case "Terlaksana": return "#9ca3af"; // abu
        case "LPT": return "#facc15";        // kuning
        case "Terbayar": return "#22c55e";   // hijau
        case "Selesai": return "#3b82f6";    // biru
        default: return "#6b7280";            // default abu gelap
    }
}
function showPelaksanaPopup(tr){

    const idKegiatan = tr.dataset.id;

    // ambil data dari tabel
    const mak = tr.cells[0].textContent;
    const uraian = tr.cells[1].textContent;
    const tujuan = tr.cells[3].textContent;
    const tglST = tr.cells[4].textContent;
    const user = tr.cells[7].textContent;

    // ===== Overlay =====
    const overlay = document.createElement("div");
    overlay.style.position = "fixed";
    overlay.style.inset = 0;
    overlay.style.background = "rgba(0,0,0,0.4)";
    overlay.style.display = "flex";
    overlay.style.justifyContent = "center";
    overlay.style.alignItems = "center";
    overlay.style.zIndex = 9999;

    // ===== Popup =====
    const popup = document.createElement("div");
    popup.style.background = "#fff";
    popup.style.borderRadius = "12px";
    popup.style.boxShadow = "0 8px 20px rgba(0,0,0,0.2)";
    popup.style.width = "750px";
    popup.style.maxWidth = "95%";
    popup.style.padding = "25px";
    popup.style.display = "flex";
    popup.style.flexDirection = "column";
    popup.style.gap = "12px";
    popup.style.maxHeight = "90vh";
    popup.style.overflowY = "auto";

    popup.innerHTML = `
    <h3 style="text-align:center; color:#0369a1;">
        Pelaksana Kegiatan #${idKegiatan}
    </h3>

    <label>MAK</label>
    <input type="text" value="${mak}" readonly
        style="padding:8px; border:1px solid #cbd5e1; border-radius:6px; background:#f1f5f9;">

    <label>Uraian</label>
    <input type="text" value="${uraian}"
        style="padding:8px; border:1px solid #cbd5e1; border-radius:6px;">

    <label>Tujuan</label>
    <input type="text" value="${tujuan}" readonly
        style="padding:8px; border:1px solid #cbd5e1; border-radius:6px; background:#f1f5f9;">

    <!-- USER & TGL ST SEJAJAR -->
    <div style="display:flex; gap:12px;">
        <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
            <label>User</label>
            <input type="text" value="${user}" readonly
                style="padding:8px; border:1px solid #cbd5e1; border-radius:6px; background:#f1f5f9;">
        </div>

    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    // ===== Tambah Pelaksana =====
    document.getElementById("btnTambahPelaksana").onclick = function(){

        const namaInput = document.getElementById("pelNama");
        const nama = namaInput.value.trim();
        if(!nama) return;

        const tbody = document.getElementById("pelaksanaTableBody");
        const row = document.createElement("tr");

        row.innerHTML = `
    <td style="padding:6px;">${nama}</td>

    <td style="padding:6px;">
        <input type="date"
            style="padding:4px; border:1px solid #cbd5e1; border-radius:6px;">
    </td>

    <td style="padding:6px;">
        <input type="date"
            style="padding:4px; border:1px solid #cbd5e1; border-radius:6px;">
    </td>

    <td style="padding:6px;">
        <input type="text" class="jumlah-input"
            style="width:100%; padding:4px; border:1px solid #cbd5e1;
            border-radius:6px; text-align:right;">
    </td>

    <td style="padding:6px; text-align:center;">
        <button style="border:none; background:none; cursor:pointer; color:red;">
            <i class="fa-solid fa-trash"></i>
        </button>
    </td>
`;


        row.querySelector("button").onclick = () => row.remove();
        tbody.appendChild(row);
        const jumlahInput = row.querySelector(".jumlah-input");
        
        jumlahInput.addEventListener("input", function(){
            let value = this.value.replace(/\D/g, "");
            this.value = value ? Number(value).toLocaleString("id-ID") : "";
        });

        namaInput.value = "";
        namaInput.focus();
    };

    document.getElementById("pelCancel").onclick = () => overlay.remove();

    document.getElementById("pelSave").onclick = () => {

    showOverlay("Menyimpan pelaksana...");
    document.getElementById("pelSave").disabled = true;

    const rows = document.querySelectorAll("#pelaksanaTableBody tr");
    const dataPelaksana = [];

    rows.forEach(r=>{
        const nama = r.cells[0].textContent;

        const mulaiRaw = r.cells[1].querySelector("input").value;
        const selesaiRaw = r.cells[2].querySelector("input").value;

        const mulai = mulaiRaw ? mulaiRaw.split("T")[0] : "";
        const selesai = selesaiRaw ? selesaiRaw.split("T")[0] : "";

        const jumlahText = r.cells[3].querySelector("input").value;
        const jumlah = Number(jumlahText.replace(/\./g,"")) || 0;

        dataPelaksana.push({nama, mulai, selesai, jumlah});
    });

    fetch(urlGAS,{
        method:"POST",
        body: JSON.stringify({
            action: "savePelaksana",
            kantor: sessionStorage.getItem("kantor"),
            idLama: idKegiatan,
            mak: mak,
            uraian: popup.querySelectorAll("input")[1].value,
            tujuan: tujuan,
            tglST: document.getElementById("pelTglST").value,
            user: user,
            pelaksana: dataPelaksana
        })
    })
    .then(res=>res.json())
    .then(result=>{
        hideOverlay();
        document.getElementById("pelSave").disabled = false;

        if(result.status==="success"){
            overlay.remove();
            loadData(false);
        }else{
            alert("Gagal: "+result.message);
        }
    })
    .catch(err=>{
        hideOverlay();
        document.getElementById("pelSave").disabled = false;
        alert("Error koneksi");
    });

};
}

function saveLPTPopup(idKegiatan){
    const rows = document.querySelectorAll("#lptTableBody tr"); // tbody LPT popup
    const dataToSend = [];

    rows.forEach(tr=>{
        const id = tr.dataset.id; // id kegiatan di tr
        const lptInput = tr.querySelector("input[type='date']");
        const lptDate = lptInput ? lptInput.value : "";
        dataToSend.push({id, lptDate});
    });

    fetch(urlGAS, {
        method: "POST",
        body: JSON.stringify({
            action: "updateLPT",
            kantor: sessionStorage.getItem("kantor"),
            rows: dataToSend
        })
    })
    .then(res=>res.json())
    .then(result=>{
        if(result.status === "success"){
            alert("Update LPT berhasil!");
            loadData(false); // reload tabel utama
        } else {
            alert("Gagal update LPT: "+result.message);
        }
    })
    .catch(err=>{
        console.error(err);
        alert("Error koneksi");
    });
}

function showBayarPopup(tr) {
    const idKegiatan = tr.dataset.id;
    const uraian = tr.cells[1].textContent; // kolom ke-2 tabel utama

    // ===== Overlay =====
    const overlay = document.createElement("div");
    overlay.style.cssText = "position:fixed; inset:0; background:rgba(0,0,0,0.4); display:flex; justify-content:center; align-items:center; z-index:9999;";

    // ===== Popup =====
    const popup = document.createElement("div");
    popup.style.cssText = "background:#fff; border-radius:12px; box-shadow:0 8px 20px rgba(0,0,0,0.2); width:600px; max-width:95%; padding:25px 20px; display:flex; flex-direction:column; gap:12px; max-height:80vh; overflow:auto;";

    popup.innerHTML = `
        <h3 style="text-align:center; color:#0369a1;">Bayar Kegiatan #${idKegiatan}</h3>

        <label>Uraian / No ST</label>
        <input type="text" id="uraianInput" value="${uraian}" style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">

        <label>Tanggal Bayar</label>
        <input type="date" id="tglBayarInput" style="width:100%; padding:8px; border-radius:6px; border:1px solid #cbd5e1;">

        <label>Daftar Pelaksana Tugas</label>
        <table id="tblPelaksana" style="width:100%; border-collapse:collapse; border:1px solid #cbd5e1;">
            <thead style="background:#f1f5f9;">
                <tr>
                    <th style="padding:6px; border-bottom:1px solid #cbd5e1;">ID Kegiatan</th>
                    <th style="padding:6px; border-bottom:1px solid #cbd5e1;">Pelaksana Tugas</th>
                    <th style="padding:6px; border-bottom:1px solid #cbd5e1;">Aksi</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:15px;">
            <button id="bayarCancel" style="padding:8px 14px; border:none; border-radius:6px; background:#e5e7eb; color:#475569; cursor:pointer;">Batal</button>
            <button id="bayarSave" style="padding:8px 14px; border:none; border-radius:6px; background:#22c55e; color:white; cursor:pointer;">Simpan</button>
        </div>
    `;

    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    // ===== Cancel =====
    document.getElementById("bayarCancel").onclick = () => overlay.remove();

    // ===== Isi tabel filter berdasarkan Uraian / No ST =====
    const tbody = popup.querySelector("#tblPelaksana tbody");
    tbody.innerHTML = "";

    // ambil semua row dari tabel utama
    const allRows = document.querySelectorAll("#dataTableBody tr");

    allRows.forEach(r => {
        const rowUraian = r.cells[1].textContent;
        if(rowUraian === uraian){ // cocokkan uraian
            const id = r.dataset.id;
            const pelaksana = r.cells[2].textContent;

            const newRow = document.createElement("tr");
            newRow.dataset.id = id; // simpan ID kegiatan di dataset

            newRow.innerHTML = `
                <td style="padding:6px;">${id}</td>
                <td style="padding:6px;">${pelaksana}</td>
                <td style="padding:6px; text-align:center;">
                    <button style="border:none; background:none; cursor:pointer; color:red;">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            `;

            // tombol hapus row
            newRow.querySelector("button").onclick = () => newRow.remove();

            tbody.appendChild(newRow);
        }
    });

    // ===== Simpan =====
    document.getElementById("bayarSave").onclick = () => {
        const uraianValue = document.getElementById("uraianInput").value.trim();
        const tglBayar = document.getElementById("tglBayarInput").value;

        if(!tglBayar){
            alert("Tanggal Bayar harus diisi!");
            return;
        }

        const rows = document.querySelectorAll("#tblPelaksana tbody tr");
        const tblData = [];
        
        rows.forEach(r => {
            const id = r.dataset.id;
            const pelaksana = r.cells[1].textContent;
            tblData.push({ 
                id, 
                pelaksana, 
                uraian: uraianValue,  // tambahkan uraian di tiap row
                tglBayar: tglBayar    // tambahkan tglBayar di tiap row
            });
        });


        showOverlay("Menyimpan pembayaran...");

        fetch(urlGAS, {
            method: "POST",
            body: JSON.stringify({
                action: "updateBayarMultiple",
                kantor: sessionStorage.getItem("kantor"),
                data: tblData
            })
        })
        .then(res => res.json())
        .then(result => {
            hideOverlay();
            if(result.status === "success"){
                overlay.remove();
                loadData(false);
            } else {
                alert("Gagal: " + result.message);
            }
        })
        .catch(err => {
            hideOverlay();
            //console.error(err);
            //alert("Error koneksi");
        });
    };
}

let pegawaiList = [];
let lokasiList = [];
let currentTableRowsData = []; 
let allRows = [];
let firstLoad = true;

// Fungsi untuk download data tabel ke Excel (Mengabaikan kolom Aksi & Format Kolom G ke Angka murni)
function downloadExcel() {
    const table = document.getElementById("mainDataTable");
    
    // Duplikasi tabel agar manipulasi tidak merusak tabel asli di UI
    const clonedTable = table.cloneNode(true);
    
    // Hapus kolom terakhir (Aksi) dari elemen thead klon
    const ths = clonedTable.querySelectorAll("thead tr th");
    if(ths.length > 0) ths[ths.length - 1].remove();
    
    // Proses semua baris di tbody klon
    const trs = clonedTable.querySelectorAll("tbody tr");
    trs.forEach(tr => {
        if(tr.cells.length > 0) {
            // Kolom G adalah indeks ke-6 (0: MAK, 1: Uraian, ..., 6: Jumlah)
            const cellJumlah = tr.cells[6];
            if (cellJumlah) {
                // Ambil teks angka murni dengan menghapus titik (.) pemisah ribuan
                const rawValue = cellJumlah.textContent.replace(/\./g, "").trim();
                const numericValue = parseFloat(rawValue);
                
                // Jika valid berupa angka, masukkan kembali ke elemen cell
                if (!isNaN(numericValue)) {
                    cellJumlah.textContent = numericValue;
                }
            }

            // Hapus kolom terakhir (Aksi) setelah kolom G selesai diproses
            tr.cells[tr.cells.length - 1].remove();
        }
    });

    // Convert tabel klon ke workbook Excel dengan opsi raw: false agar angka di-parsing dengan benar
    const wb = XLSX.utils.table_to_book(clonedTable, { sheet: "Data Kegiatan", raw: false });
    
    // Trigger download file
    Xcontent = XLSX.writeFile(wb, "Daftar_Kegiatan_SiMAB.xlsx");
}
  
document.addEventListener("DOMContentLoaded", async function(){
    const nama = sessionStorage.getItem("nama");
    if(!nama) window.location.replace("index.html");
    else document.getElementById("namaUser").textContent = nama;

    let allRows = [];
    const kantor = sessionStorage.getItem("kantor");
    if(!kantor){
        alert("Session kantor tidak ditemukan. Silakan login ulang.");
        window.location.replace("index.html");
    }

    const admin = sessionStorage.getItem("admin");
  
    let skipFirstLoadRows = true; // skip row 2 & 3 hanya saat load pertama

    // fungsi filter berdasarkan status radio
    function filterByStatus(rows, status){
        switch(status){
            case "Dalam Proses": return rows.filter(r => ["Rekam Data","Terlaksana"].includes(r.P));
            case "LPT": return rows.filter(r => r.P==="LPT");
            case "Terbayar": return rows.filter(r => r.P==="Terbayar");
            case "Selesai": return rows.filter(r => r.P==="Selesai");
            case "Semua": return rows.filter(r => ["Rekam Data","Terlaksana","LPT","Terbayar","Selesai"].includes(r.P));
            default: return rows;
        }
    }

    // fungsi pembantu untuk kalkulasi total kolom jumlah dari array baris yang aktif
    function kalkulasiTotalJumlah(rows){
        let total = rows.reduce((sum, r) => sum + Number(r.M || 0), 0);
        document.getElementById("totalJumlahLabel").textContent = total.toLocaleString('id-ID');
    }

    // render table
    function renderTable(rows){
      // TAMBAHKAN BARIS INI:
        currentTableRowsData = rows;
        const tbody = document.getElementById("dataTableBody");
        tbody.innerHTML = "";
        rows.forEach(r=>{
            
            const tglST = r.F ? new Date(r.F) : null;
            const tglMulai = r.G ? new Date(r.G) : null;
            const tglSelesai = r.H ? new Date(r.H) : null;
              
            const formatDate = (d) => 
                d ? `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}` : "";
              
            const tglSTFormatted = formatDate(tglST);
            const tglMulaiFormatted = formatDate(tglMulai);

            const jumlahFormatted = Number(r.M||0).toLocaleString('id-ID');
    
            const tr = document.createElement("tr");
            tr.dataset.id = r.A; // simpan ID di attribute

            // assign class status untuk coloring
            let statusClass = "";
            switch(r.P){
                case "Rekam Data": statusClass="status-RekamData"; break;
                case "Terlaksana": statusClass="status-Terlaksana"; break;
                case "LPT": statusClass="status-LPT"; break;
                case "Terbayar": statusClass="status-Terbayar"; break;
                case "Selesai": statusClass="status-Selesai"; break;
            }
    
            tr.innerHTML = `
              <td class="wrap">${r.B}</td>
              <td class="wrap">${r.C}</td>
              <td class="wrap">${r.D}</td>
              <td class="wrap">${r.E}</td>
              <td>${tglSTFormatted}</td>
              <td>${tglMulaiFormatted}</td>
              <td style="text-align:right;">${jumlahFormatted}</td>
              <td>${r.N}</td>
              <td class="${statusClass}">${r.P}</td>
              <td class="actions">
                  <button class="btn-copy" data-tooltip="Salin Uraian"><i class="fa-solid fa-clipboard"></i></button>
                  <button class="btn-ubah" data-tooltip="Ubah"><i class="fa-solid fa-pen-to-square"></i></button>
                  <button class="btn-pelaksana" data-tooltip="Pelaksana"><i class="fa-solid fa-user-check"></i></button>
                  <button class="btn-lpt" data-tooltip="LPT"><i class="fa-solid fa-file-lines"></i></button>
                  <button class="btn-bayar" data-tooltip="Bayar"><i class="fa-solid fa-hand-holding-dollar"></i></button>
                  <button class="btn-sp2d" data-tooltip="SP2D"><i class="fa-solid fa-money-bill-transfer"></i></button>
                  <button class="btn-hapus" data-tooltip="Hapus"><i class="fa-solid fa-trash"></i></button>
              </td>
            `;

            tbody.appendChild(tr);
          
          // TAMBAHKAN DI SINI
             // document.getElementById("btnOpenNominatif").addEventListener("click", openNominatifPopup);

    //await loadData(true);
          
        });
        
        kalkulasiTotalJumlah(rows);

    //document.getElementById("btnOpenNominatif").addEventListener("click", openNominatifPopup);

    }
let firstLoad = true; // untuk overlay hanya saat load pertama

  
async function loadData(showOverlay = true){
    try{
        if(showOverlay && firstLoad) showLoading(true);

        const res = await fetch(`${urlGAS}?kantor=${kantor}`);
        const data = await res.json();

        if(showOverlay && firstLoad) showLoading(false);

        if(data.status !== "success") return;

        allRows = data.rows;
        pegawaiList = data.pegawai || [];
        lokasiList = data.lokasi || [];
        
        populateDatalist();

        const defaultRadio = document.querySelector('input[name="statusFilter"]:checked').value;

        // skip row 2 & 3 saat load pertama
        const initialRows = allRows.filter((r, idx) => idx !== 1 && idx !== 2);
        const filtered = filterByStatus(initialRows, defaultRadio);
        renderTable(filtered);

        firstLoad = false; // overlay only once
    } catch(e){
        if(showOverlay && firstLoad) showLoading(false);
        console.error(e);
    }
}

    document.getElementById("btnOpenNominatif").addEventListener("click", openNominatifPopup);
  
 // load pertama (dengan overlay)
    await loadData(true);

  
// 🔁 Reload data tiap 30 detik
    //setInterval(() => {
        //loadData();
    //}, 30000); // 30000ms = 30 detik

    // Tombol manual Refresh Data
    document.getElementById("btnRefreshData").addEventListener("click", function(){
        firstLoad = true; // Set ke true agar overlay loading paksa muncul
        loadData(true);
    });

  
    // search box utama
    document.getElementById("searchBox").addEventListener("input", function(){
        const val = this.value.toLowerCase();
        const radioVal = document.querySelector('input[name="statusFilter"]:checked').value;
        let filtered = filterByStatus(allRows, radioVal);
    
        if(val){
            filtered = filtered.filter(r =>
                Object.keys(r)
                      .filter(k => k !== "N") // skip kolom User
                      .some(k => String(r[k]||"").toLowerCase().includes(val))
            );
        }
    
        renderTable(filtered);
    });

    // Fitur Pencarian Berdasarkan Nomor SPM (Sesuai aslinya di Sheets)
    document.getElementById("btnSearchSPM").addEventListener("click", function(){
        let valBox = document.getElementById("spmSearchBox").value.trim();
        if(!valBox) {
            alert("Masukkan nomor SPM terlebih dahulu!");
            return;
        }

        // Bandingkan nilai string langsung apa adanya ATAU secara angka murni
        let filtered = allRows.filter(r => {
            let spmSheet = String(r.R || "").trim();
            return spmSheet === valBox || parseInt(spmSheet, 10) === parseInt(valBox, 10);
        });
        
        // Atur radio filter ke "Semua" agar data status apa pun yang cocok dapat muncul
        document.querySelector('input[name="statusFilter"][value="Semua"]').checked = true;
        
        renderTable(filtered);
        if(filtered.length === 0){
            alert("Data dengan Nomor SPM " + valBox + " tidak ditemukan.");
        }
    });


    // radio filter
    document.querySelectorAll('input[name="statusFilter"]').forEach(rb=>{
        rb.addEventListener("change", function(){
            const val = this.value;
            const searchVal = document.getElementById("searchBox").value.toLowerCase();
            let filtered = filterByStatus(allRows, val);

            if(searchVal){
                filtered = filtered.filter(r =>
                    Object.keys(r).some(k => String(r[k]||"").toLowerCase().includes(searchVal))
                );
            }

            renderTable(filtered);
        });
    });

    // tombol aksi
document.getElementById("dataTableBody").addEventListener("click", function(e){
    const btn = e.target.closest("button");
    if(!btn) return;
    const tr = btn.closest("tr");
    const idKegiatan = tr.dataset.id;
    const statusKegiatan = tr.cells[8].textContent; // kolom Status

        showCopyPopup(tr);
    }

            alert("Anda tidak memiliki kewenangan!");

        if(isAdmin || statusKegiatan === "Rekam Data"){
            showDeletePopup(tr);

            alert("Anda tidak memiliki kewenangan!");
        }
    }
    else if(btn.classList.contains("btn-pelaksana")){
        showPelaksanaPopup(tr);
    }

    else if(btn.classList.contains("btn-lpt")){
        showLPTPopup(tr);
    }

    let cleanNoST = targetUraianRaw;

        cleanNoST = parts[parts.length - 1].trim();

                    <th style="padding:10px; width:15%; text-align:center;">Aksi</th>

                    <td style="padding:12px 10px; color:#334155; word-break:break-word;">${teksOpsi1}</td>
                    <td style="padding:12px 10px; text-align:center;">
                        <button class="btn-copy-action" data-text="${teksOpsi1.replace(/"/g, '&quot;')}" style="padding:6px 12px; background:#0369a1; color:white; border:none; border-radius:6px; font-size:13px; cursor:pointer; font-weight:500;">Salin</button>
                    </td>
                </tr>
                <tr style="border-bottom:1px solid #e5e7eb;">
                    <td style="padding:12px 10px; font-weight:600; color:#475569;">Opsi 2</td>
                    <td style="padding:12px 10px; color:#334155; word-break:break-word;">${teksOpsi2}</td>
                    <td style="padding:12px 10px; text-align:center;">
                        <button class="btn-copy-action" data-text="${teksOpsi2.replace(/"/g, '&quot;')}" style="padding:6px 12px; background:#0369a1; color:white; border:none; border-radius:6px; font-size:13px; cursor:pointer; font-weight:500;">Salin</button>

            <button id="closeCopyPopup" style="padding:8px 16px; border:none; border-radius:6px; background:#e5e7eb; color:#475569; cursor:pointer; font-weight:500;">Tutup</button>
        </div>
    `;

    overlay.appendChild(popup);
    document.body.appendChild(overlay);

    document.getElementById("closeCopyPopup").onclick = () => overlay.remove();

    // Event handler klik tombol salin internal tabel popup
    popup.querySelectorAll(".btn-copy-action").forEach(button => {
        button.onclick = function() {
            const textToCopy = this.getAttribute("data-text");
            navigator.clipboard.writeText(textToCopy).then(() => {
                const originalText = this.innerText;
                this.innerText = "Tersalin!";
                this.style.background = "#22c55e";
                setTimeout(() => {
                    this.innerText = originalText;
                    this.style.background = "#0369a1";
                }, 1500);
            }).catch(err => {
                alert("Gagal menyalin teks.");
            });
        };
    });

<div id="pj-root" class="space-y-6">

    <!-- CARD: Ringkasan Status + Detail -->
    <div class="ios-panel p-5">

        <div class="flex flex-wrap items-center justify-between gap-4 mb-4">
            <h3 class="font-semibold text-sky-700 text-base">Ringkasan Status Perjadin</h3>

            <div class="flex flex-wrap items-center gap-4">
                <input id="pj-searchBox" type="text" placeholder="Cari MAK / uraian / tujuan..."
                    class="ios-field w-64">

                <div class="flex flex-wrap items-center gap-3 text-sm">
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="pj-statusFilter" value="Rekam Data" class="accent-sky-600"> Rekam Data</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="pj-statusFilter" value="Terlaksana" class="accent-sky-600"> Terlaksana</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="pj-statusFilter" value="LPT" class="accent-sky-600"> LPT</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="pj-statusFilter" value="Terbayar" class="accent-sky-600"> Terbayar</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="pj-statusFilter" value="Selesai" class="accent-sky-600"> Selesai</label>
                    <label class="flex items-center gap-1 cursor-pointer"><input type="radio" name="pj-statusFilter" value="Semua" checked class="accent-sky-600"> Semua</label>
                </div>
            </div>
        </div>

        <div class="flex flex-col lg:flex-row gap-5">

            <!-- Tabel Status -->
            <div class="w-full lg:w-72 flex-shrink-0">
                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-100">
                            <th class="p-2 text-left font-semibold border-b border-slate-200">Status</th>
                            <th class="p-2 text-center font-semibold border-b border-slate-200">Frek</th>
                            <th class="p-2 text-right font-semibold border-b border-slate-200">Jumlah</th>
                        </tr>
                    </thead>
                    <tbody id="pj-statusSummary">
                        <tr><td colspan="3" class="p-4 text-center text-slate-400">Memuat...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Tabel Detail -->
            <div class="flex-1 border border-slate-200 rounded-xl overflow-auto max-h-[350px]">
                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-100 sticky top-0">
                            <th class="p-2 text-left font-semibold border-b border-slate-200">MAK</th>
                            <th class="p-2 text-left font-semibold border-b border-slate-200">Uraian</th>
                            <th class="p-2 text-left font-semibold border-b border-slate-200">Tujuan</th>
                            <th class="p-2 text-left font-semibold border-b border-slate-200">Tgl Mulai</th>
                            <th class="p-2 text-left font-semibold border-b border-slate-200">Tgl Selesai</th>
                            <th class="p-2 text-right font-semibold border-b border-slate-200">Jumlah</th>
                            <th class="p-2 text-center font-semibold border-b border-slate-200">Status</th>
                        </tr>
                    </thead>
                    <tbody id="pj-detailBody">
                        <tr><td colspan="7" class="p-6 text-center text-sky-600"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></td></tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>

    <!-- BOTTOM CARDS -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-5">

        <div class="ios-panel p-5">
            <h3 class="font-semibold text-sky-700 mb-3">Lokasi Favorit</h3>
            <div class="overflow-auto max-h-[280px]">
                <table class="w-full text-sm border-collapse">
                    <thead>
                        <tr class="bg-slate-100">
                            <th class="p-2 text-left font-semibold border-b border-slate-200">No</th>
                            <th class="p-2 text-left font-semibold border-b border-slate-200">Lokasi</th>
                            <th class="p-2 text-right font-semibold border-b border-slate-200">Frek</th>
                        </tr>
                    </thead>
                    <tbody id="pj-lokasiBody"></tbody>
                </table>
            </div>
        </div>

        <div class="ios-panel p-5">
            <h3 class="font-semibold text-sky-700 mb-3">Jenis Perjadin</h3>
            <table class="w-full text-sm border-collapse">
                <thead>
                    <tr class="bg-slate-100">
                        <th class="p-2 text-left font-semibold border-b border-slate-200">Jenis</th>
                        <th class="p-2 text-right font-semibold border-b border-slate-200">Frek</th>
                    </tr>
                </thead>
                <tbody id="pj-jenisBody">
                    <tr><td class="p-2 border-b border-slate-100">Luar Kota</td><td class="p-2 border-b border-slate-100 text-right">0</td></tr>
                    <tr><td class="p-2">Dalam Kota</td><td class="p-2 text-right">0</td></tr>
                </tbody>
            </table>
        </div>

        <div class="ios-panel p-5">
            <h3 class="font-semibold text-sky-700 mb-3">Grafik Perjadin</h3>
            <canvas id="pj-chartPerjadin" height="220"></canvas>
        </div>

    </div>

</div>

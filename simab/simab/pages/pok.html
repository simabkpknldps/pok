<div class="ios-panel p-5">
    <div class="flex flex-col md:flex-row gap-3 mb-4 items-center">
        <input type="text" id="searchPok" oninput="searchPok()" placeholder="Cari kode / uraian..." class="ios-field flex-1">
        <button id="toggleExpandBtn" onclick="toggleExpandAll()" class="btn-ios px-4 py-2.5 text-sm whitespace-nowrap flex items-center gap-2">
            <i class="fa-solid fa-expand text-xs"></i> Expand All
        </button>
    </div>

    <div class="pok-table-container rounded-xl max-h-[70vh] overflow-y-auto" style="border: 1px solid var(--divider);">
        <table class="w-full text-sm">
            <tbody id="pok-tbody">
                <tr><td colspan="8" class="text-center p-6" style="color: var(--label-secondary);"><i class="fa-solid fa-spinner fa-spin mr-2" style="color: var(--ios-blue);"></i>Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Modal Rekam Kegiatan -->
<div id="rekamModal" class="fixed inset-0 hidden items-center justify-center z-50" style="background: rgba(0,0,0,0.35); backdrop-filter: blur(3px);">
    <div class="rounded-2xl w-[980px] max-w-[96vw] overflow-hidden" style="background: #fff; box-shadow: 0 24px 60px -12px rgba(0,0,0,0.4);">
        <div class="px-6 py-4 flex justify-between items-center" style="background: var(--ios-blue); color: #fff;">
            <h2 class="text-[17px] font-semibold"><i class="fa-solid fa-pen-to-square mr-2"></i>Rekam Kegiatan</h2>
            <button onclick="closeRekamModal()" class="w-8 h-8 rounded-full transition" style="background: rgba(255,255,255,0.15);" onmouseover="this.style.background='rgba(255,255,255,0.28)'" onmouseout="this.style.background='rgba(255,255,255,0.15)'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="grid grid-cols-2 gap-8 p-6">
            <div class="space-y-3">
                <div>
                    <label class="ios-label block mb-1">ID Usulan</label>
                    <input readonly id="idUsulan" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">No ST/ND / Uraian Kegiatan</label>
                    <input id="uraianKegiatan" class="ios-field">
                </div>
                <div>
                    <label class="ios-label block mb-1">Tgl ST/ND</label>
                    <input type="date" id="tglSt" class="ios-field">
                </div>
                <div>
                    <label class="ios-label block mb-1">Estimasi Biaya</label>
                    <input id="estimasiBiaya" oninput="cekKecukupanDana()" onkeyup="this.value = formatRibuan(this.value)" class="ios-field">
                </div>
                <div>
                    <label class="ios-label block mb-1">Status Kecukupan Dana</label>
                    <input readonly id="statusDana" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Tujuan</label>
                    <input list="listTujuan" id="inputTujuan" class="ios-field">
                    <datalist id="listTujuan"></datalist>
                </div>
            </div>

            <div class="space-y-3">
                <div>
                    <label class="ios-label block mb-1">MAK</label>
                    <input readonly id="mak" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Uraian MAK</label>
                    <input readonly id="uraianMak" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Pagu</label>
                    <input readonly id="pagu" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Blokir</label>
                    <input readonly id="blokir" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Realisasi</label>
                    <input readonly id="realisasi" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Sisa</label>
                    <input readonly id="sisa" class="ios-field" style="color: var(--label-secondary);">
                </div>
            </div>
        </div>

        <div class="px-6 py-4 flex justify-end gap-3" style="background: var(--sidebar-bg); border-top: 1px solid var(--divider);">
            <button onclick="closeRekamModal()" class="btn-ios-secondary px-5 py-2.5 text-sm">
                <i class="fa-solid fa-right-from-bracket mr-2"></i>Batal
            </button>
            <button id="btnSimpan" onclick="simpanData()" class="btn-ios px-5 py-2.5 text-sm">
                <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan
            </button>
        </div>
    </div>
</div>

<!-- Modal Detil Kegiatan -->
<div id="detilModal" class="fixed inset-0 hidden items-center justify-center z-50" style="background: rgba(0,0,0,0.35); backdrop-filter: blur(3px);">
    <div class="rounded-2xl w-[980px] max-w-[96vw] overflow-hidden" style="background: #fff; box-shadow: 0 24px 60px -12px rgba(0,0,0,0.4);">
        <div class="px-6 py-4 flex justify-between items-center" style="background: var(--label); color: #fff;">
            <h2 class="text-[16px] font-semibold flex items-center gap-2" id="detilTitle"><i class="fa-solid fa-list-check"></i> Detil Kegiatan</h2>
            <button onclick="document.getElementById('detilModal').classList.replace('flex', 'hidden')" style="color: rgba(255,255,255,0.7);" onmouseover="this.style.color='#fff'" onmouseout="this.style.color='rgba(255,255,255,0.7)'">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>
        <div class="p-6">
            <input type="text" id="cariDetil" oninput="filterDetil()" placeholder="Cari uraian / nomor ST..." class="ios-field mb-4">
            <div class="w-full text-sm">
                <div class="flex p-3 font-semibold items-center text-xs rounded-t-lg" style="background: var(--sidebar-bg); color: var(--label-secondary); border-bottom: 1px solid var(--divider);">
                    <div class="w-[30%]">Uraian/ST</div>
                    <div class="w-[12%]">Pelaksana</div>
                    <div class="w-[18%]">Tujuan</div>
                    <div class="w-[10%]">Tgl</div>
                    <div class="w-[12%] text-right">Jumlah</div>
                    <div class="w-[10%] text-center">Status</div>
                    <div class="w-[8%] text-center">Aksi</div>
                </div>
                <div id="detil-tbody" class="max-h-[60vh] overflow-y-auto"></div>
            </div>
        </div>
    </div>
</div>


<!-- Modal Pelaksana Kegiatan -->
<div id="pelaksanaModal" class="fixed inset-0 hidden items-center justify-center z-50" style="background: rgba(0,0,0,0.35); backdrop-filter: blur(3px);">
    <div class="rounded-2xl w-[980px] max-w-[96vw] overflow-hidden" style="background: #fff; box-shadow: 0 24px 60px -12px rgba(0,0,0,0.4);">
        <div class="px-6 py-4 flex justify-between items-center" style="background: var(--label); color: #fff;">
            <h2 class="text-[17px] font-semibold"><i class="fa-solid fa-users mr-2"></i>Pelaksana Kegiatan #<span id="pelaksanaKodeKegiatan"></span></h2>
            <button onclick="closePelaksanaModal()" class="w-8 h-8 rounded-full transition" style="background: rgba(255,255,255,0.12);" onmouseover="this.style.background='rgba(255,255,255,0.25)'" onmouseout="this.style.background='rgba(255,255,255,0.12)'">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <div class="p-6 space-y-6">
            <!-- Data Kegiatan (Read-only) -->
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="ios-label block mb-1">MAK</label>
                    <input readonly id="pelaksanaMak" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Uraian</label>
                    <input readonly id="pelaksanaUraian" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Tujuan</label>
                    <input readonly id="pelaksanaTujuan" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">User</label>
                    <input readonly id="pelaksanaUser" class="ios-field" style="color: var(--label-secondary);">
                </div>
                <div>
                    <label class="ios-label block mb-1">Tgl ST/ND</label>
                    <input readonly id="pelaksanaTglSt" type="date" class="ios-field" style="color: var(--label-secondary);">
                </div>
            </div>

            <!-- Input Pelaksana -->
            <div class="pt-4" style="border-top: 1px solid var(--divider);">
                <div class="flex gap-3 items-end">
                    <div class="flex-1">
                        <label class="ios-label block mb-1">Pelaksana</label>
                        <input list="listPelaksana" id="inputPelaksana" placeholder="Ketik nama pelaksana..." class="ios-field">
                        <datalist id="listPelaksana"></datalist>
                    </div>
                    <button onclick="submitPelaksana()" class="btn-ios px-4 py-2.5 text-sm whitespace-nowrap">
                        <i class="fa-solid fa-plus mr-1"></i> Submit
                    </button>
                </div>
            </div>

            <!-- Tabel Pelaksana -->
            <div class="rounded-xl overflow-hidden" style="border: 1px solid var(--divider);">
                <div class="p-3 font-semibold text-xs flex" style="background: var(--sidebar-bg); color: var(--label-secondary); border-bottom: 1px solid var(--divider);">
                    <div class="w-[30%]">Nama</div>
                    <div class="w-[20%]">Tgl Mulai</div>
                    <div class="w-[20%]">Tgl Selesai</div>
                    <div class="w-[15%]">Jumlah</div>
                    <div class="w-[15%] text-center">Aksi</div>
                </div>
                <div id="pelaksanaTableBody" class="max-h-[40vh] overflow-y-auto"></div>
            </div>
        </div>

        <div class="px-6 py-4 flex justify-end gap-3" style="background: var(--sidebar-bg); border-top: 1px solid var(--divider);">
            <button onclick="closePelaksanaModal()" class="btn-ios-secondary px-5 py-2.5 text-sm">
                <i class="fa-solid fa-times mr-2"></i> Batal
            </button>
            <button id="btnSimpanPelaksana" onclick="simpanPelaksana()" class="btn-ios px-5 py-2.5 text-sm" style="background: var(--ios-green);">
                <i class="fa-solid fa-floppy-disk mr-2"></i> Simpan
            </button>
        </div>
    </div>
</div>

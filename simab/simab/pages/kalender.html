<div id="kl-root" class="flex flex-col lg:flex-row gap-5 items-start">

    <!-- CARD KALENDER -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 w-full lg:flex-[2]">

        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <button id="kl-btnPrevMonth" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-sm">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="flex items-center gap-2 text-sm">
                <label class="flex items-center gap-1">
                    Bulan:
                    <select id="kl-monthSelect" class="px-2 py-1.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500"></select>
                </label>
                <label class="flex items-center gap-1">
                    Tahun:
                    <select id="kl-yearSelect" class="px-2 py-1.5 border border-slate-300 rounded-lg text-sm bg-slate-50 focus:outline-none focus:ring-2 focus:ring-sky-500"></select>
                </label>
            </div>

            <button id="kl-btnNextMonth" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white rounded-lg text-sm">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <table class="w-full border-collapse text-center text-sm table-fixed">
            <thead>
                <tr>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Minggu</th>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Senin</th>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Selasa</th>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Rabu</th>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Kamis</th>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Jumat</th>
                    <th class="p-2 bg-slate-100 border border-slate-200 font-semibold">Sabtu</th>
                </tr>
            </thead>
            <tbody id="kl-calendarBody">
                <!-- di-generate JS -->
            </tbody>
        </table>

        <p class="text-xs text-slate-400 mt-3">Klik salah satu tanggal untuk melihat detail kegiatan di panel kanan.</p>
    </div>

    <!-- CARD DETAIL (menggantikan popup) -->
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 w-full lg:flex-[1] lg:min-w-[320px] lg:sticky lg:top-4">

        <h3 id="kl-detailTitle" class="font-semibold text-sky-700 text-base mb-3">Detail Kegiatan</h3>

        <input id="kl-searchDetail" type="text" placeholder="Cari uraian, pelaksana, tujuan, status..."
            class="w-full mb-3 px-3 py-2 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">

        <div class="overflow-auto max-h-[520px] border border-slate-200 rounded-xl">
            <table class="w-full text-sm border-collapse">
                <thead>
                    <tr class="bg-slate-100 sticky top-0">
                        <th class="p-2 text-left font-semibold border-b border-slate-200">Uraian</th>
                        <th class="p-2 text-left font-semibold border-b border-slate-200">Pelaksana</th>
                        <th class="p-2 text-left font-semibold border-b border-slate-200">Tujuan</th>
                        <th class="p-2 text-left font-semibold border-b border-slate-200">Status</th>
                    </tr>
                </thead>
                <tbody id="kl-detailBody">
                    <tr>
                        <td colspan="4" class="p-6 text-center text-slate-400">
                            Klik salah satu tanggal pada kalender untuk melihat detail kegiatan.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

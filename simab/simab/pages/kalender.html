<div id="kl-root" class="relative flex flex-col lg:flex-row gap-5 items-stretch">

    <!-- OVERLAY LOADING -->
    <div id="kl-loadingOverlay" class="hidden absolute inset-0 z-20 rounded-2xl flex flex-col items-center justify-center gap-2" style="background: rgba(255,255,255,0.75); backdrop-filter: blur(4px);">
        <i class="fa-solid fa-spinner fa-spin text-3xl" style="color: var(--ios-blue);"></i>
        <span class="text-sm font-medium" style="color: var(--label-secondary);">Memuat data kalender...</span>
    </div>

    <!-- CARD KALENDER -->
    <div class="ios-panel p-5 w-full lg:flex-[2]">

        <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
            <button id="kl-btnPrevMonth" class="btn-ios px-3 py-1.5 text-sm">
                <i class="fa-solid fa-chevron-left"></i>
            </button>

            <div class="flex items-center gap-2 text-sm" style="color: var(--label-secondary);">
                <label class="flex items-center gap-1">
                    Bulan:
                    <select id="kl-monthSelect" class="ios-field" style="padding: 0.4rem 0.6rem;"></select>
                </label>
                <label class="flex items-center gap-1">
                    Tahun:
                    <select id="kl-yearSelect" class="ios-field" style="padding: 0.4rem 0.6rem;"></select>
                </label>
            </div>

            <button id="kl-btnNextMonth" class="btn-ios px-3 py-1.5 text-sm">
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </div>

        <table class="w-full border-collapse text-center text-sm table-fixed">
            <thead>
                <tr>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Minggu</th>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Senin</th>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Selasa</th>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Rabu</th>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Kamis</th>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Jumat</th>
                    <th class="p-2 font-semibold" style="background: var(--sidebar-bg); border: 1px solid var(--divider); color: var(--label-secondary);">Sabtu</th>
                </tr>
            </thead>
            <tbody id="kl-calendarBody">
                <!-- di-generate JS -->
            </tbody>
        </table>

        <p class="text-xs mt-3" style="color: var(--label-secondary);">Klik salah satu tanggal untuk melihat detail kegiatan di panel kanan.</p>
    </div>

    <!-- CARD DETAIL (menggantikan popup) -->
    <div class="ios-panel p-5 w-full lg:flex-[1] lg:min-w-[320px]">

        <h3 id="kl-detailTitle" class="font-semibold text-base mb-3" style="color: var(--label);">Detail Kegiatan</h3>

        <input id="kl-searchDetail" type="text" placeholder="Cari uraian, pelaksana, tujuan, status..." class="w-full mb-3 ios-field">

        <div class="overflow-auto max-h-[520px] rounded-xl" style="border: 1px solid var(--divider);">
            <table class="w-full text-sm border-collapse">
                <thead>
                    <tr class="sticky top-0" style="background: var(--sidebar-bg);">
                        <th class="p-2 text-left font-semibold" style="border-bottom: 1px solid var(--divider); color: var(--label-secondary);">Uraian</th>
                        <th class="p-2 text-left font-semibold" style="border-bottom: 1px solid var(--divider); color: var(--label-secondary);">Pelaksana</th>
                        <th class="p-2 text-left font-semibold" style="border-bottom: 1px solid var(--divider); color: var(--label-secondary);">Tujuan</th>
                        <th class="p-2 text-left font-semibold" style="border-bottom: 1px solid var(--divider); color: var(--label-secondary);">Status</th>
                    </tr>
                </thead>
                <tbody id="kl-detailBody">
                    <tr>
                        <td colspan="4" class="p-6 text-center" style="color: var(--label-secondary);">
                            Klik salah satu tanggal pada kalender untuk melihat detail kegiatan.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>


</div>

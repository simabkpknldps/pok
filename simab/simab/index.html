<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️Login SiMAB</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0284c7">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SiMAB">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

    <!-- Dekorasi background minimalis -->
    <div class="pointer-events-none absolute -top-24 -left-24 w-72 h-72 bg-sky-100 rounded-full blur-3xl opacity-70"></div>
    <div class="pointer-events-none absolute -bottom-24 -right-24 w-72 h-72 bg-sky-200 rounded-full blur-3xl opacity-60"></div>

    <div class="relative w-full max-w-sm">
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-200">

            <div class="mb-8 text-center">
                <div class="w-14 h-14 rounded-2xl bg-sky-50 border border-sky-100 flex items-center justify-center mx-auto mb-4">
                    <i class="fa-solid fa-shield-halved text-sky-600 text-2xl"></i>
                </div>
                <h1 class="text-2xl font-bold text-slate-800">SiMAB</h1>
                <p class="text-xs text-slate-400 tracking-widest font-semibold mt-1">SISTEM MONITORING ANGGARAN BELANJA</p>
            </div>

            <p id="sessionNotice" class="hidden text-amber-600 text-xs bg-amber-50 border border-amber-100 rounded-lg px-3 py-2 mb-4"></p>

            <form id="loginForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">NIP</label>
                    <div class="relative">
                        <i class="fa-regular fa-id-card absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="text" id="nip" placeholder="Masukkan NIP" required autocomplete="username"
                            class="w-full pl-11 pr-4 py-3 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                        <input type="password" id="password" placeholder="Masukkan password" required autocomplete="current-password"
                            class="w-full pl-11 pr-11 py-3 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                        <button type="button" id="togglePassword" tabindex="-1"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-sky-600 transition">
                            <i class="fa-regular fa-eye text-sm"></i>
                        </button>
                    </div>
                </div>

                <p id="loginError" class="hidden text-red-500 text-xs bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>

                <button type="submit" id="loginBtn"
                    class="w-full bg-sky-600 text-white py-3 rounded-xl font-semibold hover:bg-sky-700 active:bg-sky-800 transition flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    <span id="loginBtnText">Masuk</span>
                </button>

                <p class="text-center text-sm text-slate-500">
                    Buat Akun? <a href="#" id="daftarLink" class="text-sky-600 font-semibold hover:underline">Daftar Di sini!</a>
                </p>
            </form>
        </div>

        <p class="text-center text-xs text-slate-400 mt-6">&copy; <span id="tahunFooter"></span> SiMAB &mdash; KPKNL Denpasar</p>
    </div>

    <!-- Modal Daftar Akun -->
    <div id="daftarModal" class="hidden fixed inset-0 bg-black/40 items-center justify-center p-4 z-50">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-lg border border-slate-200 p-6 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-bold text-slate-800">Daftar Akun</h2>
                <button type="button" id="daftarCloseBtn" class="text-slate-400 hover:text-slate-600 text-lg">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="daftarStep1">
                <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">NIP</label>
                <div class="flex gap-2">
                    <input type="text" id="daftarCekNip" placeholder="Masukkan NIP"
                        class="flex-1 px-3 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                    <button type="button" id="daftarBtnCek"
                        class="px-4 py-2.5 bg-sky-600 hover:bg-sky-700 text-white rounded-xl text-sm font-semibold shrink-0">
                        Cek
                    </button>
                </div>
                <p id="daftarCekMsg" class="hidden text-xs px-3 py-2 rounded-lg mt-3"></p>
            </div>

            <div id="daftarStep2" class="hidden space-y-3 mt-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">Nama</label>
                    <input type="text" id="daftarNama"
                        class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">NIP</label>
                    <input type="text" id="daftarNip"
                        class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">Jabatan</label>
                    <input type="text" id="daftarJabatan"
                        class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">Pangkat</label>
                    <input type="text" id="daftarPangkat"
                        class="w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1.5 ml-0.5">Status</label>
                    <!-- Kalau NIP ketemu: teks read-only. Kalau tidak ketemu: dropdown pilihan. -->
                    <input type="text" id="daftarStatusText" readonly
                        class="hidden w-full px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-100 text-slate-500 text-sm cursor-not-allowed">
                    <select id="daftarStatusSelect"
                        class="hidden w-full px-3 py-2.5 rounded-xl border border-slate-300 focus:border-sky-500 focus:ring-2 focus:ring-sky-100 outline-none transition text-sm">
                        <option value="1">PNS</option>
                        <option value="0">PPNPN</option>
                    </select>
                </div>

                <p id="daftarKeteranganDitemukan" class="hidden text-xs text-slate-400 italic">
                    Data dapat diubah pada menu setting saat berhasil login
                </p>

                <p id="daftarError" class="hidden text-red-500 text-xs bg-red-50 border border-red-100 rounded-lg px-3 py-2"></p>
                <p id="daftarSuccess" class="hidden text-emerald-600 text-xs bg-emerald-50 border border-emerald-100 rounded-lg px-3 py-2"></p>

                <button type="button" id="daftarBtnSimpan"
                    class="w-full bg-sky-600 text-white py-2.5 rounded-xl font-semibold hover:bg-sky-700 active:bg-sky-800 transition flex items-center justify-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-user-plus"></i>
                    <span id="daftarBtnSimpanText">Daftar</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('tahunFooter').textContent = new Date().getFullYear();

        // Tampilkan pesan jika datang dari auto-logout (idle 1 jam) atau logout manual
        (function checkLogoutReason() {
            const params = new URLSearchParams(window.location.search);
            const reason = params.get('reason');
            if (reason === 'idle') {
                const box = document.getElementById('sessionNotice');
                box.textContent = 'Sesi Anda berakhir karena tidak ada aktivitas selama 1 jam. Silakan login kembali.';
                box.classList.remove('hidden');
            } else if (reason === 'logout') {
                const box = document.getElementById('sessionNotice');
                box.textContent = 'Anda telah berhasil logout.';
                box.classList.remove('hidden');
            }
        })();

        // MASUKKAN URL DARI "GAS REDIRECTOR" ANDA DI SINI
        const redirectorUrl = "https://script.google.com/macros/s/AKfycbxhclFUTLCSzjQHK-W-dyZgF3dFeF5SaJEk6JvdhMU_6HA9Bs_avFb9G25gPrWT1XxXxA/exec";

        // Toggle tampil/sembunyi password
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwInput = document.getElementById('password');
            const icon = this.querySelector('i');
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isHidden);
            icon.classList.toggle('fa-eye-slash', isHidden);
        });

        function showLoginError(message) {
            const errBox = document.getElementById('loginError');
            errBox.textContent = message;
            errBox.classList.remove('hidden');
        }

        function hideLoginError() {
            document.getElementById('loginError').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideLoginError();

            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            btn.disabled = true;
            btnText.textContent = 'Memproses...';
            btn.querySelector('i').className = 'fa-solid fa-spinner fa-spin';

            try {
                // 1. Ambil URL GAS Utama yang dinamis dari Redirector
                const resUrl = await fetch(redirectorUrl);
                const realUrl = await resUrl.text();

                // 2. Gunakan URL tersebut untuk proses login
                const res = await fetch(realUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'login',
                        nip: document.getElementById('nip').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    localStorage.setItem('nama', data.nama);
                    localStorage.setItem('nip', data.nip);
                    localStorage.setItem('realUrl', realUrl); // Simpan agar dashboard tahu URL-nya
                    localStorage.setItem('admin', data.admin);
                    localStorage.setItem('jabatan', data.jabatan);
                    localStorage.setItem('pangkat', data.pangkat);
                    localStorage.setItem('kepeg', data.kepeg);
                    localStorage.setItem('aksesMenu', data.aksesMenu);
                    localStorage.setItem('lastActivity', Date.now().toString());
                    window.location.href = 'dashboard.html';
                } else {
                    showLoginError(data.message || 'NIP atau password salah.');
                }
            } catch (err) {
                showLoginError('Koneksi ke server gagal, pastikan redirector aktif.');
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Masuk';
                btn.querySelector('i').className = 'fa-solid fa-arrow-right-to-bracket';
            }
        });

        // =====================================================================
        // Modal Daftar Akun
        // =====================================================================
        const daftarModal = document.getElementById('daftarModal');
        const daftarStep1 = document.getElementById('daftarStep1');
        const daftarStep2 = document.getElementById('daftarStep2');
        const daftarCekMsg = document.getElementById('daftarCekMsg');
        const daftarError = document.getElementById('daftarError');
        const daftarSuccess = document.getElementById('daftarSuccess');

        // Dapatkan realUrl (URL GAS utama) lewat redirector, sama seperti proses login.
        async function getRealUrlForDaftar() {
            const resUrl = await fetch(redirectorUrl);
            return await resUrl.text();
        }

        function resetDaftarModal() {
            daftarStep1.classList.remove('hidden');
            daftarStep2.classList.add('hidden');
            document.getElementById('daftarCekNip').value = '';
            daftarCekMsg.classList.add('hidden');
            daftarError.classList.add('hidden');
            daftarSuccess.classList.add('hidden');
            document.getElementById('daftarNama').value = '';
            document.getElementById('daftarNip').value = '';
            document.getElementById('daftarJabatan').value = '';
            document.getElementById('daftarPangkat').value = '';
            document.getElementById('daftarStatusText').value = '';
            document.getElementById('daftarKeteranganDitemukan').classList.add('hidden');
        }

        document.getElementById('daftarLink').addEventListener('click', (e) => {
            e.preventDefault();
            resetDaftarModal();
            daftarModal.classList.remove('hidden');
            daftarModal.classList.add('flex');
        });

        document.getElementById('daftarCloseBtn').addEventListener('click', () => {
            daftarModal.classList.replace('flex', 'hidden');
        });

        document.getElementById('daftarBtnCek').addEventListener('click', async function () {
            const btn = this;
            const nip = document.getElementById('daftarCekNip').value.trim();
            daftarCekMsg.classList.add('hidden');

            if (!nip) {
                daftarCekMsg.textContent = 'NIP harus diisi.';
                daftarCekMsg.className = 'text-xs px-3 py-2 rounded-lg mt-3 text-red-600 bg-red-50 border border-red-100';
                daftarCekMsg.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const realUrl = await getRealUrlForDaftar();
                const res = await fetch(realUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'cekNip', nip })
                });
                const data = await res.json();

                if (data.status !== 'success') {
                    daftarCekMsg.textContent = data.message || 'Terjadi kesalahan saat memeriksa NIP.';
                    daftarCekMsg.className = 'text-xs px-3 py-2 rounded-lg mt-3 text-red-600 bg-red-50 border border-red-100';
                    daftarCekMsg.classList.remove('hidden');
                    return;
                }

                const namaEl = document.getElementById('daftarNama');
                const nipEl = document.getElementById('daftarNip');
                const jabatanEl = document.getElementById('daftarJabatan');
                const pangkatEl = document.getElementById('daftarPangkat');
                const statusTextEl = document.getElementById('daftarStatusText');
                const statusSelectEl = document.getElementById('daftarStatusSelect');
                const keteranganEl = document.getElementById('daftarKeteranganDitemukan');

                if (data.found) {
                    // NIP ditemukan -> semua field read-only, tampilkan data dari ref_pegawai
                    namaEl.value = data.nama || '';
                    nipEl.value = data.nip || '';
                    jabatanEl.value = data.jabatan || '';
                    pangkatEl.value = data.pangkat || '';
                    statusTextEl.value = (String(data.statusPegawai) === '1') ? 'PNS' : 'PPNPN';

                    [namaEl, nipEl, jabatanEl, pangkatEl].forEach(el => {
                        el.readOnly = true;
                        el.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                    });
                    statusTextEl.classList.remove('hidden');
                    statusSelectEl.classList.add('hidden');
                    keteranganEl.classList.remove('hidden');
                } else {
                    // NIP tidak ditemukan -> semua field aktif/bisa diisi, NIP terisi dari pencarian
                    namaEl.value = '';
                    nipEl.value = nip;
                    jabatanEl.value = '';
                    pangkatEl.value = '';
                    statusSelectEl.value = '1';

                    [namaEl, nipEl, jabatanEl, pangkatEl].forEach(el => {
                        el.readOnly = false;
                        el.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                    });
                    statusTextEl.classList.add('hidden');
                    statusSelectEl.classList.remove('hidden');
                    keteranganEl.classList.add('hidden');
                }

                daftarStep2.classList.remove('hidden');
            } catch (err) {
                daftarCekMsg.textContent = 'Koneksi ke server gagal, pastikan redirector aktif.';
                daftarCekMsg.className = 'text-xs px-3 py-2 rounded-lg mt-3 text-red-600 bg-red-50 border border-red-100';
                daftarCekMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });

        document.getElementById('daftarBtnSimpan').addEventListener('click', async function () {
            const btn = this;
            const btnText = document.getElementById('daftarBtnSimpanText');
            daftarError.classList.add('hidden');
            daftarSuccess.classList.add('hidden');

            const nama = document.getElementById('daftarNama').value.trim();
            const nip = document.getElementById('daftarNip').value.trim();
            const jabatan = document.getElementById('daftarJabatan').value.trim();
            const pangkat = document.getElementById('daftarPangkat').value.trim();
            const statusSelectEl = document.getElementById('daftarStatusSelect');
            const statusTextEl = document.getElementById('daftarStatusText');
            const status = statusSelectEl.classList.contains('hidden')
                ? (statusTextEl.value === 'PNS' ? '1' : '0')
                : statusSelectEl.value;

            if (!nama || !nip) {
                daftarError.textContent = 'Nama dan NIP harus diisi.';
                daftarError.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            const originalText = btnText.textContent;
            btnText.textContent = 'Memproses...';

            try {
                const realUrl = await getRealUrlForDaftar();
                const res = await fetch(realUrl, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'daftarPegawai',
                        nama, nip, jabatan, pangkat, status
                    })
                });
                const data = await res.json();

                if (data.status === 'success') {
                    daftarSuccess.textContent = data.message || 'Pendaftaran berhasil.';
                    daftarSuccess.classList.remove('hidden');
                    setTimeout(() => {
                        daftarModal.classList.replace('flex', 'hidden');
                    }, 2000);
                } else {
                    daftarError.textContent = data.message || 'Gagal mendaftar.';
                    daftarError.classList.remove('hidden');
                }
            } catch (err) {
                daftarError.textContent = 'Koneksi ke server gagal, pastikan redirector aktif.';
                daftarError.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.textContent = originalText;
            }
        });
    </script>

    <!-- PWA: daftarkan service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => {
                    console.error('SW registration gagal:', err);
                });
            });
        }
    </script>
</body>
</html>

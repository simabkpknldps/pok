<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️Login SiMAB</title>

    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f5f5f7">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="SiMAB">
    <meta name="mobile-web-app-capable" content="yes">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        :root {
            --sf: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --ios-blue: #0071E3;
            --ios-blue-press: #0059B3;
            --label: #1D1D1F;
            --label-secondary: #86868B;
            --field-bg: rgba(118,118,128,0.12);
        }
        * { -webkit-tap-highlight-color: transparent; }
        html, body { font-family: var(--sf); }

        /* Wallpaper ala macOS -- aurora gradient blur, statis (bukan foto,
           supaya tidak ada dependensi gambar eksternal). */
        .wallpaper {
            position: fixed; inset: 0; overflow: hidden; z-index: -1;
            background: linear-gradient(160deg, #FF9A6C 0%, #FF6B9D 22%, #A66CFF 45%, #5B8DEF 68%, #37C4E8 100%);
        }
        .wallpaper::before, .wallpaper::after {
            content: ""; position: absolute; border-radius: 9999px; filter: blur(90px);
        }
        .wallpaper::before { width: 60vw; height: 60vw; top: -15vw; left: -10vw; background: rgba(255,255,255,0.25); }
        .wallpaper::after { width: 55vw; height: 55vw; bottom: -20vw; right: -15vw; background: rgba(30,20,60,0.28); }

        .glass-card {
            background: rgba(255,255,255,0.68);
            backdrop-filter: blur(34px) saturate(160%);
            -webkit-backdrop-filter: blur(34px) saturate(160%);
            border: 0.5px solid rgba(255,255,255,0.5);
            box-shadow: 0 1px 1px rgba(255,255,255,0.6) inset, 0 20px 60px -12px rgba(0,0,0,0.35);
        }

        .app-icon {
            background: linear-gradient(160deg, #5B8DEF 0%, #0071E3 100%);
            box-shadow: 0 8px 20px -6px rgba(0,113,227,0.55), 0 1px 0 rgba(255,255,255,0.4) inset;
        }

        .ios-field {
            background: var(--field-bg);
            border: none;
            color: var(--label);
            font-family: var(--sf);
            border-radius: 12px;
            padding: 0.75rem 0.9rem;
            width: 100%;
            outline: none;
            font-size: 0.95rem;
            transition: background-color 0.15s ease, box-shadow 0.15s ease;
        }
        .ios-field::placeholder { color: var(--label-secondary); }
        .ios-field:focus { background: rgba(118,118,128,0.16); box-shadow: 0 0 0 3.5px rgba(0,113,227,0.22); }

        .ios-label {
            font-family: var(--sf);
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--label-secondary);
        }

        .btn-ios {
            background: var(--ios-blue);
            color: #fff;
            font-family: var(--sf);
            font-weight: 590;
            border-radius: 12px;
            transition: background-color 0.12s ease, transform 0.08s ease;
        }
        .btn-ios:hover { background: var(--ios-blue-press); }
        .btn-ios:active { transform: scale(0.98); }
        .btn-ios:disabled { opacity: 0.5; }

        .link-ios { color: var(--ios-blue); }
        .link-ios:hover { text-decoration: underline; }

        :focus-visible { outline: 2px solid var(--ios-blue); outline-offset: 2px; }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="color: var(--label);">

    <div class="wallpaper"></div>

    <div class="relative w-full max-w-[368px]">

        <div class="glass-card rounded-[28px] px-8 pt-9 pb-8">

            <div class="flex flex-col items-center mb-7">
                <div class="app-icon w-16 h-16 rounded-[18px] flex items-center justify-center mb-4">
                    <i class="fa-solid fa-shield-halved text-white text-2xl"></i>
                </div>
                <h1 class="text-[1.4rem] font-semibold tracking-tight" style="color: var(--label);">SiMAB</h1>
                <p class="text-[13px] mt-0.5" style="color: var(--label-secondary);">Sistem Monitoring Anggaran Belanja</p>
            </div>

            <p id="sessionNotice" class="hidden text-[13px] mb-5 px-3.5 py-2.5 rounded-xl text-center" style="background: rgba(0,113,227,0.1); color: var(--ios-blue);"></p>

            <form id="loginForm" class="space-y-3">
                <div>
                    <input type="text" id="nip" placeholder="NIP" required autocomplete="username" class="ios-field">
                </div>

                <div class="relative">
                    <input type="password" id="password" placeholder="Kata Sandi" required autocomplete="current-password" class="ios-field pr-10">
                    <button type="button" id="togglePassword" tabindex="-1"
                        class="absolute right-3 top-1/2 -translate-y-1/2 transition" style="color: var(--label-secondary);">
                        <i class="fa-regular fa-eye text-sm"></i>
                    </button>
                </div>

                <p id="loginError" class="hidden text-[13px] px-3.5 py-2.5 rounded-xl text-center" style="background: rgba(255,59,48,0.1); color: #FF3B30;"></p>

                <button type="submit" id="loginBtn"
                    class="btn-ios w-full py-3 text-[15px] flex items-center justify-center gap-2 disabled:cursor-not-allowed mt-4">
                    <span id="loginBtnText">Masuk</span>
                    <i class="fa-solid fa-arrow-right-to-bracket text-sm"></i>
                </button>
            </form>

            <p class="text-center text-[13px] mt-5" style="color: var(--label-secondary);">
                Belum punya akun? <a href="#" id="daftarLink" class="link-ios font-medium">Daftar</a>
            </p>
        </div>

        <p class="text-center text-[11px] mt-5" style="color: rgba(255,255,255,0.75); text-shadow: 0 1px 2px rgba(0,0,0,0.15);">&copy; <span id="tahunFooter"></span> SiMAB &mdash; KPKNL Denpasar</p>
    </div>

    <!-- Modal Daftar Akun -->
    <div id="daftarModal" class="hidden fixed inset-0 items-center justify-center p-4 z-50" style="background: rgba(0,0,0,0.35); backdrop-filter: blur(4px);">
        <div class="glass-card w-full max-w-sm rounded-[24px] p-6 max-h-[90vh] overflow-y-auto" style="background: rgba(255,255,255,0.85);">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-[1.2rem] font-semibold" style="color: var(--label);">Daftar Akun</h2>
                <button type="button" id="daftarCloseBtn" class="text-lg" style="color: var(--label-secondary);">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <div id="daftarStep1">
                <label class="ios-label block mb-1.5 ml-0.5">Kantor</label>
                <select id="daftarKantor" class="ios-field mb-3">
                    <option value="">-- Memuat daftar kantor... --</option>
                </select>

                <label class="ios-label block mb-1.5 ml-0.5">NIP</label>
                <div class="flex gap-2">
                    <input type="text" id="daftarCekNip" placeholder="Masukkan NIP" class="ios-field flex-1">
                    <button type="button" id="daftarBtnCek"
                        class="btn-ios px-4 text-[14px] shrink-0">
                        Cek
                    </button>
                </div>
                <p id="daftarCekMsg" class="hidden text-[13px] px-3.5 py-2.5 rounded-xl mt-3"></p>
            </div>

            <div id="daftarStep2" class="hidden space-y-3 mt-4">
                <div>
                    <label class="ios-label block mb-1.5 ml-0.5">Nama</label>
                    <input type="text" id="daftarNama" class="ios-field">
                </div>
                <div>
                    <label class="ios-label block mb-1.5 ml-0.5">NIP</label>
                    <input type="text" id="daftarNip" class="ios-field">
                </div>
                <div>
                    <label class="ios-label block mb-1.5 ml-0.5">Jabatan</label>
                    <input type="text" id="daftarJabatan" class="ios-field">
                </div>
                <div>
                    <label class="ios-label block mb-1.5 ml-0.5">Pangkat</label>
                    <select id="daftarPangkat" class="ios-field">
                        <option value="">-- Pilih Pangkat --</option>
                    </select>
                </div>
                <div>
                    <label class="ios-label block mb-1.5 ml-0.5">Status</label>
                    <!-- Kalau NIP ketemu: teks read-only. Kalau tidak ketemu: dropdown pilihan. -->
                    <input type="text" id="daftarStatusText" readonly class="hidden ios-field" style="color: var(--label-secondary);">
                    <select id="daftarStatusSelect" class="hidden ios-field">
                        <option value="1">PNS</option>
                        <option value="0">PPNPN</option>
                    </select>
                </div>

                <p id="daftarKeteranganDitemukan" class="hidden text-[12px] italic" style="color: var(--label-secondary);">
                    Data dapat diubah pada menu setting saat berhasil login
                </p>

                <p id="daftarError" class="hidden text-[13px] px-3.5 py-2.5 rounded-xl text-center" style="background: rgba(255,59,48,0.1); color: #FF3B30;"></p>
                <p id="daftarSuccess" class="hidden text-[13px] px-3.5 py-2.5 rounded-xl text-center" style="background: rgba(52,199,89,0.12); color: #248A3D;"></p>

                <button type="button" id="daftarBtnSimpan"
                    class="btn-ios w-full py-3 text-[15px] flex items-center justify-center gap-2 disabled:cursor-not-allowed">
                    <span id="daftarBtnSimpanText">Daftar</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Pilih Mode (khusus akun superadmin) -->
    <div id="modePilihModal" class="hidden fixed inset-0 items-center justify-center p-4 z-50" style="background: rgba(0,0,0,0.35); backdrop-filter: blur(4px);">
        <div class="glass-card w-full max-w-sm rounded-[24px] p-6" style="background: rgba(255,255,255,0.85);">
            <h2 class="text-[1.1rem] font-semibold mb-1 text-center" style="color: var(--label);">Masuk sebagai?</h2>
            <p class="text-[13px] text-center mb-5" style="color: var(--label-secondary);">Akun Anda punya akses SuperAdmin.</p>
            <div class="space-y-2.5">
                <button type="button" id="modePilihBiasaBtn" class="btn-ios w-full py-3 text-[14px]">
                    User Biasa <span class="opacity-75">(kantor sendiri)</span>
                </button>
                <button type="button" id="modePilihSuperadminBtn" class="w-full py-3 text-[14px] rounded-xl font-medium"
                    style="background: rgba(118,118,128,0.16); color: var(--label);">
                    SuperAdmin <span class="opacity-75">(kelola kantor lain)</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Modal: Pilih Kantor -->
    <div id="kantorPilihModal" class="hidden fixed inset-0 items-center justify-center p-4 z-50" style="background: rgba(0,0,0,0.35); backdrop-filter: blur(4px);">
        <div class="glass-card w-full max-w-sm rounded-[24px] p-6" style="background: rgba(255,255,255,0.85);">
            <h2 class="text-[1.1rem] font-semibold mb-1 text-center" style="color: var(--label);">Pilih Kantor</h2>
            <p id="kantorPilihSubtitle" class="text-[13px] text-center mb-5" style="color: var(--label-secondary);">Data yang Anda input akan tercatat di kantor ini.</p>
            <div id="kantorPilihList" class="space-y-2 max-h-72 overflow-y-auto">
                <!-- diisi JS -->
            </div>
            <p id="kantorPilihError" class="hidden text-[13px] px-3.5 py-2.5 rounded-xl text-center mt-3" style="background: rgba(255,59,48,0.1); color: #FF3B30;"></p>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>

    <script>
        document.getElementById('tahunFooter').textContent = new Date().getFullYear();

        // Tampilkan pesan jika datang dari auto-logout (idle 1 jam) atau logout manual
        (function checkLogoutReason() {
            const params = new URLSearchParams(window.location.search);
            const reason = params.get('reason');
            if (reason === 'idle') {
                const box = document.getElementById('sessionNotice');
                box.textContent = 'Sesi Anda berakhir karena tidak ada aktivitas selama 1 jam. Silakan login kembali.';
                box.classList.remove('hidden');
            } else if (reason === 'logout') {
                const box = document.getElementById('sessionNotice');
                box.textContent = 'Anda telah berhasil logout.';
                box.classList.remove('hidden');
            }
        })();

        // MASUKKAN URL DARI "GAS REDIRECTOR" ANDA DI SINI
        const redirectorUrl = "https://script.google.com/macros/s/AKfycbxhclFUTLCSzjQHK-W-dyZgF3dFeF5SaJEk6JvdhMU_6HA9Bs_avFb9G25gPrWT1XxXxA/exec";

        function nipToEmail(nip) {
            return `${String(nip).trim()}@simab.local`;
        }

        // Kode kantor utama (KPKNL Denpasar) -- satu-satunya yang punya
        // integrasi GAS ref_pegawai untuk fitur Cek NIP di form Daftar.
        const KANTOR_UTAMA_ID = '538065';

        // Dipakai bareng oleh handler login & modal pilih mode/kantor.
        let pendingProfil = null;

        // Lengkapi proses login: simpan semua localStorage & redirect.
        // forceAdmin=true dipakai saat superadmin memilih mode "SuperAdmin"
        // (dapat akses admin penuh di kantor manapun yg dipilih, terlepas
        // dari flag admin/aksesMenu pribadinya di kantor asal).
        //
        // Field 'akses_menu' pada profil yang dioper ke sini SUDAH final
        // (termasuk auto-akses kalau kantor+status aktif -- lihat
        // profilDenganAksesOtomatis), function ini tinggal simpan apa
        // adanya, tidak menghitung ulang.
        function finishLogin(profil, kantorId, forceAdmin) {
            localStorage.setItem('nama', profil.nama || '');
            localStorage.setItem('nip', profil.id || '');
            localStorage.setItem('admin', forceAdmin ? '1' : (profil.admin || ''));
            localStorage.setItem('jabatan', profil.jabatan || '');
            localStorage.setItem('pangkat', profil.pangkat || '');
            localStorage.setItem('kepeg', profil.kepeg || '');
            localStorage.setItem('aksesMenu', forceAdmin ? '1' : (profil.akses_menu || ''));
            localStorage.setItem('superadmin', profil.superadmin || '');
            localStorage.setItem('kantor', kantorId || '');
            localStorage.setItem('lastActivity', Date.now().toString());

            let redirectTarget = 'dashboard.html';
            try {
                const raw = localStorage.getItem('postLoginRedirect');
                if (raw) {
                    const titipan = JSON.parse(raw);
                    if (titipan && titipan.page && (Date.now() - titipan.ts) < 10 * 60 * 1000) {
                        redirectTarget = titipan.page;
                    }
                }
            } catch (e) { /* format titipan rusak -> abaikan */ }
            localStorage.removeItem('postLoginRedirect');

            window.location.href = redirectTarget;
        }

        // Kantor aktif + status pegawai aktif ('1') -> OTOMATIS dapat akses
        // penuh semua menu (setara tingkat 'aksesMenu'), TIDAK perlu admin
        // toggle akses_menu manual lagi. Field 'admin' TETAP murni manual
        // (tier admin/Data Rekening tidak ikut otomatis, harus tetap
        // ditoggle sendiri oleh admin/superadmin lain).
        // kantorAktifValid = status kantor (dari tabel kantor) utk kantor
        // yang SEDANG dipakai login ini -- BUKAN cuma kantor_id pegawai.
        function profilDenganAksesOtomatis(profil, kantorAktifValid) {
            if (kantorAktifValid && String(profil.status) === '1') {
                return { ...profil, akses_menu: '1' };
            }
            return profil;
        }

        // --- Modal: Pilih Mode (khusus superadmin) ---
        const modePilihModal = document.getElementById('modePilihModal');
        function showModePilihModal() {
            modePilihModal.classList.remove('hidden');
            modePilihModal.classList.add('flex');
        }
        document.getElementById('modePilihBiasaBtn').addEventListener('click', async () => {
            modePilihModal.classList.replace('flex', 'hidden');
            let kantorAktifValid = false;
            if (pendingProfil.kantor_id) {
                const { data: kantorAsal } = await sb.from('kantor').select('status').eq('id', pendingProfil.kantor_id).maybeSingle();
                kantorAktifValid = !!(kantorAsal && kantorAsal.status === 'aktif');
            }
            const profilFinal = profilDenganAksesOtomatis(pendingProfil, kantorAktifValid);
            finishLogin(profilFinal, pendingProfil.kantor_id || '', false);
        });
        document.getElementById('modePilihSuperadminBtn').addEventListener('click', async () => {
            modePilihModal.classList.replace('flex', 'hidden');
            await showKantorPilihModal({ semuaKantor: true, forceAdmin: true });
        });

        // --- Modal: Pilih Kantor ---
        const kantorPilihModal = document.getElementById('kantorPilihModal');
        async function showKantorPilihModal({ semuaKantor, forceAdmin }) {
            const listEl = document.getElementById('kantorPilihList');
            const errEl = document.getElementById('kantorPilihError');
            const subtitleEl = document.getElementById('kantorPilihSubtitle');
            errEl.classList.add('hidden');
            subtitleEl.textContent = forceAdmin
                ? 'Pilih kantor yang ingin Anda kelola sebagai SuperAdmin.'
                : 'Kantor asal Anda belum terdaftar / sedang nonaktif. Pilih kantor tujuan untuk data Perbantuan/Perjadin Anda.';
            listEl.innerHTML = '<div class="text-center py-4"><i class="fa-solid fa-spinner fa-spin" style="color: var(--label-secondary);"></i></div>';
            kantorPilihModal.classList.remove('hidden');
            kantorPilihModal.classList.add('flex');

            try {
                const { data, error } = await sb.from('kantor').select('id,nama').eq('status', 'aktif').order('nama');
                if (error) throw error;
                if (!data || data.length === 0) {
                    listEl.innerHTML = '';
                    errEl.textContent = 'Belum ada kantor terdaftar. Hubungi admin.';
                    errEl.classList.remove('hidden');
                    return;
                }
                listEl.innerHTML = '';
                data.forEach(k => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'w-full text-left px-4 py-3 rounded-xl text-[14px] transition';
                    btn.style.background = 'rgba(118,118,128,0.12)';
                    btn.style.color = 'var(--label)';
                    btn.textContent = k.nama;
                    btn.addEventListener('click', () => {
                        kantorPilihModal.classList.replace('flex', 'hidden');
                        finishLogin(pendingProfil, k.id, !!forceAdmin);
                    });
                    listEl.appendChild(btn);
                });
            } catch (e) {
                listEl.innerHTML = '';
                errEl.textContent = 'Gagal memuat daftar kantor: ' + (e.message || e);
                errEl.classList.remove('hidden');
            }
        }

        // Toggle tampil/sembunyi password
        document.getElementById('togglePassword').addEventListener('click', function () {
            const pwInput = document.getElementById('password');
            const icon = this.querySelector('i');
            const isHidden = pwInput.type === 'password';
            pwInput.type = isHidden ? 'text' : 'password';
            icon.classList.toggle('fa-eye', !isHidden);
            icon.classList.toggle('fa-eye-slash', isHidden);
        });

        function showLoginError(message) {
            const errBox = document.getElementById('loginError');
            errBox.textContent = message;
            errBox.classList.remove('hidden');
        }

        function hideLoginError() {
            document.getElementById('loginError').classList.add('hidden');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideLoginError();

            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            btn.disabled = true;
            btnText.textContent = 'Memproses...';
            btn.querySelector('i').className = 'fa-solid fa-spinner fa-spin';

            try {
                const nipInput = document.getElementById('nip').value.trim();
                const passwordInput = document.getElementById('password').value;
                const emailLogin = nipToEmail(nipInput);

                // 1. Verifikasi NIP + Password lewat Supabase Auth.
                const { error: sbLoginError } = await sb.auth.signInWithPassword({ email: emailLogin, password: passwordInput });
                if (sbLoginError) throw sbLoginError;

                // 2. Ambil profil pegawai (nama, jabatan, admin, dst) dari Supabase.
                const { data: profil, error: profilError } = await sb
                    .from('pegawai')
                    .select('*')
                    .eq('id', nipInput)
                    .single();
                if (profilError || !profil) {
                    throw { code: 'profil-tidak-ditemukan' };
                }

                // 3. realUrl (backend GAS) tetap diambil spt biasa — masih dipakai
                //    hampir semua fitur lain di aplikasi selain login ini sendiri.
                const resUrl = await fetch(redirectorUrl);
                const realUrl = await resUrl.text();
                localStorage.setItem('realUrl', realUrl);

                // 4. Tentukan alur kantor/mode sebelum redirect:
                //    - superadmin -> tanya mode (User Biasa / SuperAdmin)
                //    - kantor_id terisi DAN kantor itu berstatus 'aktif' -> langsung
                //      lanjut sesuai role tersimpan (admin/aksesMenu/biasa), otomatis
                //      pakai database kantor itu (walau POK/Kegiatan-nya masih kosong,
                //      itu cuma soal data belum diisi, bukan soal akses).
                //    - kantor_id NULL, ATAU kantor-nya ada tapi statusnya 'nonaktif'
                //      -> paksa role biasa (Perjadinku/Perbantuan/Referensi saja),
                //      terlepas dari flag admin/aksesMenu yg tersimpan, lalu tanya
                //      kantor tujuan (dari kantor2 yg AKTIF saja).
                profil.id = nipInput;

                let kantorAsalAktif = false;
                if (profil.kantor_id) {
                    const { data: kantorAsal } = await sb.from('kantor').select('status').eq('id', profil.kantor_id).maybeSingle();
                    kantorAsalAktif = !!(kantorAsal && kantorAsal.status === 'aktif');
                }

                if (profil.superadmin === '1') {
                    pendingProfil = profil;
                    showModePilihModal();
                } else if (profil.kantor_id && kantorAsalAktif) {
                    pendingProfil = profilDenganAksesOtomatis(profil, kantorAsalAktif);
                    finishLogin(pendingProfil, profil.kantor_id, false);
                } else {
                    // Kantor asal tidak terdaftar / nonaktif -> paksa biasa, apapun
                    // flag admin/aksesMenu yg mungkin masih tersimpan dari saat
                    // kantornya dulu masih aktif.
                    pendingProfil = { ...profil, admin: '', akses_menu: '' };
                    await showKantorPilihModal({ semuaKantor: false, forceAdmin: false });
                }
            } catch (err) {
                const msg = (err && err.message || '').toLowerCase();
                if (err && err.code === 'profil-tidak-ditemukan') {
                    showLoginError('Profil pegawai tidak ditemukan di database. Hubungi admin.');
                } else if (msg.includes('invalid login credentials') || msg.includes('invalid_credentials')) {
                    showLoginError('NIP atau password salah. Password default adalah NIP.');
                } else if (msg.includes('rate limit') || msg.includes('too many requests')) {
                    showLoginError('Terlalu banyak percobaan gagal. Coba lagi sebentar lagi.');
                } else {
                    showLoginError('Koneksi ke server gagal, pastikan redirector aktif.');
                }
            } finally {
                btn.disabled = false;
                btnText.textContent = 'Masuk';
                btn.querySelector('i').className = 'fa-solid fa-arrow-right-to-bracket';
            }
        });

        // =====================================================================
        // Modal Daftar Akun
        // =====================================================================
        const daftarModal = document.getElementById('daftarModal');
        const daftarStep1 = document.getElementById('daftarStep1');
        const daftarStep2 = document.getElementById('daftarStep2');
        const daftarCekMsg = document.getElementById('daftarCekMsg');
        const daftarError = document.getElementById('daftarError');
        const daftarSuccess = document.getElementById('daftarSuccess');
        let daftarNipFound = false; // true kalau NIP sudah ada saat cek (dipakai untuk perilaku tombol setelah Daftar sukses)

        // Daftar Pangkat/Golongan — sama persis dengan CS_DAFTAR_PANGKAT di common.js
        // (dashboard), supaya pilihannya konsisten di seluruh aplikasi.
        const DAFTAR_PANGKAT = [
            'Juru Muda / I.a',
            'Juru Muda Tk. I / I.b',
            'Juru / I.c',
            'Juru Tk. I / I.d',
            'Pengatur Muda / II.a',
            'Pengatur Muda Tk. I / II.b',
            'Pengatur / II.c',
            'Pengatur Tk. I / II.d',
            'Penata Muda / III.a',
            'Penata Muda Tk. I / III.b',
            'Penata / III.c',
            'Penata Tk. I / III.d',
            'Pembina / IV.a',
            'Pembina Tk. I / IV.b',
            'Pembina Muda / IV.c',
            'Pembina Madya / IV.d',
            'Pembina Utama / IV.e'
        ];

        // Isi ulang dropdown Pangkat. Kalau `selected` bukan bagian dari daftar baku
        // (mis. pegawai PPNPN yang kolom Pangkat-nya diisi teks lain), tetap
        // ditampilkan sebagai opsi tersendiri supaya tidak hilang datanya.
        function daftarSetPangkatOptions(selected) {
            const el = document.getElementById('daftarPangkat');
            const extra = (selected && !DAFTAR_PANGKAT.includes(selected))
                ? `<option value="${selected}" selected>${selected}</option>` : '';
            el.innerHTML = `<option value="">-- Pilih Pangkat --</option>${extra}${DAFTAR_PANGKAT.map(p =>
                `<option value="${p}" ${p === selected ? 'selected' : ''}>${p}</option>`).join('')}`;
        }

        // Dapatkan realUrl (URL GAS utama) lewat redirector, sama seperti proses login.
        async function getRealUrlForDaftar() {
            const resUrl = await fetch(redirectorUrl);
            return await resUrl.text();
        }

        function resetDaftarModal() {
            daftarSelectedKantor = '';
            daftarStep1.classList.remove('hidden');
            daftarStep2.classList.add('hidden');
            document.getElementById('daftarCekNip').value = '';
            daftarCekMsg.classList.add('hidden');
            daftarError.classList.add('hidden');
            daftarSuccess.classList.add('hidden');
            document.getElementById('daftarNama').value = '';
            document.getElementById('daftarNip').value = '';
            document.getElementById('daftarJabatan').value = '';
            daftarSetPangkatOptions('');
            document.getElementById('daftarPangkat').disabled = false;
            document.getElementById('daftarStatusText').value = '';
            document.getElementById('daftarKeteranganDitemukan').classList.add('hidden');
            daftarNipFound = false;

            // Kembalikan tombol Daftar ke kondisi semula (kalau sebelumnya sempat
            // berubah jadi "Tutup" warna merah karena NIP ditemukan)
            setDaftarButtonAsDaftar();
        }

        // Diisi saat Cek NIP diklik, dipakai lagi saat Simpan (supaya konsisten
        // walau user sempat ganti-ganti pilihan dropdown sebelum submit).
        let daftarSelectedKantor = '';

        async function populateDaftarKantorDropdown() {
            const sel = document.getElementById('daftarKantor');
            sel.innerHTML = '<option value="">-- Memuat daftar kantor... --</option>';
            try {
                const { data, error } = await sb.from('kantor').select('id,nama').eq('status', 'aktif').order('nama');
                if (error) throw error;
                const opts = (data || []).map(k => `<option value="${k.id}">${k.nama}</option>`).join('');
                sel.innerHTML = opts + `<option value="__LAIN__">-- Kantor Lain / Belum Terdaftar --</option>`;
            } catch (e) {
                sel.innerHTML = `<option value="__LAIN__">-- Kantor Lain / Belum Terdaftar --</option>`;
            }
        }

        document.getElementById('daftarLink').addEventListener('click', (e) => {
            e.preventDefault();
            resetDaftarModal();
            populateDaftarKantorDropdown();
            daftarModal.classList.remove('hidden');
            daftarModal.classList.add('flex');
        });

        document.getElementById('daftarCloseBtn').addEventListener('click', () => {
            daftarModal.classList.replace('flex', 'hidden');
        });

        const DAFTAR_BTN_CLASS_NORMAL = 'btn-ios w-full py-3 text-[15px] flex items-center justify-center gap-2 disabled:cursor-not-allowed';
        const DAFTAR_BTN_CLASS_TUTUP = 'w-full py-3 text-[15px] font-medium rounded-xl flex items-center justify-center gap-2 transition';
        // Warna Tutup beda dari Simpan (abu-abu, bukan biru) -- diset lewat style inline saat dipakai, lihat pemakaiannya di bawah.

        // NIP ditemukan -> akun sudah terdaftar, tidak bisa daftar lagi.
        // Tombol "Daftar" langsung berubah jadi "Tutup" warna merah.
        function setDaftarButtonAsTutup() {
            const btn = document.getElementById('daftarBtnSimpan');
            const btnText = document.getElementById('daftarBtnSimpanText');
            btn.className = DAFTAR_BTN_CLASS_TUTUP;
            btn.style.background = 'rgba(118,118,128,0.16)';
            btn.style.color = 'var(--label)';
            btnText.textContent = 'Tutup';
            btn.disabled = false;
        }

        // NIP tidak ditemukan -> tombol kembali normal sebagai "Daftar".
        function setDaftarButtonAsDaftar() {
            const btn = document.getElementById('daftarBtnSimpan');
            const btnText = document.getElementById('daftarBtnSimpanText');
            btn.className = DAFTAR_BTN_CLASS_NORMAL;
            btn.style.background = '';
            btn.style.color = '';
            btnText.textContent = 'Daftar';
            btn.disabled = false;
        }

        document.getElementById('daftarBtnCek').addEventListener('click', async function () {
            const btn = this;
            const nip = document.getElementById('daftarCekNip').value.trim();
            daftarCekMsg.classList.add('hidden');

            const kantorPilihan = document.getElementById('daftarKantor').value;
            if (!kantorPilihan) {
                daftarCekMsg.textContent = 'Pilih kantor terlebih dahulu.';
                daftarCekMsg.className = 'text-[13px] px-3.5 py-2.5 rounded-xl mt-3 text-center'; daftarCekMsg.style.background = 'rgba(255,59,48,0.1)'; daftarCekMsg.style.color = '#FF3B30';
                daftarCekMsg.classList.remove('hidden');
                return;
            }
            if (!nip) {
                daftarCekMsg.textContent = 'NIP harus diisi.';
                daftarCekMsg.className = 'text-[13px] px-3.5 py-2.5 rounded-xl mt-3 text-center'; daftarCekMsg.style.background = 'rgba(255,59,48,0.1)'; daftarCekMsg.style.color = '#FF3B30';
                daftarCekMsg.classList.remove('hidden');
                return;
            }
            daftarSelectedKantor = kantorPilihan;

            // Cek-ke-GAS (ref_pegawai) HANYA berlaku untuk kantor utama (Denpasar),
            // karena itu satu-satunya sumber data ref_pegawai yang ada. Kantor lain
            // (atau "Kantor Lain/Belum Terdaftar") langsung ke form manual kosong.
            if (kantorPilihan !== KANTOR_UTAMA_ID) {
                const namaEl = document.getElementById('daftarNama');
                const nipEl = document.getElementById('daftarNip');
                const jabatanEl = document.getElementById('daftarJabatan');
                const pangkatEl = document.getElementById('daftarPangkat');
                const statusTextEl = document.getElementById('daftarStatusText');
                const statusSelectEl = document.getElementById('daftarStatusSelect');
                const keteranganEl = document.getElementById('daftarKeteranganDitemukan');

                daftarNipFound = false;
                namaEl.value = '';
                nipEl.value = nip;
                jabatanEl.value = '';
                daftarSetPangkatOptions('');
                pangkatEl.disabled = false;
                statusSelectEl.value = '1';

                [namaEl, nipEl, jabatanEl].forEach(el => {
                    el.readOnly = false;
                    el.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                });
                pangkatEl.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                statusTextEl.classList.add('hidden');
                statusSelectEl.classList.remove('hidden');
                keteranganEl.classList.add('hidden');

                setDaftarButtonAsDaftar();
                daftarStep2.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            const originalHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';

            try {
                const realUrl = await getRealUrlForDaftar();
                const res = await fetch(realUrl, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'cekNip', nip })
                });
                const data = await res.json();

                if (data.status !== 'success') {
                    daftarCekMsg.textContent = data.message || 'Terjadi kesalahan saat memeriksa NIP.';
                    daftarCekMsg.className = 'text-[13px] px-3.5 py-2.5 rounded-xl mt-3 text-center'; daftarCekMsg.style.background = 'rgba(255,59,48,0.1)'; daftarCekMsg.style.color = '#FF3B30';
                    daftarCekMsg.classList.remove('hidden');
                    return;
                }

                const namaEl = document.getElementById('daftarNama');
                const nipEl = document.getElementById('daftarNip');
                const jabatanEl = document.getElementById('daftarJabatan');
                const pangkatEl = document.getElementById('daftarPangkat');
                const statusTextEl = document.getElementById('daftarStatusText');
                const statusSelectEl = document.getElementById('daftarStatusSelect');
                const keteranganEl = document.getElementById('daftarKeteranganDitemukan');

                if (data.found) {
                    daftarNipFound = true;
                    // NIP ditemukan -> semua field read-only, tampilkan data dari ref_pegawai,
                    // dan tombol Daftar langsung berubah jadi Tutup (tidak bisa daftar lagi).
                    namaEl.value = data.nama || '';
                    nipEl.value = data.nip || '';
                    jabatanEl.value = data.jabatan || '';
                    daftarSetPangkatOptions(data.pangkat || '');
                    pangkatEl.disabled = true;
                    statusTextEl.value = (String(data.statusPegawai) === '1') ? 'PNS' : 'PPNPN';

                    [namaEl, nipEl, jabatanEl].forEach(el => {
                        el.readOnly = true;
                        el.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                    });
                    pangkatEl.classList.add('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                    statusTextEl.classList.remove('hidden');
                    statusSelectEl.classList.add('hidden');
                    keteranganEl.classList.remove('hidden');

                    setDaftarButtonAsTutup();
                } else {
                    daftarNipFound = false;
                    // NIP tidak ditemukan -> semua field aktif/bisa diisi, NIP terisi dari pencarian,
                    // tombol tetap/kembali "Daftar" supaya bisa submit.
                    namaEl.value = '';
                    nipEl.value = nip;
                    jabatanEl.value = '';
                    daftarSetPangkatOptions('');
                    pangkatEl.disabled = false;
                    statusSelectEl.value = '1';

                    [namaEl, nipEl, jabatanEl].forEach(el => {
                        el.readOnly = false;
                        el.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                    });
                    pangkatEl.classList.remove('bg-slate-100', 'text-slate-500', 'cursor-not-allowed');
                    statusTextEl.classList.add('hidden');
                    statusSelectEl.classList.remove('hidden');
                    keteranganEl.classList.add('hidden');

                    setDaftarButtonAsDaftar();
                }

                daftarStep2.classList.remove('hidden');
            } catch (err) {
                daftarCekMsg.textContent = 'Koneksi ke server gagal, pastikan redirector aktif.';
                daftarCekMsg.className = 'text-[13px] px-3.5 py-2.5 rounded-xl mt-3 text-center'; daftarCekMsg.style.background = 'rgba(255,59,48,0.1)'; daftarCekMsg.style.color = '#FF3B30';
                daftarCekMsg.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHtml;
            }
        });

        document.getElementById('daftarBtnSimpan').addEventListener('click', async function () {
            const btn = this;
            const btnText = document.getElementById('daftarBtnSimpanText');

            // Kalau tombol sedang dalam kondisi "Tutup" (setelah sukses daftar
            // dengan NIP ditemukan), klik ini cukup menutup popup saja.
            if (btnText.textContent === 'Tutup') {
                daftarModal.classList.replace('flex', 'hidden');
                return;
            }

            daftarError.classList.add('hidden');
            daftarSuccess.classList.add('hidden');

            const nama = document.getElementById('daftarNama').value.trim();
            const nip = document.getElementById('daftarNip').value.trim();
            const jabatan = document.getElementById('daftarJabatan').value.trim();
            const pangkat = document.getElementById('daftarPangkat').value.trim();
            const statusSelectEl = document.getElementById('daftarStatusSelect');
            const statusTextEl = document.getElementById('daftarStatusText');
            const status = statusSelectEl.classList.contains('hidden')
                ? (statusTextEl.value === 'PNS' ? '1' : '0')
                : statusSelectEl.value;

            if (!nama || !nip) {
                daftarError.textContent = 'Nama dan NIP harus diisi.';
                daftarError.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            const originalText = btnText.textContent;
            btnText.textContent = 'Memproses...';

            // kantor_id yg disimpan ke tabel pegawai: NULL kalau "Kantor Lain",
            // selain itu id kantor terdaftar yang dipilih.
            const kantorIdUntukInsert = (daftarSelectedKantor === '__LAIN__') ? null : daftarSelectedKantor;

            // Bikin akun Supabase Auth + baris pegawai (dipakai baik lewat jalur
            // GAS Denpasar maupun jalur manual kantor lain). Instance KEDUA (client
            // terpisah dgn storageKey unik) supaya tidak mengganggu sesi aktif.
            async function buatAkunSupabase() {
                const secondaryDbDaftar = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
                    auth: { storageKey: 'sb-secondary-daftar-' + Date.now() }
                });
                const { error: signUpError } = await secondaryDbDaftar.auth.signUp({ email: nipToEmail(nip), password: nip });
                if (signUpError && !(signUpError.message || '').toLowerCase().includes('already registered')) {
                    throw signUpError;
                }
                // Default akun BARU dari pendaftaran mandiri: status='0' (nonaktif,
                // nunggu admin aktifkan manual lewat Referensi > Pegawai), admin &
                // akses_menu KOSONG sampai admin memutuskan lain.
                await secondaryDbDaftar.from('pegawai').upsert({
                    id: nip, nama, jabatan, pangkat, kepeg: status,
                    admin: '', akses_menu: '', status: '0', nama_bank: '', no_rekening: '',
                    kantor_id: kantorIdUntukInsert
                });
                try { await secondaryDbDaftar.auth.signOut(); } catch (e2) { /* abaikan */ }
            }

            try {
                if (daftarSelectedKantor === KANTOR_UTAMA_ID) {
                    // Jalur Denpasar: tetap catat ke GAS ref_pegawai dulu (dipertahankan
                    // supaya fitur lain yg masih baca dari situ tidak rusak), baru bikin
                    // akun Supabase.
                    const realUrl = await getRealUrlForDaftar();
                    const res = await fetch(realUrl, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'daftarPegawai', nama, nip, jabatan, pangkat, status })
                    });
                    const data = await res.json();

                    if (data.status === 'success') {
                        try {
                            await buatAkunSupabase();
                        } catch (sbErr) {
                            console.error('Gagal bikin akun Supabase utk pegawai ini:', sbErr);
                            // Kalau NIP sudah pernah terdaftar, password Supabase-nya TIDAK ikut
                            // ter-reset (keterbatasan client SDK) -- perlu reset manual lewat
                            // Supabase Dashboard kalau memang dibutuhkan.
                        }
                        daftarSuccess.textContent = data.message || 'Pendaftaran berhasil.';
                        daftarSuccess.classList.remove('hidden');
                        setTimeout(() => { daftarModal.classList.replace('flex', 'hidden'); }, 2000);
                    } else {
                        daftarError.textContent = data.message || 'Gagal mendaftar.';
                        daftarError.classList.remove('hidden');
                    }
                } else {
                    // Jalur kantor lain/belum terdaftar: TIDAK menyentuh GAS Denpasar
                    // sama sekali, langsung bikin akun Supabase saja.
                    await buatAkunSupabase();
                    daftarSuccess.textContent = 'Pendaftaran berhasil. Akun akan aktif setelah disetujui admin.';
                    daftarSuccess.classList.remove('hidden');
                    setTimeout(() => { daftarModal.classList.replace('flex', 'hidden'); }, 2000);
                }
            } catch (err) {
                console.error(err);
                daftarError.textContent = 'Gagal mendaftar: ' + (err.message || err);
                daftarError.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btnText.textContent = originalText;
            }
        });
    </script>

    <!-- PWA: daftarkan service worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => {
                    console.error('SW registration gagal:', err);
                });
            });
        }
    </script>
</body>
</html>

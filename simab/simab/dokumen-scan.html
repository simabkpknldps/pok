<!-- ===================== Scripts ===================== -->
<script src="js/api.js"></script>
<script>
let currentRow = null;
let photoQueue = []; // { dataUrl } — antrian foto sebelum digabung jadi 1 PDF

const $ = (id) => document.getElementById(id);

// Format angka ribuan saat mengetik di input (mis. "1500000" -> "1.500.000").
function formatRibuan(v) {
    const angka = String(v || '').replace(/\D/g, '');
    return angka ? Number(angka).toLocaleString('id-ID') : '';
}

// Toast kecil di bawah layar (dipakai tombol Refresh Data) — tanpa dependensi
// apapun (dokumen-scan.html tidak memuat common.js versi web).
function showToastSOH(msg, isError) {
    const el = document.createElement('div');
    el.textContent = msg;
    el.style.cssText = `
        position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%);
        background: ${isError ? '#dc2626' : '#0f172a'}; color: white;
        padding: 9px 16px; border-radius: 9999px; font-size: 12.5px;
        box-shadow: 0 4px 14px rgba(0,0,0,0.25); z-index: 999999;
        max-width: 85vw; text-align: center; opacity: 0; transition: opacity .2s;
    `;
    document.body.appendChild(el);
    requestAnimationFrame(() => { el.style.opacity = '1'; });
    setTimeout(() => {
        el.style.opacity = '0';
        setTimeout(() => el.remove(), 250);
    }, 2200);
}

function escHtml(str) {
    return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function statusBadgeClass(status) {
    const map = {
        'Rekam Data': 'bg-pink-100 text-pink-700',
        'Terlaksana': 'bg-slate-200 text-slate-700',
        'LPT': 'bg-yellow-100 text-yellow-700',
        'Terbayar': 'bg-green-100 text-green-700',
        'Selesai': 'bg-blue-100 text-blue-700'
    };
    return map[status] || 'bg-slate-100 text-slate-500';
}

// ============================================================
// Pencarian — baca dari Supabase (tabel 'kegiatan'), difilter di HP
// (client-side), sama pola dgn halaman Kegiatan versi web.
// ============================================================
let dsAllRowsCache = null; // cache di memori halaman ini saja, sekali per kunjungan

async function dsGetAllRows() {
    if (dsAllRowsCache) return dsAllRowsCache;
    await waitSupabaseAuthReady();
    const rows = await sbFetchAll('kegiatan');
    dsAllRowsCache = rows.map(d => ({
        A: d.id, B: d.mak || '', C: d.uraian || '', D: d.pelaksana || '', E: d.tujuan || '',
        F: d.tgl_st || '', G: d.tgl_mulai || '', H: d.tgl_selesai || '',
        I: d.tgl_lpt || '', J: d.tgl_bayar || '', M: Number(d.jumlah) || 0, N: d.user || '',
        P: d.status || '', Q: d.tgl_sp2d || '', R: d.nomor_spm || '', T: d.dokumen_link || ''
    }));
    return dsAllRowsCache;
}

async function runSearch() {
    const q = $('ds-searchInput').value.trim().toLowerCase();
    const resultsEl = $('ds-results');
    const hintEl = $('ds-hint');

    if (!q) {
        resultsEl.innerHTML = '';
        hintEl.textContent = 'Masukkan kata kunci lalu tekan tombol cari (mis. nama pegawai, uraian kegiatan, No ST, atau No SPM).';
        return;
    }

    resultsEl.innerHTML = `<div class="text-center text-sky-600 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;
    hintEl.textContent = '';

    try {
        const allRows = await dsGetAllRows();

        const matched = allRows.filter(r =>
            String(r.C).toLowerCase().includes(q) ||
            String(r.D).toLowerCase().includes(q) ||
            String(r.E).toLowerCase().includes(q) ||
            String(r.F).toLowerCase().includes(q) ||
            String(r.P).toLowerCase().includes(q) ||
            String(r.R).toLowerCase().includes(q)
        );

        const MAX_SHOW = 15;
        const rows = matched.slice(0, MAX_SHOW);

        if (rows.length === 0) {
            resultsEl.innerHTML = `<div class="text-center text-slate-400 py-12"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><p class="text-sm">Data tidak ditemukan.</p></div>`;
            return;
        }

        hintEl.textContent = (matched.length > rows.length)
            ? `Menampilkan ${rows.length} dari ${matched.length} hasil. Persempit pencarian kalau belum ketemu.`
            : `${rows.length} hasil ditemukan.`;

        resultsEl.innerHTML = rows.map(dsRenderCard).join('');
        resultsEl.querySelectorAll('.ds-card').forEach(card => {
            const id = card.dataset.id;
            const row = rows.find(r => String(r.A) === id);
            card.onclick = () => dsOpenDetail(row);
        });

    } catch (e) {
        resultsEl.innerHTML = `<div class="text-center text-red-500 py-10">❌ ${escHtml(e.message || 'Terjadi kesalahan.')}</div>`;
    }
}

function dsRenderCard(r) {
    const dokIcon = r.T
        ? `<i class="fa-solid fa-file-circle-check text-emerald-600"></i>`
        : `<i class="fa-solid fa-file-circle-xmark text-slate-300"></i>`;
    return `
    <div class="ds-card bg-white rounded-xl border border-slate-200 p-3.5 mb-2.5 active:bg-slate-50" data-id="${escHtml(r.A)}">
        <div class="flex items-start justify-between gap-2">
            <p class="text-sm font-medium text-slate-800 leading-snug flex-1">${escHtml(r.C)}</p>
            <span class="ds-dok-icon text-lg shrink-0">${dokIcon}</span>
        </div>
        <p class="text-xs text-slate-500 mt-1">${escHtml(r.D)} &middot; ${escHtml(r.E)}</p>
        <div class="flex items-center justify-between mt-2">
            <span class="text-xs text-slate-400">${escHtml(r.F || '-')}</span>
            <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${statusBadgeClass(r.P)}">${escHtml(r.P)}</span>
        </div>
    </div>`;
}

function dsUpdateCardIcon(id, link) {
    const card = document.querySelector(`.ds-card[data-id="${CSS.escape(String(id))}"]`);
    if (!card) return;
    const iconEl = card.querySelector('.ds-dok-icon');
    if (iconEl) {
        iconEl.innerHTML = link
            ? `<i class="fa-solid fa-file-circle-check text-emerald-600"></i>`
            : `<i class="fa-solid fa-file-circle-xmark text-slate-300"></i>`;
    }
}

// ============================================================
// Bottom sheet detail + aksi dokumen
// ============================================================
function dsOpenDetail(row) {
    currentRow = row;
    photoQueue = [];
    $('ds-sheetOverlay').classList.remove('hidden');
    dsRenderSheet();
}

function dsCloseDetail() {
    $('ds-sheetOverlay').classList.add('hidden');
    photoQueue = [];
    currentRow = null;
}

function dsRenderSheet() {
    const r = currentRow;
    const hasDoc = !!r.T;

    let photoPreviewHtml = '';
    if (photoQueue.length > 0) {
        photoPreviewHtml = `
        <div class="mt-3 border-t border-slate-100 pt-3">
            <p class="text-xs font-medium text-slate-500 mb-1.5">${photoQueue.length} foto siap dijadikan PDF:</p>
            <div class="flex gap-2 overflow-x-auto pb-1">
                ${photoQueue.map((p, idx) => `
                    <div class="relative shrink-0">
                        <img src="${p.dataUrl}" class="w-16 h-20 object-cover rounded-lg border border-slate-200">
                        <button type="button" class="ds-removePhoto absolute -top-1.5 -right-1.5 w-5 h-5 bg-red-500 text-white rounded-full text-[10px] flex items-center justify-center" data-idx="${idx}"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                `).join('')}
            </div>
            <div class="flex gap-2 mt-2.5">
                <button id="ds-btnAddMorePhoto" class="flex-1 px-3 py-2.5 border border-sky-300 text-sky-700 rounded-xl text-xs font-medium"><i class="fa-solid fa-camera mr-1"></i> Tambah Foto</button>
                <button id="ds-btnConfirmPhotos" class="flex-1 px-3 py-2.5 bg-emerald-600 text-white rounded-xl text-xs font-medium"><i class="fa-solid fa-check mr-1"></i> Jadikan PDF & Upload</button>
            </div>
        </div>`;
    }

    $('ds-sheet').innerHTML = `
        <div class="w-10 h-1.5 bg-slate-300 rounded-full mx-auto mb-4"></div>
        <div class="flex items-start justify-between gap-2 mb-1">
            <h3 class="text-base font-semibold text-slate-800 leading-snug pr-2">${escHtml(r.C)}</h3>
            <button id="ds-btnCloseSheet" class="text-slate-400 shrink-0 text-lg"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <p class="text-sm text-slate-500 mb-3">${escHtml(r.D)} &middot; ${escHtml(r.E)}</p>

        <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 rounded-xl p-3 mb-3">
            <div><span class="text-slate-400">Tgl ST/ND</span><br><span class="text-slate-700 font-medium">${escHtml(r.F || '-')}</span></div>
            <div><span class="text-slate-400">Tgl Mulai</span><br><span class="text-slate-700 font-medium">${escHtml(r.G || '-')}</span></div>
            <div><span class="text-slate-400">Status</span><br><span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${statusBadgeClass(r.P)}">${escHtml(r.P)}</span></div>
            <div><span class="text-slate-400">ID Kegiatan</span><br><span class="text-slate-700 font-medium">${escHtml(r.A)}</span></div>
        </div>

        <button id="ds-btnDetil" class="w-full text-center text-xs text-sky-600 font-medium mb-4"><i class="fa-solid fa-circle-info mr-1"></i>Lihat Detil Kegiatan Lengkap</button>

        <p class="text-xs text-slate-400 mb-2 text-center">${hasDoc ? '✅ Dokumen sudah tersedia' : 'Dokumen belum diupload'}</p>

        <div class="grid grid-cols-3 gap-2">
            <button id="ds-btnLihat" ${hasDoc ? '' : 'disabled'} class="flex flex-col items-center gap-1 py-3 rounded-xl border ${hasDoc ? 'border-sky-300 text-sky-700' : 'border-slate-200 text-slate-300'}">
                <i class="fa-solid fa-eye text-lg"></i><span class="text-[11px] font-medium">Lihat</span>
            </button>
            <button id="ds-btnFoto" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-emerald-300 text-emerald-700">
                <i class="fa-solid fa-camera text-lg"></i><span class="text-[11px] font-medium">Ambil Foto</span>
            </button>
            <button id="ds-btnUploadPdf" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-sky-300 text-sky-700">
                <i class="fa-solid fa-file-arrow-up text-lg"></i><span class="text-[11px] font-medium">Upload PDF</span>
            </button>
        </div>

        ${hasDoc ? `
        <button id="ds-btnHapus" class="w-full mt-2.5 py-2.5 rounded-xl border border-red-300 text-red-600 text-xs font-medium">
            <i class="fa-solid fa-trash mr-1"></i> Hapus Dokumen
        </button>` : ''}

        <p class="text-xs text-slate-400 mt-4 mb-2 text-center">Transaksi</p>
        <div class="grid grid-cols-3 gap-2">
            <button id="ds-btnLpt" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-amber-300 text-amber-700">
                <i class="fa-solid fa-stamp text-lg"></i><span class="text-[11px] font-medium">LPT</span>
            </button>
            <button id="ds-btnBayar" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-green-300 text-green-700">
                <i class="fa-solid fa-money-check-dollar text-lg"></i><span class="text-[11px] font-medium">Bayar</span>
            </button>
            <button id="ds-btnSp2d" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-blue-300 text-blue-700">
                <i class="fa-solid fa-file-invoice-dollar text-lg"></i><span class="text-[11px] font-medium">SP2D</span>
            </button>
        </div>

        <p class="text-xs text-slate-400 mt-4 mb-2 text-center">Kelola Kegiatan</p>
        <div class="grid grid-cols-3 gap-2">
            <button id="ds-btnUbah" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-indigo-300 text-indigo-700">
                <i class="fa-solid fa-pen text-lg"></i><span class="text-[11px] font-medium">Ubah</span>
            </button>
            <button id="ds-btnPelaksana" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-purple-300 text-purple-700">
                <i class="fa-solid fa-users text-lg"></i><span class="text-[11px] font-medium">Pelaksana</span>
            </button>
            <button id="ds-btnHapusKegiatan" class="flex flex-col items-center gap-1 py-3 rounded-xl border border-red-300 text-red-600">
                <i class="fa-solid fa-trash-can text-lg"></i><span class="text-[11px] font-medium">Hapus</span>
            </button>
        </div>

        <input id="ds-fileInputPdf" type="file" accept="application/pdf,.pdf" class="hidden">
        <input id="ds-fileInputCamera" type="file" accept="image/*" capture="environment" class="hidden">

        ${photoPreviewHtml}

        <div id="ds-status" class="text-center text-xs text-slate-400 min-h-[18px] mt-3"></div>
    `;

    dsWireSheetEvents();
}

function dsWireSheetEvents() {
    const r = currentRow;

    $('ds-btnCloseSheet').onclick = dsCloseDetail;

    const btnLihat = $('ds-btnLihat');
    if (r.T && btnLihat) btnLihat.onclick = () => window.open(r.T, '_blank');

    $('ds-btnUploadPdf').onclick = () => $('ds-fileInputPdf').click();
    $('ds-btnFoto').onclick = () => $('ds-fileInputCamera').click();

    $('ds-fileInputPdf').onchange = async function () {
        const file = this.files[0];
        this.value = '';
        if (!file) return;
        if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
            alert('File harus berformat PDF.');
            return;
        }
        if (file.size > 10 * 1024 * 1024) {
            alert('Ukuran file maksimal 10MB.');
            return;
        }
        try {
            const base64 = await dsFileToBase64(file);
            await dsUploadBase64Pdf(base64);
        } catch (e) {
            dsSetStatus('❌ ' + (e.message || 'Gagal membaca file.'), 'red');
        }
    };

    $('ds-fileInputCamera').onchange = async function () {
        const file = this.files[0];
        this.value = '';
        if (!file) return;
        dsSetStatus('Memproses foto...', 'sky');
        try {
            const dataUrl = await dsResizeImage(file, 1600, 0.72);
            photoQueue.push({ dataUrl });
            dsRenderSheet();
        } catch (e) {
            dsSetStatus('❌ Gagal memproses foto.', 'red');
        }
    };

    const btnHapus = $('ds-btnHapus');
    if (btnHapus) btnHapus.onclick = dsHapusDokumen;

    const btnAddMore = $('ds-btnAddMorePhoto');
    if (btnAddMore) btnAddMore.onclick = () => $('ds-fileInputCamera').click();

    const btnConfirm = $('ds-btnConfirmPhotos');
    if (btnConfirm) btnConfirm.onclick = dsConvertAndUploadPhotos;

    document.querySelectorAll('.ds-removePhoto').forEach(btn => {
        btn.onclick = () => {
            photoQueue.splice(Number(btn.dataset.idx), 1);
            dsRenderSheet();
        };
    });

    $('ds-btnDetil').onclick = dsRenderDetilView;
    $('ds-btnLpt').onclick = dsRenderLptForm;
    $('ds-btnBayar').onclick = dsRenderBayarForm;
    $('ds-btnSp2d').onclick = dsRenderSp2dForm;
    $('ds-btnUbah').onclick = dsRenderUbahForm;
    $('ds-btnPelaksana').onclick = dsRenderPelaksanaForm;

// ============================================================
// POPUP PILIH MAK — overlay terpisah (bukan bagian sheet), hierarki
// bertingkat per Seksi sama persis kayak Chrome Extension & web SiMAB.
// Tombol "Pilih" CUMA di baris paling detail (leaf, kode terpanjang).
// ============================================================
let dsMakExpandedSeksi = new Set();
let dsMakExpandedCodes = new Set();

function dsOpenPilihMakPopup(onPick) {
    const overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 bg-black/50 z-[999998] flex flex-col';
    overlay.innerHTML = `
        <div class="bg-white flex flex-col h-full max-w-lg mx-auto w-full">
            <div class="flex items-center gap-2 p-4 border-b border-slate-100">
                <button id="ds-makClose" class="text-slate-400 text-lg"><i class="fa-solid fa-arrow-left"></i></button>
                <h3 class="text-base font-semibold text-slate-800 flex-1">Pilih Kode MAK</h3>
            </div>
            <div class="p-4 pb-2">
                <input id="ds-makSearch" type="text" placeholder="Cari kode / uraian... (kosongkan utk lihat per Seksi)"
                    class="w-full px-3.5 py-3 border border-slate-300 rounded-xl text-sm">
            </div>
            <div id="ds-makList" class="flex-1 overflow-y-auto px-4 pb-4"></div>
        </div>
    `;
    document.body.appendChild(overlay);
    overlay.querySelector('#ds-makClose').onclick = () => overlay.remove();

    let allPok = [];

    function leafRow(p) {
        return `
        <div class="flex items-center justify-between gap-2 bg-blue-50 border border-blue-100 rounded-lg p-2.5 mb-1.5">
            <div class="min-w-0 flex-1">
                <p class="text-[10px] font-mono text-slate-400">${escHtml(p.kode)}</p>
                <p class="text-xs text-slate-700">${escHtml(p.uraian)}</p>
            </div>
            <button class="ds-makPilihBtn shrink-0 px-3 py-2 bg-sky-600 text-white rounded-lg text-xs font-semibold" data-kode="${escHtml(p.kode)}">Pilih ✓</button>
        </div>`;
    }
    function parentRow(p, seksi, depth, isOpen, hasChildren) {
        const indent = Math.min(depth - 1, 5) * 12;
        return `
        <div class="ds-makParent p-2.5 mb-1 rounded-lg cursor-pointer ${depth <= 2 ? 'bg-slate-100 font-bold' : 'bg-sky-50 font-semibold'} text-xs text-slate-700"
            style="padding-left:${10 + indent}px" data-seksi="${escHtml(seksi)}" data-kode="${escHtml(p.kode)}">
            ${hasChildren ? (isOpen ? '▾' : '▸') : '·'} ${escHtml(p.uraian)}
        </div>`;
    }
    function wirePilih(container) {
        container.querySelectorAll('.ds-makPilihBtn').forEach(btn => {
            btn.onclick = () => {
                const item = allPok.find(p => p.kode === btn.dataset.kode);
                if (item) { onPick(item); overlay.remove(); }
            };
        });
    }

    function renderTree(seksi, items) {
        let html = '';
        items.forEach(item => {
            const c = String(item.kode);
            const isKegiatanLevel = c.length === 12;
            const isLeaf = c.length > 27;
            const isChildVisible = Array.from(dsMakExpandedCodes).some(k => {
                if (!k.startsWith(seksi + '::')) return false;
                const p = k.slice((seksi + '::').length);
                return c.startsWith(p) && c !== p;
            });
            if (!isKegiatanLevel && !isChildVisible) return;

            const depth = c.split('.').length;
            if (isLeaf) {
                html += leafRow(item);
            } else {
                const hasChildren = items.some(ch => String(ch.kode).startsWith(c) && String(ch.kode) !== c);
                html += parentRow(item, seksi, depth, dsMakExpandedCodes.has(seksi + '::' + c), hasChildren);
            }
        });
        return html;
    }

    function render() {
        const q = overlay.querySelector('#ds-makSearch').value.trim().toLowerCase();
        const listEl = overlay.querySelector('#ds-makList');

        if (q) {
            const leafOnly = allPok.filter(p => String(p.kode).length > 27);
            const filtered = leafOnly.filter(p => String(p.kode).toLowerCase().includes(q) || String(p.uraian).toLowerCase().includes(q));
            listEl.innerHTML = filtered.length ? filtered.slice(0, 50).map(leafRow).join('') : `<p class="text-center text-slate-400 text-sm py-8">Tidak ada data.</p>`;
            wirePilih(listEl);
            return;
        }

        const groups = new Map();
        allPok.forEach(p => {
            const seksi = p.seksi || 'Lainnya';
            if (!groups.has(seksi)) groups.set(seksi, []);
            groups.get(seksi).push(p);
        });

        let html = '';
        groups.forEach((items, seksi) => {
            const isOpen = dsMakExpandedSeksi.has(seksi);
            html += `<div class="ds-makSeksi p-2.5 mb-1.5 rounded-lg cursor-pointer text-sm font-bold bg-indigo-50 text-indigo-700" data-seksi="${escHtml(seksi)}">
                ${isOpen ? '▾' : '▸'} ${escHtml(seksi)} <span class="font-normal text-[11px] opacity-70">(${items.length})</span>
            </div>`;
            if (isOpen) html += `<div class="mb-2">${renderTree(seksi, items)}</div>`;
        });
        listEl.innerHTML = html;

        listEl.querySelectorAll('.ds-makSeksi').forEach(el => {
            el.onclick = () => {
                const s = el.dataset.seksi;
                if (dsMakExpandedSeksi.has(s)) dsMakExpandedSeksi.delete(s); else dsMakExpandedSeksi.add(s);
                render();
            };
        });
        listEl.querySelectorAll('.ds-makParent').forEach(el => {
            el.onclick = () => {
                const key = el.dataset.seksi + '::' + el.dataset.kode;
                if (dsMakExpandedCodes.has(key)) dsMakExpandedCodes.delete(key); else dsMakExpandedCodes.add(key);
                render();
            };
        });
        wirePilih(listEl);
    }

    overlay.querySelector('#ds-makSearch').addEventListener('input', render);

    (async () => {
        overlay.querySelector('#ds-makList').innerHTML = `<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-sky-600 text-xl"></i></div>`;
        try {
            await waitSupabaseAuthReady();
            allPok = await sbFetchAll('pok', 'kode,uraian,sd,seksi');
            render();
        } catch (e) {
            overlay.querySelector('#ds-makList').innerHTML = `<p class="text-center text-red-500 text-sm py-8">❌ ${escHtml(e.message || 'Gagal memuat.')}</p>`;
        }
    })();
}

// Isi saran (datalist) Tujuan (dari histori dsAllRowsCache) & Pegawai (dari tabel pegawai).
async function dsFillSuggestions(tujuanDatalistId, pegawaiDatalistId) {
    try {
        const rows = await dsGetAllRows();
        const tujuanSet = new Set();
        rows.forEach(r => { const t = String(r.E || '').trim(); if (t) tujuanSet.add(t); });
        const dl = $(tujuanDatalistId);
        if (dl) dl.innerHTML = Array.from(tujuanSet).sort().map(v => `<option value="${escHtml(v)}"></option>`).join('');
    } catch (e) { /* saran gagal dimuat, tidak fatal */ }

    try {
        await waitSupabaseAuthReady();
        const pegawaiRows = await sbFetchAll('pegawai', 'nama');
        const dl2 = $(pegawaiDatalistId);
        if (dl2) dl2.innerHTML = pegawaiRows.map(p => `<option value="${escHtml(p.nama)}"></option>`).join('');
    } catch (e) { /* saran gagal dimuat, tidak fatal */ }
}

function dsFileToBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.onerror = () => reject(new Error('Gagal membaca file.'));
        reader.readAsDataURL(file);
    });
}

// Kompres & perkecil foto sebelum dimasukkan ke PDF, supaya ukuran file
// tetap wajar (foto kamera HP bisa 5-10MB+ kalau dipakai mentah).
function dsResizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxDim || height > maxDim) {
                    if (width > height) {
                        height = Math.round(height * (maxDim / width));
                        width = maxDim;
                    } else {
                        width = Math.round(width * (maxDim / height));
                        height = maxDim;
                    }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, width, height);
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', quality));
            };
            img.onerror = () => reject(new Error('Gagal memuat gambar.'));
            img.src = e.target.result;
        };
        reader.onerror = () => reject(new Error('Gagal membaca file.'));
        reader.readAsDataURL(file);
    });
}

function dsGetImageDims(dataUrl) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve({ width: img.naturalWidth, height: img.naturalHeight });
        img.onerror = () => reject(new Error('Gagal membaca ukuran gambar.'));
        img.src = dataUrl;
    });
}

// Gabungkan semua foto di antrian jadi 1 file PDF multi-halaman (1 foto = 1
// halaman, ukuran halaman menyesuaikan ukuran foto), lalu upload seperti PDF biasa.
async function dsConvertAndUploadPhotos() {
    if (photoQueue.length === 0) return;
    dsSetStatus(`Membuat PDF dari ${photoQueue.length} foto...`, 'sky');
    dsSetButtonsDisabled(true);

    try {
        const { jsPDF } = window.jspdf;
        let pdf = null;

        for (let i = 0; i < photoQueue.length; i++) {
            const dataUrl = photoQueue[i].dataUrl;
            const dims = await dsGetImageDims(dataUrl);
            const wPt = dims.width * 0.75; // px (96dpi) -> pt (72dpi)
            const hPt = dims.height * 0.75;

            if (!pdf) {
                pdf = new jsPDF({ unit: 'pt', format: [wPt, hPt] });
            } else {
                pdf.addPage([wPt, hPt]);
            }
            pdf.addImage(dataUrl, 'JPEG', 0, 0, wPt, hPt);
        }

        const base64 = pdf.output('datauristring').split(',')[1];
        photoQueue = [];
        await dsUploadBase64Pdf(base64);
    } catch (e) {
        dsSetStatus('❌ Gagal membuat PDF: ' + (e.message || ''), 'red');
        dsSetButtonsDisabled(false);
    }
}

// ============================================================
// Upload / hapus dokumen — file tetap lewat GAS (Drive), link hasilnya
// disinkron ke Supabase (pola sama dgn halaman Kegiatan & Perbantuan versi web).
// ============================================================

// Deteksi tag SPBy-XXXX / Kkp-XXXX / SPM-XXXX di teks Uraian, dipakai buat
// nyari baris LAIN yang perlu ikut dapat link sama (1 upload bisa berlaku
// utk beberapa baris kalau Uraian-nya sama/tag-nya sama).
function dsFindDokTagMatchText(uraian) {
    const u = String(uraian || '');
    let m = u.match(/SPBy-\d+/i); if (m) return m[0];
    m = u.match(/Kkp-\d+/i); if (m) return m[0];
    m = u.match(/SPM-\d+/i); if (m) return m[0];
    return null;
}

async function dsFindTargetIdsForDokLink(row) {
    const allRows = await dsGetAllRows();
    const uraianSource = String(row.C || '').trim();
    const tagMatch = dsFindDokTagMatchText(uraianSource);
    if (tagMatch) {
        const tagLower = tagMatch.toLowerCase();
        return allRows.filter(r => String(r.C || '').toLowerCase().includes(tagLower)).map(r => r.A);
    }
    return allRows.filter(r => String(r.C || '').trim() === uraianSource).map(r => r.A);
}

async function dsSyncDokLinkToDb(targetIds, link) {
    if (!targetIds || targetIds.length === 0) return;
    try {
        await waitSupabaseAuthReady();
        const rows = targetIds.map(id => ({ id, dokumen_link: link }));
        const { error } = await sb.from('kegiatan').upsert(rows, { onConflict: 'id' });
        if (error) throw new Error(error.message);

        // Perbarui cache di memori juga, biar kalau user cari lagi tanpa
        // reload halaman, ikon dokumennya sudah benar.
        if (dsAllRowsCache) {
            targetIds.forEach(id => {
                const r = dsAllRowsCache.find(x => String(x.A) === String(id));
                if (r) r.T = link;
            });
        }
    } catch (e) {
        console.error('Gagal sinkron link dokumen ke Supabase:', e);
    }
}

async function dsUploadBase64Pdf(base64) {
    dsSetStatus('Mengupload dokumen...', 'sky');

    try {

            fileData: base64,
            fileName: currentRow.A + '.pdf',
            uraian: currentRow.C,
            nomorSPM: currentRow.R

        if (result.status === 'success') {
            const targetIds = await dsFindTargetIdsForDokLink(currentRow);
            currentRow.T = result.link;
            dsUpdateCardIcon(currentRow.A, result.link);
            // Satu upload bisa berlaku utk beberapa baris (Uraian sama, ID beda) ->
            // update juga kartu lain yang kebetulan lagi tampil di hasil pencarian.
            targetIds.forEach(rid => dsUpdateCardIcon(rid, result.link));
            await dsSyncDokLinkToDb(targetIds, result.link);

            dsSetStatus('✅ Dokumen berhasil diupload.', 'emerald');
            dsRenderSheet();
        } else {
            dsSetStatus('❌ ' + (result.message || 'Upload gagal.'), 'red');
            dsSetButtonsDisabled(false);
        }
    } catch (e) {
        dsSetStatus('❌ ' + (e.message || 'Upload gagal.'), 'red');
        dsSetButtonsDisabled(false);
    }

// ============================================================
// TAB: POK (baca saja) — bertingkat per Seksi, meniru struktur web
// (pok.js renderPok), tapi berupa kartu bisa-tap, bukan tabel.
// ============================================================
let dsPokRowsCache = null;
let dsPokExpandedSeksi = new Set();
let dsPokExpandedCodes = new Set(); // key: "<seksi>::<kode>", sama pola dgn web

async function dsGetPokRows() {
    if (dsPokRowsCache) return dsPokRowsCache;
    await waitSupabaseAuthReady();
    const [pokRows, kegiatanRows, blokirRows] = await Promise.all([
        sbFetchAll('pok'),
        dsGetAllRows(),
        sbFetchAll('blokir')
    ]);

    const realisasiByMak = {};
    kegiatanRows.forEach(k => {
        const mak = String(k.B || '').trim();
        if (!mak) return;
        realisasiByMak[mak] = (realisasiByMak[mak] || 0) + (Number(k.M) || 0);
    });
    const blokirByKode = {};
    blokirRows.forEach(b => { blokirByKode[b.id] = Number(b.nilai) || 0; });

    dsPokRowsCache = pokRows.map(d => {
        const kode = d.kode || d.id;
        const pagu = Number(d.pagu) || 0;
        const blokir = blokirByKode[kode] || 0;
        const realisasi = realisasiByMak[kode] || 0;
        const sisa = pagu - blokir - realisasi;
        return { kode, uraian: d.uraian || '', pagu, blokir, realisasi, sisa, sumber: d.sd || '', bidang: d.seksi || 'Lainnya' };
    });
    return dsPokRowsCache;
}

// Sama persis dengan POK_SEKSI_COLORS di pok.js (web) — biar konsisten.
const DS_POK_SEKSI_COLORS = {
    'PN': 'bg-sky-100 text-sky-700',
    'HI': 'bg-purple-100 text-purple-700',
    'KI': 'bg-amber-100 text-amber-700',
    'Lelang': 'bg-rose-100 text-rose-700',
    'Penilaian': 'bg-emerald-100 text-emerald-700',
    'PKN': 'bg-indigo-100 text-indigo-700',
    'Umum': 'bg-slate-200 text-slate-700'
};
function dsPokSeksiBadgeClass(seksi) {
    return DS_POK_SEKSI_COLORS[seksi] || 'bg-slate-100 text-slate-600';
}

function dsRenderPokLeafCard(item) {
    const penyebut = item.pagu - item.blokir;
    const persen = penyebut ? Math.min(Math.max((item.realisasi / penyebut) * 100, 0), 100) : 0;
    const warna = persen >= 100 ? 'bg-red-500' : (persen >= 80 ? 'bg-amber-500' : 'bg-sky-500');
    const sisaClass = item.sisa < 0 ? 'text-red-600 font-semibold' : 'text-slate-700';
    // Sama persis dgn web: leaf PNBP = pink, leaf RM = biru.
    const isPnbp = item.sumber === 'PNBP';
    const cardBg = isPnbp ? 'bg-pink-100 border-pink-200' : 'bg-blue-100 border-blue-200';
    const badgeBg = isPnbp ? 'bg-pink-600 text-white' : 'bg-blue-600 text-white';
    return `
    <div class="${cardBg} rounded-xl border p-3 mb-2">
        <div class="flex items-start justify-between gap-2">
            <p class="text-[11px] font-mono text-slate-500">${escHtml(item.kode)}</p>
            <span class="text-[10px] px-1.5 py-0.5 rounded-full font-medium shrink-0 ${badgeBg}">${escHtml(item.sumber || '-')}</span>
        </div>
        <p class="text-sm font-medium text-slate-800 mt-0.5 mb-2 leading-snug">${escHtml(item.uraian)}</p>
        <div class="w-full h-1.5 bg-white/60 rounded-full overflow-hidden mb-2">
            <div class="h-full ${warna} rounded-full" style="width:${persen}%"></div>
        </div>
        <div class="grid grid-cols-2 gap-x-3 gap-y-1 text-[11px]">
            <div><span class="text-slate-500">Pagu</span> <span class="font-medium text-slate-800 float-right">${Number(item.pagu).toLocaleString('id-ID')}</span></div>
            <div><span class="text-slate-500">Blokir</span> <span class="font-medium text-slate-800 float-right">${Number(item.blokir).toLocaleString('id-ID')}</span></div>
            <div><span class="text-slate-500">Realisasi</span> <span class="font-medium text-slate-800 float-right">${Number(item.realisasi).toLocaleString('id-ID')}</span></div>
            <div><span class="text-slate-500">Sisa</span> <span class="font-medium ${sisaClass} float-right">${Number(item.sisa).toLocaleString('id-ID')}</span></div>
        </div>
    </div>`;
}

function dsRenderPokParentRow(item, seksi, hasChildren, depth) {
    const expandKey = seksi + '::' + item.kode;
    const isOpen = dsPokExpandedCodes.has(expandKey);
    const indentPx = Math.min(depth - 1, 5) * 14;
    // Sama pola dgn web: depth<=2 abu-abu (level tinggi), lainnya biru muda
    // (penanda visual "bisa di-tap buat expand").
    const rowBg = depth <= 2 ? 'bg-slate-50' : 'bg-sky-50 active:bg-sky-100';
    return `
    <div class="ds-pok-parent flex items-center justify-between py-2.5 px-2 mb-1 rounded-lg ${rowBg}" style="padding-left:${12 + indentPx}px" data-kode="${escHtml(item.kode)}" data-seksi="${escHtml(seksi)}">
        <span class="text-sm ${depth <= 2 ? 'font-bold' : 'font-semibold'} text-slate-700 flex-1 pr-2">${escHtml(item.uraian)}</span>
        ${hasChildren ? `<i class="fa-solid ${isOpen ? 'fa-chevron-down' : 'fa-chevron-right'} text-xs text-slate-400 shrink-0"></i>` : ''}
    </div>`;
}

function dsRenderPokTreeForSeksi(seksi, items) {
    let html = '';
    items.forEach(item => {
        const c = String(item.kode);
        const isParent = c.length === 12; // level Kegiatan, selalu tampil
        const isLeaf = c.length > 27;
        const isChildVisible = Array.from(dsPokExpandedCodes).some(k => {
            if (!k.startsWith(seksi + '::')) return false;
            const p = k.slice((seksi + '::').length);
            return c.startsWith(p) && c !== p;
        });
        if (!isParent && !isChildVisible) return;

        const depth = c.split('.').length;
        const hasChildren = items.some(ch => String(ch.kode).startsWith(c) && String(ch.kode) !== c);

        if (isLeaf) {
            html += `<div style="padding-left:${Math.min(depth - 1, 5) * 14}px">${dsRenderPokLeafCard(item)}</div>`;
        } else {
            html += dsRenderPokParentRow(item, seksi, hasChildren, depth);
        }
    });
    return html;
}

function dsRenderPokBrowse() {
    const resultsEl = $('ds-pokResults');

    // Dedup kode+seksi dulu (1 kode bisa punya beberapa Seksi), sama pola web.
    const uniqueMap = new Map();
    dsPokRowsCache.forEach(item => uniqueMap.set(String(item.kode) + '|' + (item.bidang || ''), item));
    const uniqueData = Array.from(uniqueMap.values());

    const groups = new Map();
    uniqueData.forEach(item => {
        const seksi = item.bidang || 'Lainnya';
        if (!groups.has(seksi)) groups.set(seksi, []);
        groups.get(seksi).push(item);
    });

    let html = '';
    groups.forEach((items, seksi) => {
        const isOpen = dsPokExpandedSeksi.has(seksi);
        html += `
        <div class="ds-pok-seksiHeader ${dsPokSeksiBadgeClass(seksi)} rounded-xl px-3.5 py-3 mb-2" data-seksi="${escHtml(seksi)}">
            <span class="text-sm font-bold"><i class="fa-solid ${isOpen ? 'fa-chevron-down' : 'fa-chevron-right'} text-xs mr-2"></i>${escHtml(seksi)} <span class="font-normal text-xs opacity-70">(${items.length} item)</span></span>
        </div>`;
        if (isOpen) {
            html += `<div class="mb-3">${dsRenderPokTreeForSeksi(seksi, items)}</div>`;
        }
    });

    resultsEl.innerHTML = html;
    dsWirePokTreeEvents();
}

function dsWirePokTreeEvents() {
    document.querySelectorAll('.ds-pok-seksiHeader').forEach(el => {
        el.onclick = () => {
            const seksi = el.dataset.seksi;
            if (dsPokExpandedSeksi.has(seksi)) dsPokExpandedSeksi.delete(seksi);
            else dsPokExpandedSeksi.add(seksi);
            dsRenderPokBrowse();
        };
    });
    document.querySelectorAll('.ds-pok-parent').forEach(el => {
        el.onclick = () => {
            const kode = el.dataset.kode;
            const seksi = el.dataset.seksi;
            const key = seksi + '::' + kode;
            if (dsPokExpandedCodes.has(key)) dsPokExpandedCodes.delete(key);
            else dsPokExpandedCodes.add(key);
            dsRenderPokBrowse();
        };
    });
}

// Tanpa kata kunci -> tampil struktur bertingkat per Seksi (spt web).
// Dengan kata kunci -> tampil FLAT list baris detail (leaf) yang cocok saja.
async function dsRunPokSearch() {
    const q = $('ds-pokSearchInput').value.trim().toLowerCase();
    const resultsEl = $('ds-pokResults');

    resultsEl.innerHTML = `<div class="text-center text-sky-600 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;

    try {
        await dsGetPokRows();

        if (!q) {
            dsRenderPokBrowse();
            return;
        }

        const uniqueMap = new Map();
        dsPokRowsCache.forEach(item => uniqueMap.set(String(item.kode) + '|' + (item.bidang || ''), item));
        const leafOnly = Array.from(uniqueMap.values()).filter(item => String(item.kode).length > 27);

        const matched = leafOnly.filter(r => String(r.kode).toLowerCase().includes(q) || String(r.uraian).toLowerCase().includes(q));
        const MAX_SHOW = 30;
        const rows = matched.slice(0, MAX_SHOW);

        if (rows.length === 0) {
            resultsEl.innerHTML = `<div class="text-center text-slate-400 py-12"><i class="fa-regular fa-folder-open text-3xl mb-2"></i><p class="text-sm">Data tidak ditemukan.</p></div>`;
            return;
        }
        const hintHtml = matched.length > rows.length
            ? `<p class="text-xs text-slate-400 mb-2">Menampilkan ${rows.length} dari ${matched.length} hasil.</p>`
            : `<p class="text-xs text-slate-400 mb-2">${rows.length} hasil ditemukan.</p>`;
        resultsEl.innerHTML = hintHtml + rows.map(dsRenderPokLeafCard).join('');
    } catch (e) {
        resultsEl.innerHTML = `<div class="text-center text-red-500 py-10">❌ ${escHtml(e.message || 'Terjadi kesalahan.')}</div>`;
    }
}

async function dsRunRefSearch() {
    dsRefLoaded = true;
    const q = $('ds-refSearchInput').value.trim().toLowerCase();
    const resultsEl = $('ds-refResults');
    resultsEl.innerHTML = `<div class="text-center text-sky-600 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;

    try {
        if (dsRefMode === 'sbm') {
            const allRows = await dsGetSbmRows();
            const matched = q ? allRows.filter(r => String(r.kabupaten).toLowerCase().includes(q)) : allRows;
            resultsEl.innerHTML = matched.length
                ? matched.map(dsRenderSbmCard).join('')
                : `<div class="text-center text-slate-400 py-12 text-sm">Tidak ada data yang cocok.</div>`;
        } else if (dsRefMode === 'pegawai') {
            const allRows = await dsGetPegawaiRows();
            const matched = q ? allRows.filter(r => String(r.nama).toLowerCase().includes(q) || String(r.nip).toLowerCase().includes(q)) : allRows;
            resultsEl.innerHTML = matched.length
                ? matched.slice(0, 30).map(dsRenderPegawaiCard).join('')
                : `<div class="text-center text-slate-400 py-12 text-sm">Tidak ada data yang cocok.</div>`;
        } else if (dsRefMode === 'userManager') {
            const allRows = await dsGetPegawaiRows();
            const matched = q ? allRows.filter(r => String(r.nama).toLowerCase().includes(q) || String(r.nip).toLowerCase().includes(q)) : allRows;
            if (!matched.length) {
                resultsEl.innerHTML = `<div class="text-center text-slate-400 py-12 text-sm">Tidak ada data yang cocok.</div>`;
                return;
            }
            resultsEl.innerHTML = matched.slice(0, 30).map(dsRenderUserManagerCard).join('');
            resultsEl.querySelectorAll('.ds-um-card').forEach(card => {
                const btn = card.querySelector('.ds-um-btnReset');
                const nip = card.dataset.nip;
                const nama = card.dataset.nama;
                btn.onclick = () => dsResetUserPassword(btn, nip, nama);
            });
        }
    } catch (e) {
        resultsEl.innerHTML = `<div class="text-center text-red-500 py-10">❌ ${escHtml(e.message || 'Terjadi kesalahan.')}</div>`;
    }
}

async function dsResetUserPassword(btn, nip, nama) {
    if (!confirm(`Reset password ${nama} (${nip}) ke default (NIP)?`)) return;
    btn.disabled = true;
    const originalHtml = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
    try {
        await waitSupabaseAuthReady();
        const { data: { session } } = await sb.auth.getSession();
        if (!session) throw new Error('Sesi tidak valid, login ulang.');

        const result = await apiPost({
            action: 'resetUserPasswordSuperadmin',
            accessToken: session.access_token,
            targetNip: nip
        });

        if (result.status === 'success') {
            btn.innerHTML = '<i class="fa-solid fa-check"></i>';
            setTimeout(() => { btn.disabled = false; btn.innerHTML = originalHtml; }, 1500);
        } else {
            alert('Gagal: ' + (result.message || 'Terjadi kesalahan.'));
            btn.disabled = false;
            btn.innerHTML = originalHtml;
        }
    } catch (e) {
        alert('Error koneksi: ' + (e.message || 'Tidak diketahui'));
        btn.disabled = false;
        btn.innerHTML = originalHtml;
    }
}

async function dsRenderUserTab() {

    const resultsEl = $('ds-userResults');
    resultsEl.innerHTML = `<div class="text-center text-sky-600 py-10"><i class="fa-solid fa-spinner fa-spin text-2xl"></i></div>`;

    const nama = localStorage.getItem('nama') || '-';
    const nip = localStorage.getItem('nip') || '-';
    const jabatan = localStorage.getItem('jabatan') || '-';
    const pangkat = localStorage.getItem('pangkat') || '-';
    const kepeg = localStorage.getItem('kepeg') === '1' ? 'PNS' : 'PPNPN';

    try {
        const allRows = await dsGetAllRows();
        const namaLower = nama.trim().toLowerCase();

        // Perjadin = MAK 524111/524113, pelaksana harus sama persis dgn nama login.
        const myPerjadin = allRows.filter(r =>
            (String(r.B || '').includes('524111') || String(r.B || '').includes('524113')) &&
            String(r.D || '').trim().toLowerCase() === namaLower
        );

        const statusCount = { 'Rekam Data': 0, 'Terlaksana': 0, 'LPT': 0, 'Terbayar': 0, 'Selesai': 0 };
        let totalJumlah = 0;
        myPerjadin.forEach(r => {
            if (statusCount.hasOwnProperty(r.P)) statusCount[r.P]++;
            totalJumlah += Number(r.M) || 0;
        });

        const sortedByTgl = [...myPerjadin].sort((a, b) => new Date(b.G || 0) - new Date(a.G || 0));

        resultsEl.innerHTML = `
            <div class="bg-white rounded-2xl border border-slate-200 p-4 mb-4">
                <div class="flex items-center gap-3 mb-1">
                    <div class="w-11 h-11 rounded-full bg-sky-100 text-sky-700 flex items-center justify-center text-lg font-semibold shrink-0">
                        ${escHtml(nama.charAt(0).toUpperCase())}
                    </div>
                    <div class="min-w-0">
                        <p class="text-sm font-semibold text-slate-800 truncate">${escHtml(nama)}</p>
                        <p class="text-xs text-slate-400">${escHtml(nip)}</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 text-xs mt-3 pt-3 border-t border-slate-100">
                    <div><span class="text-slate-400">Jabatan</span><br><span class="text-slate-700 font-medium">${escHtml(jabatan)}</span></div>
                    <div><span class="text-slate-400">Pangkat</span><br><span class="text-slate-700 font-medium">${escHtml(pangkat)}</span></div>
                    <div><span class="text-slate-400">Kepegawaian</span><br><span class="text-slate-700 font-medium">${escHtml(kepeg)}</span></div>
                    <div><span class="text-slate-400">Total Perjadin</span><br><span class="text-slate-700 font-medium">Rp ${totalJumlah.toLocaleString('id-ID')}</span></div>
                </div>
            </div>

            <p class="text-xs font-semibold text-slate-500 mb-2 px-1">Ringkasan Status Perjadinku (${myPerjadin.length} kegiatan)</p>
            <div class="grid grid-cols-3 gap-2 mb-4">
                ${Object.entries(statusCount).map(([status, count]) => `
                    <div class="bg-white rounded-xl border border-slate-200 p-2.5 text-center">
                        <p class="text-lg font-bold text-slate-800">${count}</p>
                        <p class="text-[10px] text-slate-400 leading-tight mt-0.5">${escHtml(status)}</p>
                    </div>
                `).join('')}
            </div>

            <p class="text-xs font-semibold text-slate-500 mb-2 px-1">Riwayat Perjadin Terbaru</p>
            <div id="ds-userPerjadinList"></div>
        `;

        const listEl = $('ds-userPerjadinList');
        if (sortedByTgl.length === 0) {
            listEl.innerHTML = `<div class="text-center text-slate-400 py-8 text-sm">Belum ada data perjadin.</div>`;
            return;
        }
        listEl.innerHTML = sortedByTgl.slice(0, 20).map(r => `
            <div class="ds-userPerjadinCard bg-white rounded-xl border border-slate-200 p-3.5 mb-2.5 active:bg-slate-50" data-id="${escHtml(r.A)}">
                <p class="text-sm font-medium text-slate-800 leading-snug">${escHtml(r.C)}</p>

                    <span class="text-xs text-slate-400">${escHtml(r.G || '-')} &middot; Rp ${Number(r.M || 0).toLocaleString('id-ID')}</span>
                    <span class="px-2 py-0.5 rounded-full text-[11px] font-medium ${statusBadgeClass(r.P)}">${escHtml(r.P)}</span>
                </div>
            </div>
        `).join('');

        listEl.querySelectorAll('.ds-userPerjadinCard').forEach(card => {
            const id = card.dataset.id;
            const row = sortedByTgl.find(r => String(r.A) === id);
            card.onclick = () => dsOpenDetail(row);
        });
    } catch (e) {
        resultsEl.innerHTML = `<div class="text-center text-red-500 py-10">❌ ${escHtml(e.message || 'Terjadi kesalahan.')}</div>`;
    }
}

            if (dsActiveTab === 'home') {
                if ($('ds-searchInput').value.trim()) await runSearch();
            } else if (dsActiveTab === 'pok') {
                await dsRunPokSearch();
            } else if (dsActiveTab === 'referensi') {
                await dsRunRefSearch();
            } else if (dsActiveTab === 'user') {
                dsAllRowsCache = null;
                await dsRenderUserTab();
            }
            showToastSOH('Data berhasil dimuat ulang');
        } catch (e) {
            showToastSOH('Gagal memuat ulang: ' + (e.message || 'Terjadi kesalahan'), true);
        } finally {
            icon.classList.remove('fa-spin');
        }
    };

    $('ds-btnLogout').onclick = () => {
        if (!confirm('Yakin ingin keluar?')) return;
        // Titipkan halaman ini supaya setelah login lagi, balik ke SOH
        // (bukan ke dashboard.html SiMAB versi web) — dibaca index.html,
        // kadaluarsa otomatis 10 menit kalau nggak jadi login lagi.
        localStorage.setItem('postLoginRedirect', JSON.stringify({ page: 'dokumen-scan.html', ts: Date.now() }));
        ['nama', 'nip', 'realUrl', 'admin', 'jabatan', 'pangkat', 'kepeg', 'kantor', 'aksesMenu', 'lastActivity']
            .forEach(k => localStorage.removeItem(k));
        window.location.href = 'index.html';
    };

    const updateOfflineBanner = () => $('ds-offlineBanner').classList.toggle('hidden', navigator.onLine);
    window.addEventListener('online', updateOfflineBanner);
    window.addEventListener('offline', updateOfflineBanner);
    updateOfflineBanner();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw-dokumen.js').catch(() => {});
    }
});
</script>
</body>
</html>

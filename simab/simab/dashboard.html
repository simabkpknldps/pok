<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛡️SiMAB</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Remap warna Tailwind bawaan (sky, slate, dst) ke palet iOS/macOS —
        // supaya SEMUA halaman lain (Kegiatan, Referensi, Perbantuan, RPD,
        // Statistik, Kalender, Perjadin) yang masih pakai kelas Tailwind
        // lama (bg-sky-600, text-slate-500, dst) OTOMATIS ikut gaya baru,
        // tanpa perlu diedit satu-satu. Cuma "slate" & "sky" yg paling
        // sering dipakai (netral & aksen utama); warna lain (green/red/dst)
        // juga dihaluskan biar senada, tapi TETAP beda hue-nya (fungsi
        // warnanya tidak berubah, cuma nuansanya lebih iOS).
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: { 50: '#F6F6F8', 100: '#F0F0F2', 200: '#E5E5EA', 300: '#D1D1D6', 400: '#AEAEB2', 500: '#86868B', 600: '#6E6E73', 700: '#48484A', 800: '#1D1D1F', 900: '#000000' },
                        sky:   { 50: '#EAF4FE', 100: '#D6E9FD', 200: '#ADD3FB', 300: '#7FB8F7', 400: '#4A97F0', 500: '#0071E3', 600: '#0071E3', 700: '#0071E3', 800: '#0059B3', 900: '#004080' },
                        emerald: { 50: '#E9F9EE', 100: '#D3F3DD', 500: '#34C759', 600: '#2FB550', 700: '#248A3D', 800: '#1D6E31' },
                        green:   { 50: '#E9F9EE', 100: '#D3F3DD', 400: '#4CD164', 500: '#34C759', 600: '#2FB550', 700: '#248A3D' },
                        red:     { 50: '#FFEDEC', 100: '#FFDAD9', 300: '#FF8A84', 500: '#FF3B30', 600: '#E6352B', 700: '#CC2E25' },
                        amber:   { 100: '#FFF1D6', 400: '#FFBB4D', 500: '#FF9F0A', 800: '#C77400' },
                        yellow:  { 200: '#FFEDA3', 300: '#FFE578' },
                        purple:  { 100: '#F1E3FB', 800: '#7A2FA8' },
                        pink:    { 200: '#FFC9D9', 300: '#FFA8C3', 700: '#D6005C' },
                        blue:    { 200: '#B8D9FC', 300: '#8FC1FA', 400: '#4A97F0' }
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/app.css">
</head>
<body class="flex h-screen overflow-hidden" style="background: #EEEEF0; color: var(--label); font-family: var(--sf);">

    <aside class="w-60 flex flex-col shrink-0" style="background: var(--sidebar-bg); border-right: 1px solid var(--divider);">
        <div class="px-5 pt-6 pb-5 flex items-center gap-2.5">
            <div class="w-8 h-8 rounded-[9px] flex items-center justify-center shrink-0" style="background: linear-gradient(160deg, #5B8DEF 0%, #0071E3 100%); box-shadow: 0 4px 10px -3px rgba(0,113,227,0.5);">
                <i class="fa-solid fa-shield-halved text-white text-xs"></i>
            </div>
            <h1 class="text-[15px] font-semibold" style="color: var(--label);">SiMAB</h1>
        </div>
        <nav class="px-3 space-y-0.5 flex-grow overflow-y-auto">
            <button onclick="navigate('dashboard')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-gauge"></i> Dashboard</button>
            <button onclick="navigate('pok')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-folder-open"></i> POK</button>
            <button onclick="navigate('kegiatan')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-list-check"></i> Daftar Kegiatan</button>
            <button onclick="navigate('perjadin')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-wallet"></i> Perjadinku</button>
            <button onclick="navigate('kalender')" class="nav-btn sidebar-nav-btn"><i class="fa-regular fa-calendar"></i> Kalender</button>
            <button onclick="navigate('statistik')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-chart-column"></i> Statistik</button>
            <button onclick="navigate('rpd')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-table"></i> RPD</button>
            <button onclick="navigate('referensi')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-book"></i> Referensi</button>
            <button onclick="navigate('perbantuan')" class="nav-btn sidebar-nav-btn"><i class="fa-solid fa-hands-helping"></i> Perbantuan</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-16 flex items-center justify-between px-7 shrink-0" style="background: rgba(255,255,255,0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--divider);">
            <h2 id="page-title" class="text-[17px] font-semibold" style="color: var(--label);">Dashboard</h2>
            <div class="flex items-center gap-5">
                <span id="user-name" class="text-[13px] font-medium flex items-center gap-1.5" style="color: var(--label-secondary);">
                    <i class="fa-regular fa-circle-user text-[15px]"></i><span id="nama-login">Guest</span>
                </span>
                <div id="notif-wrapper" class="relative">
                    <button id="notif-bell-btn" onclick="toggleNotifikasiDropdown()" class="relative text-[15px] transition" style="color: var(--label-secondary);" title="Notifikasi">
                        <i class="fa-solid fa-bell"></i>
                        <span id="notif-badge" class="hidden absolute -top-1.5 -right-1.5 text-white text-[9px] leading-none rounded-full px-1 py-1 min-w-[15px] text-center font-semibold" style="background: var(--ios-red);">0</span>
                    </button>
                    <div id="notif-dropdown" class="hidden absolute right-0 mt-2.5 w-80 max-h-96 overflow-y-auto z-50 ios-panel" style="box-shadow: 0 12px 32px -8px rgba(0,0,0,0.25);">
                        <div class="p-3 font-semibold text-[13px]" style="color: var(--label); border-bottom: 1px solid var(--divider);">Notifikasi</div>
                        <div id="notif-list" class="divide-y" style="border-color: var(--divider);"></div>
                    </div>
                </div>
                <button onclick="openSettings()" class="text-[15px] transition" style="color: var(--label-secondary);" title="Settings"><i class="fa-solid fa-gear"></i></button>
                <button onclick="logout()" class="text-[13px] font-medium flex items-center gap-1.5 transition" style="color: var(--ios-red);" title="Logout"><i class="fa-solid fa-right-from-bracket"></i> Logout</button>
            </div>
        </header>
        <div id="app" class="flex-1 p-7 overflow-y-auto space-y-6"></div>
    </main>

    <!-- Notifikasi global, dipakai halaman manapun -->
    <div id="toastContainer" class="fixed top-5 right-5 z-50 space-y-2"></div>

    <!-- session.js WAJIB PALING PERTAMA: guard login + auto-logout idle 1 jam -->
    <script src="js/session.js"></script>

    <!-- Supabase (Auth + Database) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <script src="js/supabase-config.js"></script>

    <!-- Urutan penting: common & api dulu, baru router, baru semua js per-halaman  -->
    <script src="js/common.js"></script>
    <script src="js/api.js"></script>
    <script src="js/pdf-viewer.js"></script>
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/dashboard-search.js"></script>
    <script src="js/pages/pok.js"></script>
    <script src="js/pages/kegiatan.js"></script>
    <script src="js/pages/perjadin.js"></script>
    <script src="js/pages/kalender.js"></script>
    <script src="js/pages/statistik.js"></script>
    <script src="js/pages/rpd.js"></script>
    <script src="js/pages/referensi.js"></script>
    <script src="js/pages/perbantuan.js"></script>
    <script src="js/router.js"></script>
</body>
</html>

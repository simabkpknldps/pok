<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMAB - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 border-b border-slate-100"><h1 class="text-2xl font-bold text-sky-700 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-sky-500"></i> SiMAB</h1></div>
        <nav class="p-4 space-y-2 flex-grow">
            <button onclick="navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-gauge mr-3"></i> Dashboard</button>
            <button onclick="navigate('pok')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-folder-open mr-3"></i> POK</button>
            <button onclick="navigate('kegiatan')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-list-check mr-3"></i> Daftar Kegiatan</button>
            <button onclick="navigate('perjadin')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-wallet mr-3"></i> Perjadinku</button>
            <button onclick="navigate('kalender')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-regular fa-calendar mr-3"></i> Kalender</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 id="page-title" class="text-lg font-semibold text-slate-700">Dashboard</h2>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium text-sm"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
        </header>
        <div id="app" class="flex-1 p-8 overflow-y-auto space-y-6"></div>
    </main>

    <script>
        let dashboardDataCache = null;
        window.rawPokData = [];
        window.expandedCodes = new Set();

        async function navigate(page) {
            const container = document.getElementById('app');
            const title = document.getElementById('page-title');
            title.innerText = page.charAt(0).toUpperCase() + page.slice(1);
            
            if (page === 'dashboard') {
                renderDashboardPage(container);
            } else if (page === 'pok') {
                container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-slate-800">Daftar POK</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-sm"><thead class="bg-slate-50 border-b"><tr><th class="p-4">Kode</th><th class="p-4">Uraian</th><th class="p-4">Pagu</th><th class="p-4">Blokir</th><th class="p-4">Realisasi</th><th class="p-4">Sisa</th><th class="p-4">Aksi</th></tr></thead><tbody id="pok-tbody"><tr><td colspan="6" class="p-8 text-center"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</td></tr></tbody></table>
                    </div>
                </div>`;
                loadPokData();
            } else {
                container.innerHTML = `<h1 class="text-2xl font-bold">Halaman ${page}</h1>`;
            }
        }

        // --- LOGIKA POK ---
        async function loadPokData() {
            try {
                const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getPOKData' }) });
                window.rawPokData = await res.json();
                renderPok();
            } catch (e) {
                document.getElementById('pok-tbody').innerHTML = `<tr><td colspan="7" class="text-red-500 p-4 text-center">Gagal memuat data.</td></tr>`;
            }
        }

        function renderPok() {
            const tbody = document.getElementById('pok-tbody');
            if (!window.rawPokData || window.rawPokData.length === 0) return;

            // 1. Mencegah duplikat dengan Map
            // Kita gunakan Map agar jika ada kode yang sama, hanya satu yang diambil (data terakhir)
            const uniqueMap = new Map();
            window.rawPokData.forEach(item => {
                uniqueMap.set(String(item.kode), item);
            });
            const uniqueData = Array.from(uniqueMap.values());

            // 2. Filter untuk tampilan (Root level = 12 karakter)
            const filtered = uniqueData.filter(i => {
                const c = String(i.kode);
                if (c.length === 12) return true;
                return Array.from(window.expandedCodes).some(p => c.startsWith(p) && c !== p);
            });

            tbody.innerHTML = filtered.map(i => {
                const c = String(i.kode);
                const hasChildren = uniqueData.some(ch => String(ch.kode).startsWith(c) && String(ch.kode) !== c);
                const bg = c.length > 27 ? (i.sumber === 'PNBP' ? 'bg-pink-50' : 'bg-blue-50') : 'bg-white';
                
                return `<tr class="border-b hover:bg-slate-100 ${bg} cursor-pointer" onclick="toggleExpand('${c}')">
                    <td class="p-3 font-mono text-xs font-bold">${c}</td>
                    <td class="p-3 font-medium">${i.uraian} ${hasChildren ? (window.expandedCodes.has(c) ? ' <i class="fa-solid fa-chevron-down text-[10px]"></i>' : ' <i class="fa-solid fa-chevron-right text-[10px]"></i>') : ''}</td>
                    <td class="p-3 text-right">${Number(i.pagu||0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.blokir||0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.realisasi||0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.sisa||0).toLocaleString()}</td>
                    <td class="p-3 text-center">
                        ${c.length > 27 ? `
                            <button class="bg-sky-600 text-white px-2 py-1 rounded text-[10px] hover:bg-sky-700 mr-1">Rekam</button>
                            <button class="bg-slate-600 text-white px-2 py-1 rounded text-[10px] hover:bg-slate-700">Detil</button>
                        ` : ''}
                    </td>
                </tr>`;
            }).join('');
        }

        function toggleExpand(code) {
            if (window.expandedCodes.has(code)) {
                // Jika diklik yang sedang terbuka, maka tutup (delete)
                window.expandedCodes.delete(code);
            } else {
                // Jika buka yang baru, hapus semua yang terbuka sebelumnya, lalu buka yang baru
                window.expandedCodes.clear(); 
                window.expandedCodes.add(code);
            }
            renderPok();
        }

        // --- FUNGSI DASHBOARD ---
        async function fetchDashboardData() {
            try {
                const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getDashboardData' }) });
                const data = await res.json();
                dashboardDataCache = data;
                return data;
            } catch (e) { return null; }
        }

        async function renderDashboardPage(container, isRefresh = false) {
            if (!isRefresh) container.innerHTML = `<div class="flex justify-center mt-10"><i class="fa-solid fa-spinner fa-spin text-sky-600 text-2xl"></i></div>`;
            const data = dashboardDataCache || await fetchDashboardData();
            if (!data) return;
            container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-6"><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">${renderBelanjaCard('Belanja Barang', data.barang, 'blue')}</div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">${renderBelanjaCard('Belanja Modal', data.modal, 'blue')}</div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">${renderMPCard('Maksimum Pencairan PNBP', data.mp)}</div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col"><h3 class="font-semibold text-slate-700 mb-4">Kegiatan Hari Ini</h3><div class="space-y-4 overflow-y-auto max-h-48 pr-2 custom-scrollbar">${data.kegiatanHariIni.map(item => `<div class="border-b pb-2"><div class="text-sm font-semibold">${item.uraian}</div><div class="text-[10px] text-slate-500">${item.pelaksana} | ${item.tujuan}</div></div>`).join('')}</div></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">${renderTopPerjadin(data.topPerjadin)}</div></div><div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-semibold text-slate-700 mb-4">Grafik Realisasi Perjalanan Dinas (Rp)</h3><canvas id="chartRp"></canvas></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-semibold text-slate-700 mb-4">Grafik Realisasi Perjalanan Dinas (Frek)</h3><canvas id="chartFrek"></canvas></div></div><div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200"><h3 class="font-semibold text-slate-700 mb-6">Data Per Seksi</h3><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">${Object.entries(data.seksi).map(([nama, val]) => { const p = (val * 100).toFixed(2); return `<div><div class="flex justify-between text-xs font-semibold mb-1 text-slate-600"><span>${nama}</span><span>${p}%</span></div><div class="w-full bg-slate-100 rounded-full h-2"><div class="${p<30?'bg-red-500':p<70?'bg-orange-500':p<90?'bg-yellow-400':'bg-green-500'} h-2 rounded-full" style="width: ${p}%"></div></div></div>`; }).join('')}</div></div>`;
            initCharts(data);
        }

        function initCharts(data) {
            const labels = data.grafikPerjadin.map(d => d.bulan);
            new Chart(document.getElementById('chartRp'), { type: 'line', data: { labels, datasets: [{ label: 'Rupiah', data: data.grafikPerjadin.map(d => d.rupiah), borderColor: '#0284c7', tension: 0.3 }] } });
            new Chart(document.getElementById('chartFrek'), { type: 'bar', data: { labels, datasets: [{ label: 'Frekuensi', data: data.grafikPerjadin.map(d => d.frekuensi), backgroundColor: '#0ea5e9' }] } });
        }

        function renderBelanjaCard(t, d, c) { const p = (d.persen * 100).toFixed(2); return `<div class="mb-2"><h3 class="font-semibold text-slate-700 mb-2">${t}</h3><div class="text-2xl font-bold text-${c}-600 mb-2">${p}%</div><div class="w-full bg-slate-200 rounded-full h-2 mb-4"><div class="bg-${c}-600 h-2 rounded-full" style="width: ${p}%"></div></div><div class="text-[11px] text-slate-500">Realisasi: ${d.realisasi.toLocaleString()}<br><span class="font-bold text-slate-700">Sisa: ${d.sisa.toLocaleString()}</span></div></div>`; }
        function renderMPCard(t, d) { const p = (d.persen * 100).toFixed(2); return `<div class="mb-2"><h3 class="font-semibold text-slate-700 mb-2">${t}</h3><div class="text-2xl font-bold text-emerald-600 mb-2">${p}%</div><div class="w-full bg-slate-200 rounded-full h-2 mb-4"><div class="bg-emerald-500 h-2 rounded-full" style="width: ${p}%"></div></div><div class="text-[11px] text-slate-500">Realisasi MP: ${d.realisasi.toLocaleString()}<br><span class="font-bold text-slate-700">Sisa MP: ${d.sisa.toLocaleString()}</span></div></div>`; }
        function renderTopPerjadin(l) { return `<h3 class="font-semibold text-slate-700 mb-4">Top 3 Perjadin</h3><div class="space-y-3">${l.slice(0, 3).map((i, idx) => `<div class="flex items-center justify-between"><div class="text-xs text-slate-600">${idx + 1}. ${i[0]}</div><div class="text-xs font-bold text-sky-600">${i[1]}x</div></div>`).join('')}</div>`; }
        function logout() { sessionStorage.clear(); window.location.href = 'v3_index.html'; }

        document.addEventListener("DOMContentLoaded", () => navigate('dashboard'));
    </script>
</body>
</html>

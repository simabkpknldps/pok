<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMAB - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 border-b border-slate-100"><h1 class="text-2xl font-bold text-sky-700 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-sky-500"></i> SiMAB</h1></div>
        <nav class="p-4 space-y-2 flex-grow">
            <button onclick="navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-gauge mr-3"></i> Dashboard</button>
            <button onclick="navigate('pok')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-folder-open mr-3"></i> POK</button>
            <button onclick="navigate('kegiatan')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-list-check mr-3"></i> Daftar Kegiatan</button>
            <button onclick="navigate('perjadin')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-wallet mr-3"></i> Perjadinku</button>
            <button onclick="navigate('kalender')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-regular fa-calendar mr-3"></i> Kalender</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 id="page-title" class="text-lg font-semibold text-slate-700">Dashboard</h2>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium text-sm"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
        </header>
        <div id="app" class="flex-1 p-8 overflow-y-auto space-y-6"></div>
    </main>

    <script>
        let dashboardDataCache = null;
        window.rawPokData = [];
        window.expandedCodes = new Set();

        async function navigate(page) {
            document.getElementById('page-title').innerText = page.charAt(0).toUpperCase() + page.slice(1);
            const container = document.getElementById('app');
            
            if (page === 'dashboard') {
                renderDashboardPage(container);
            } else if (page === 'pok') {
                container.innerHTML = `
                <div class="space-y-4">
                    <h2 class="text-xl font-bold text-slate-800">Daftar POK</h2>
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                        <table class="w-full text-sm">
                            <thead class="bg-slate-50 border-b border-slate-200">
                                <tr><th class="p-4 text-left">Kode</th><th class="p-4 text-left">Uraian</th><th class="p-4 text-right">Pagu</th><th class="p-4 text-right">Realisasi</th><th class="p-4 text-right">Sisa</th><th class="p-4 text-center">Aksi</th></tr>
                            </thead>
                            <tbody id="pok-tbody"><tr><td colspan="6" class="p-8 text-center"><i class="fa-solid fa-spinner fa-spin"></i> Memuat...</td></tr></tbody>
                        </table>
                    </div>
                </div>`;
                loadPokData();
            } else {
                container.innerHTML = `<h1 class="text-2xl font-bold">Halaman ${page}</h1>`;
            }
        }

        // --- FUNGSI POK ---
        async function loadPokData() {
            try {
                const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getPOKData' }) });
                window.rawPokData = await res.json();
                renderPok();
            } catch (e) {
                document.getElementById('pok-tbody').innerHTML = `<tr><td colspan="6" class="text-red-500 p-4 text-center">Gagal memuat data.</td></tr>`;
            }
        }

        function renderPok() {
            const tbody = document.getElementById('pok-tbody');
            const filtered = window.rawPokData.filter(i => String(i.kode).length === 12 || Array.from(window.expandedCodes).some(p => String(i.kode).startsWith(p) && i.kode !== p));
            tbody.innerHTML = filtered.map(i => {
                const c = String(i.kode), h = window.rawPokData.some(ch => String(ch.kode).startsWith(c) && String(ch.kode) !== c);
                const bg = c.length > 27 ? (i.sumber === 'PNBP' ? 'bg-pink-50' : 'bg-blue-50') : 'bg-white';
                return `<tr class="border-b hover:bg-slate-100 ${bg} cursor-pointer" onclick="toggleExpand('${c}')">
                    <td class="p-3 font-mono text-xs font-bold">${c}</td>
                    <td class="p-3 font-medium">${i.uraian} ${h ? (window.expandedCodes.has(c) ? ' <i class="fa-solid fa-chevron-down text-[10px]"></i>' : ' <i class="fa-solid fa-chevron-right text-[10px]"></i>') : ''}</td>
                    <td class="p-3 text-right">${Number(i.pagu||0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.realisasi||0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.sisa||0).toLocaleString()}</td>
                    <td class="p-3 text-center">${c.length > 27 ? `<button class="bg-sky-500 text-white px-2 py-1 rounded text-[10px]">Rekam</button>` : ''}</td>
                </tr>`;
            }).join('');
        }

        function toggleExpand(code) {
            window.expandedCodes.has(code) ? window.expandedCodes.delete(code) : window.expandedCodes.add(code);
            renderPok();
        }

        // --- FUNGSI DASHBOARD (DARI KODE ANDA) ---
        async function fetchDashboardData() { /* ... kode Anda ... */ }
        async function renderDashboardPage(container) { /* ... kode Anda ... */ }
        function logout() { sessionStorage.clear(); window.location.href = 'v3_index.html'; }

        document.addEventListener("DOMContentLoaded", () => navigate('dashboard'));
    </script>
</body>
</html>

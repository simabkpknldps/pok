<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMAB - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 border-b border-slate-100"><h1 class="text-2xl font-bold text-sky-700 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-sky-500"></i> SiMAB</h1></div>
        <nav class="p-4 space-y-2 flex-grow">
            <button onclick="navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-gauge mr-3"></i> Dashboard</button>
            <button onclick="navigate('pok')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-folder-open mr-3"></i> POK</button>
            <button onclick="navigate('kegiatan')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-list-check mr-3"></i> Daftar Kegiatan</button>
            <button onclick="navigate('perjadin')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-wallet mr-3"></i> Perjadinku</button>
            <button onclick="navigate('kalender')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-regular fa-calendar mr-3"></i> Kalender</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 id="page-title" class="text-lg font-semibold text-slate-700">Dashboard</h2>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium text-sm"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
        </header>
        <div id="app" class="flex-1 p-8 overflow-y-auto space-y-6"></div>
    </main>

    <!-- Modal Rekam -->
    <div id="rekamModal" class="fixed inset-0 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-[980px] max-w-[96vw] overflow-hidden animate-[fade_.2s_ease]">
            <div class="bg-sky-600 text-white px-6 py-4 flex justify-between items-center">
                <div>
                    <h2 class="text-xl font-bold"><i class="fa-solid fa-pen-to-square mr-2"></i> Rekam Kegiatan</h2>
                    <p class="text-sky-100 text-sm">Input usulan kegiatan</p>
                </div>
                <button onclick="closeRekamModal()" class="w-9 h-9 rounded-full hover:bg-sky-700 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="grid grid-cols-2 gap-8 p-6">
                <div class="space-y-3">
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">ID Usulan</label><input id="idUsulan" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:ring-2 focus:ring-sky-500 transition"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">No ST/ND / Uraian Kegiatan</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:ring-2 focus:ring-sky-500 transition"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Tgl ST/ND</label><input type="date" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:ring-2 focus:ring-sky-500 transition"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Estimasi Biaya</label><input class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:ring-2 focus:ring-sky-500 transition"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Status Kecukupan Dana</label><input readonly id="statusDana" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Tujuan</label>
                        <input list="listTujuan" id="inputTujuan" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 focus:ring-2 focus:ring-sky-500 transition">
                        <datalist id="listTujuan"></datalist>
                    </div>
                </div>
                <div class="space-y-3">
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">MAK</label><input readonly id="mak" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Uraian MAK</label><input readonly id="uraianMak" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Pagu</label><input readonly id="pagu" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Blokir</label><input readonly id="blokir" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Realisasi</label><input readonly id="realisasi" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase tracking-wide text-slate-500 mb-1">Sisa</label><input readonly id="sisa" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                </div>
            </div>
            <div class="bg-slate-50 border-t px-6 py-4 flex justify-end gap-3">
                <button onclick="closeRekamModal()" class="px-6 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-100">Batal</button>
                <button class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-2.5 rounded-xl shadow">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        let dashboardDataCache = null;
        window.rawPokData = [];
        window.expandedCodes = new Set();

        async function navigate(page) {
            const container = document.getElementById('app');
            const title = document.getElementById('page-title');
            title.innerText = page.charAt(0).toUpperCase() + page.slice(1);
            if (page === 'dashboard') { renderDashboardPage(container); }
            else if (page === 'pok') {
                container.innerHTML = `<div class="space-y-4"><input type="text" id="searchPok" placeholder="Cari kode atau uraian..." class="w-full border border-slate-300 rounded-xl px-4 py-2" oninput="searchPok()"></div><div class="bg-white rounded-2xl shadow-sm border overflow-hidden"><table class="w-full text-sm"><tbody id="pok-tbody"></tbody></table></div>`;
                loadPokData();
            }
        }

        async function loadPokData() {
            try {
                const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getPOKData' }) });
                window.rawPokData = await res.json();
                renderPok();
            } catch (e) { console.error(e); }
        }

        function renderPok() {
            const tbody = document.getElementById('pok-tbody');
            const keyword = document.getElementById("searchPok")?.value.toLowerCase().trim();
            tbody.innerHTML = window.rawPokData.map(i => {
                const c = String(i.kode);
                const isMatch = keyword && (c.toLowerCase().includes(keyword) || String(i.uraian).toLowerCase().includes(keyword));
                const matchClass = isMatch ? 'bg-yellow-200' : 'bg-white';
                return `<tr data-kode="${c}" class="border-b ${matchClass} cursor-pointer" onclick="toggleExpand('${c}')">
                    <td class="p-3 font-mono text-xs font-bold">${c}</td>
                    <td class="p-3 font-medium">${i.uraian}</td>
                    <td class="p-3 text-right">${Number(i.pagu||0).toLocaleString()}</td>
                    <td class="p-3 text-center">${c.length > 27 ? `<button onclick="event.stopPropagation();openRekamModal(${window.rawPokData.indexOf(i)})" class="bg-sky-600 text-white px-2 py-1 rounded text-[10px]">Rekam</button>` : ''}</td>
                </tr>`;
            }).join('');
        }

        async function fetchLokasiData() {
            const datalist = document.getElementById('listTujuan');
            if (datalist && datalist.children.length > 0) return;
            const baseUrl = sessionStorage.getItem('realUrl');
            try {
                const response = await fetch(`${baseUrl}?action=loadLokasi`);
                const data = await response.json();
                if (Array.isArray(data)) datalist.innerHTML = data.map(item => `<option value="${item}">`).join('');
            } catch (e) { console.error(e); }
        }

        function openRekamModal(idx) {
            const data = window.rawPokData[idx];
            document.getElementById("rekamModal").classList.replace("hidden", "flex");
            document.getElementById("idUsulan").value = generateIdUsulan();
            document.getElementById("mak").value = data.kode;
            document.getElementById("uraianMak").value = data.uraian;
            document.getElementById("statusDana").value = Number(data.sisa) > 0 ? "Dana Tersedia" : "Dana Tidak Cukup";
            fetchLokasiData();
        }

        function closeRekamModal() { document.getElementById("rekamModal").classList.replace("flex", "hidden"); }
        function generateIdUsulan() { return Math.random().toString(36).substring(2, 12).toUpperCase(); }
        function logout() { sessionStorage.clear(); window.location.href = 'v3_index.html'; }
        
        document.addEventListener("DOMContentLoaded", () => navigate('dashboard'));
    </script>
</body>
</html>

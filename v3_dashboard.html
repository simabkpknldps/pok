<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMAB - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 border-b border-slate-100">
            <h1 class="text-2xl font-bold text-sky-700 flex items-center gap-2">
                <i class="fa-solid fa-shield-halved text-sky-500"></i> SiMAB
            </h1>
        </div>
        <nav class="p-4 space-y-2 flex-grow">
            <button onclick="navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition">
                <i class="fa-solid fa-gauge mr-3"></i> Dashboard
            </button>
            <button onclick="navigate('pok')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition">
                <i class="fa-solid fa-folder-open mr-3"></i> POK
            </button>
            <button onclick="navigate('kegiatan')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition">
                <i class="fa-solid fa-list-check mr-3"></i> Daftar Kegiatan
            </button>
            <button onclick="navigate('perjadin')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition">
                <i class="fa-solid fa-wallet mr-3"></i> Perjadinku
            </button>
            <button onclick="navigate('kalender')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition">
                <i class="fa-regular fa-calendar mr-3"></i> Kalender
            </button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 id="page-title" class="text-lg font-semibold text-slate-700">Dashboard</h2>
            <div class="flex items-center gap-6">
                <button class="text-slate-500 hover:text-sky-600"><i class="fa-solid fa-gear"></i></button>
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-sky-100 text-sky-600 flex items-center justify-center font-bold">
                        <i class="fa-solid fa-user"></i>
                    </div>
                    <span id="namaUser" class="text-sm font-medium text-slate-700">User</span>
                </div>
                <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium text-sm">
                    <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
                </button>
            </div>
        </header>

        <div id="app" class="flex-1 p-8 overflow-y-auto">
            </div>
    </main>

    <script>
        function navigate(page) {
            document.getElementById('page-title').innerText = page.charAt(0).toUpperCase() + page.slice(1);
            const app = document.getElementById('app');
            if (page === 'dashboard') {
                renderDashboardPage(app);
            } else {
                app.innerHTML = `<h1 class="text-2xl font-bold">Halaman ${page}</h1>`;
            }
        }
    
        async function renderDashboardPage(container) {
            container.innerHTML = `<div class="flex justify-center mt-10"><i class="fa-solid fa-spinner fa-spin text-sky-600 text-2xl"></i></div>`;
            try {
                const res = await fetch(sessionStorage.getItem('realUrl'), {
                    method: 'POST',
                    body: JSON.stringify({ action: 'getDashboardData' })
                });
                const data = await res.json();
                
                container.innerHTML = `
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                ${renderBelanjaCard('Belanja Barang', data.barang, 'blue')}
                                <div class="my-6 border-t border-slate-100"></div>
                                ${renderBelanjaCard('Belanja Modal', data.modal, 'blue')}
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                ${renderMPCard('Maksimum Pencairan PNBP', data.mp)}
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h3 class="font-semibold text-slate-700 mb-4">Top 5 Perjadin</h3>
                                <table class="w-full text-sm">
                                    ${data.topPerjadin.map((item, index) => `
                                        <tr class="border-b border-slate-50">
                                            <td class="py-3 text-slate-400 font-bold">${['🥇', '🥈', '🥉', '🎖️', '🎖️'][index] || '🔹'}</td>
                                            <td class="py-3 text-slate-600">${item[0]}</td>
                                            <td class="py-3 text-right font-bold text-sky-600">${item[1]}</td>
                                        </tr>
                                    `).join('')}
                                </table>
                            </div>
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                                <h3 class="font-semibold text-slate-700 mb-4">Kegiatan Hari Ini</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-xs">
                                        <thead>
                                            <tr class="text-slate-400 border-b">
                                                <th class="pb-2 text-left">Uraian / No ST</th>
                                                <th class="pb-2 text-left">Pelaksana</th>
                                                <th class="pb-2 text-left">Tujuan</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            ${data.kegiatanHariIni && data.kegiatanHariIni.length > 0 ? data.kegiatanHariIni.map(item => `
                                                <tr class="border-b border-slate-50">
                                                    <td class="py-3 text-slate-700">${item.uraian}</td>
                                                    <td class="py-3 text-slate-600">${item.pelaksana}</td>
                                                    <td class="py-3 text-slate-600">${item.tujuan}</td>
                                                </tr>
                                            `).join('') : `<tr><td colspan="3" class="py-4 text-center text-slate-400 italic">Tidak ada kegiatan hari ini</td></tr>`}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
            } catch (e) { container.innerHTML = `<p class="text-red-500">Gagal memuat data.</p>`; }
        }
    
        function renderBelanjaCard(title, d, color) {
            const p = (d.persen * 100).toFixed(2);
            return `
                <div class="mb-2">
                    <h3 class="font-semibold text-slate-700 mb-4">${title}</h3>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 mb-4">
                        <div class="bg-${color}-600 h-2.5 rounded-full" style="width: ${p}%"></div>
                    </div>
                    <div class="flex justify-between items-center">
                        <div class="text-3xl font-bold text-${color}-600">${p}%</div>
                        <div class="text-right text-sm text-slate-500">
                            <div>Realisasi: <span class="font-bold text-${color}-600">${d.realisasi.toLocaleString()}</span></div>
                            <div>Sisa: <span class="font-bold text-${color}-600">${d.sisa.toLocaleString()}</span></div>
                            <div>Pagu: <span class="font-bold text-${color}-600">${d.pagu.toLocaleString()}</span></div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderMPCard(title, d) {
            const p = (d.persen * 100).toFixed(2);
            return `
                <div class="mb-2">
                    <h3 class="font-semibold text-slate-700 mb-4">${title}</h3>
                    <div class="w-full bg-slate-200 rounded-full h-2.5 mb-4">
                        <div class="bg-emerald-500 h-2.5 rounded-full" style="width: ${p}%"></div>
                    </div>
                    <div class="text-3xl font-bold text-emerald-600 mb-4">${p}%</div>
                    <div class="text-sm text-slate-500 space-y-1">
                        <div>Realisasi MP: <span class="font-bold text-slate-800">${d.realisasi.toLocaleString()}</span></div>
                        <div>Sisa MP: <span class="font-bold text-slate-800">${d.sisa.toLocaleString()}</span></div>
                        <div>Total MP: <span class="font-bold text-slate-800">${d.pagu.toLocaleString()}</span></div>
                    </div>
                </div>
            `;
        }
    
        function logout() {
            sessionStorage.clear();
            window.location.href = 'v3_index.html';
        }
    
        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('namaUser').textContent = sessionStorage.getItem('nama') || 'User';
            navigate('dashboard');
        });
    </script>
</body>
</html>

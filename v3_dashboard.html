<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMAB - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 border-b border-slate-100"><h1 class="text-2xl font-bold text-sky-700 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-sky-500"></i> SiMAB</h1></div>
        <nav class="p-4 space-y-2 flex-grow">
            <button onclick="navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-gauge mr-3"></i> Dashboard</button>
            <button onclick="navigate('pok')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-folder-open mr-3"></i> POK</button>
            <button onclick="navigate('kegiatan')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-list-check mr-3"></i> Daftar Kegiatan</button>
            <button onclick="navigate('perjadin')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-solid fa-wallet mr-3"></i> Perjadinku</button>
            <button onclick="navigate('kalender')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 hover:text-sky-700 transition"><i class="fa-regular fa-calendar mr-3"></i> Kalender</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 id="page-title" class="text-lg font-semibold text-slate-700">Dashboard</h2>
            <button onclick="logout()" class="text-red-500 hover:text-red-700 font-medium text-sm"><i class="fa-solid fa-right-from-bracket mr-1"></i> Logout</button>
        </header>
        <div id="app" class="flex-1 p-8 overflow-y-auto space-y-6"></div>
    </main>

    <!-- Modal Rekam -->
    <div id="rekamModal" class="fixed inset-0 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-[980px] max-w-[96vw] overflow-hidden animate-[fade_.2s_ease]">
            <div class="bg-sky-600 text-white px-6 py-4 flex justify-between items-center">
                <h2 class="text-xl font-bold"><i class="fa-solid fa-pen-to-square mr-2"></i> Rekam Kegiatan</h2>
                <button onclick="closeRekamModal()" class="w-9 h-9 rounded-full hover:bg-sky-700 transition"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            
            <div class="grid grid-cols-2 gap-8 p-6">
                <div class="space-y-3">
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">ID Usulan</label><input id="idUsulan" readonly class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-slate-50"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">No ST/ND / Uraian Kegiatan</label><input id="uraianKegiatan" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tgl ST/ND</label><input type="date" id="tglSt" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Estimasi Biaya</label><input id="estimasiBiaya" oninput="cekKecukupanDana()" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Status Kecukupan Dana</label><input readonly id="statusDana" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Tujuan</label><input list="listTujuan" id="inputTujuan" class="w-full rounded-xl border border-slate-300 px-4 py-2.5"><datalist id="listTujuan"></datalist></div>
                </div>
                <div class="space-y-3">
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">MAK</label><input readonly id="mak" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-slate-50"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Uraian MAK</label><input readonly id="uraianMak" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-slate-50"></div>
                    <div><label class="block text-xs font-semibold uppercase text-slate-500 mb-1">Sisa</label><input readonly id="sisa" class="w-full rounded-xl border border-slate-300 px-4 py-2.5 bg-slate-50"></div>
                </div>
            </div>
            <div class="bg-slate-50 border-t px-6 py-4 flex justify-end gap-3">
                <button onclick="closeRekamModal()" class="px-6 py-2.5 rounded-xl border border-slate-300 hover:bg-slate-100">Batal</button>
                <button id="btnSimpan" onclick="simpanData()" class="bg-sky-600 hover:bg-sky-700 text-white px-6 py-2.5 rounded-xl shadow flex items-center">
                    <span id="btnText"><i class="fa-solid fa-floppy-disk mr-2"></i> Simpan</span>
                    <i id="btnLoading" class="fa-solid fa-spinner fa-spin hidden ml-2"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        async function navigate(page) {
            const container = document.getElementById('app');
            if (page === 'pok') {
                container.innerHTML = `<div class="bg-white rounded-2xl shadow-sm border overflow-hidden"><table class="w-full text-sm"><tbody id="pok-tbody"></tbody></table></div>`;
                const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getPOKData' }) });
                window.rawPokData = await res.json();
                document.getElementById('pok-tbody').innerHTML = window.rawPokData.map((i, idx) => `<tr><td class="p-3">${i.kode}</td><td class="p-3">${i.uraian}</td><td class="p-3">${i.sisa}</td><td class="p-3"><button onclick="openRekamModal(${idx})" class="bg-sky-600 text-white px-2 py-1 rounded">Rekam</button></td></tr>`).join('');
            }
        }

        async function simpanData() {
            const btn = document.getElementById("btnSimpan");
            const btnText = document.getElementById("btnText");
            const btnLoading = document.getElementById("btnLoading");
            
            btn.disabled = true;
            btnText.innerText = "Menyimpan...";
            btnLoading.classList.remove("hidden");

            const payload = {
                action: 'simpanKegiatan',
                idKegiatan: document.getElementById("idUsulan").value,
                mak: document.getElementById("mak").value,
                uraian: document.getElementById("uraianKegiatan").value,
                tujuan: document.getElementById("inputTujuan").value,
                tglSt: document.getElementById("tglSt").value,
                estimasi: document.getElementById("estimasiBiaya").value.replace(/,/g, ''),
                userLogin: sessionStorage.getItem('namaUser') || "User",
                tglRekam: new Date().toISOString().split('T')[0]
            };

            try {
                const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify(payload) });
                const result = await res.json();
                if (result.status === "success") {
                    alert("Data berhasil disimpan!");
                    closeRekamModal();
                } else { alert("Gagal: " + result.message); }
            } catch (e) { alert("Error koneksi!"); }
            
            btn.disabled = false;
            btnText.innerHTML = '<i class="fa-solid fa-floppy-disk mr-2"></i> Simpan';
            btnLoading.classList.add("hidden");
        }

        function openRekamModal(idx) {
            const data = window.rawPokData[idx];
            document.getElementById("rekamModal").classList.replace("hidden", "flex");
            document.getElementById("idUsulan").value = "ID-" + Date.now();
            document.getElementById("mak").value = data.kode;
            document.getElementById("uraianMak").value = data.uraian;
            document.getElementById("sisa").value = Number(data.sisa).toLocaleString();
            fetch(`${sessionStorage.getItem('realUrl')}?action=loadLokasi`).then(r => r.json()).then(d => document.getElementById('listTujuan').innerHTML = d.map(i => `<option value="${i}">`).join(''));
        }

        function closeRekamModal() {
            document.getElementById("rekamModal").classList.replace("flex", "hidden");
            document.getElementById("estimasiBiaya").value = "";
            document.getElementById("inputTujuan").value = "";
            document.getElementById("uraianKegiatan").value = "";
            document.getElementById("tglSt").value = "";
            document.getElementById("statusDana").value = "Dana Tersedia";
            document.getElementById("statusDana").className = "w-full rounded-xl border border-slate-300 px-4 py-2.5 transition";
        }

        function cekKecukupanDana() {
            const sisa = parseFloat(document.getElementById("sisa").value.replace(/,/g, '')) || 0;
            const est = parseFloat(document.getElementById("estimasiBiaya").value.replace(/,/g, '')) || 0;
            const el = document.getElementById("statusDana");
            el.value = est > sisa ? "Dana Tidak Cukup" : "Dana Tersedia";
            el.className = est > sisa ? "w-full rounded-xl border border-red-300 bg-red-50 text-red-700 px-4 py-2.5 font-bold transition" : "w-full rounded-xl border border-green-300 bg-green-50 text-green-700 px-4 py-2.5 font-bold transition";
        }

        function logout() { sessionStorage.clear(); window.location.href = 'v3_index.html'; }
    </script>
</body>
</html>

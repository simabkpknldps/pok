<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiMAB - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 flex h-screen overflow-hidden text-slate-800">

    <aside class="w-64 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-6 border-b border-slate-100"><h1 class="text-2xl font-bold text-sky-700 flex items-center gap-2"><i class="fa-solid fa-shield-halved text-sky-500"></i> SiMAB</h1></div>
        <nav class="p-4 space-y-2 flex-grow">
            <button onclick="navigate('dashboard')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 transition"><i class="fa-solid fa-gauge mr-3"></i> Dashboard</button>
            <button onclick="navigate('pok')" class="nav-btn w-full text-left p-3 rounded-xl hover:bg-sky-50 transition"><i class="fa-solid fa-folder-open mr-3"></i> POK</button>
        </nav>
    </aside>

    <main class="flex-1 flex flex-col overflow-hidden">
        <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-8">
            <h2 id="page-title" class="text-lg font-semibold text-slate-700">Dashboard</h2>
        </header>
        <div id="app" class="flex-1 p-8 overflow-y-auto space-y-6"></div>
    </main>

    <!-- Modal Rekam -->
    <div id="rekamModal" class="fixed inset-0 hidden items-center justify-center bg-slate-900/40 backdrop-blur-sm z-50">
        <div class="bg-white rounded-2xl shadow-2xl w-[980px] max-w-[96vw] p-6 space-y-4">
            <h2 class="text-xl font-bold">Rekam Kegiatan</h2>
            <div class="grid grid-cols-2 gap-4">
                <input id="idUsulan" readonly class="border p-2 rounded-xl bg-slate-50" placeholder="ID Usulan">
                <input id="uraianKegiatan" class="border p-2 rounded-xl" placeholder="Uraian Kegiatan">
                <input type="date" id="tglSt" class="border p-2 rounded-xl">
                <input id="estimasiBiaya" oninput="cekKecukupanDana()" class="border p-2 rounded-xl" placeholder="Estimasi Biaya">
                <input id="inputTujuan" list="listTujuan" class="border p-2 rounded-xl" placeholder="Tujuan">
                <datalist id="listTujuan"></datalist>
                <input readonly id="statusDana" class="border p-2 rounded-xl bg-slate-50">
            </div>
            <div class="flex justify-end gap-2 pt-4">
                <button onclick="closeRekamModal()" class="px-4 py-2 border rounded-xl">Batal</button>
                <button onclick="simpanData()" class="px-4 py-2 bg-sky-600 text-white rounded-xl">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        window.rawPokData = [];
        
        async function navigate(page) {
            const container = document.getElementById('app');
            if (page === 'pok') {
                container.innerHTML = `<table class="w-full bg-white"><thead><tr><th>Kode</th><th>Uraian</th><th>Sisa</th><th>Aksi</th></tr></thead><tbody id="pok-tbody"></tbody></table>`;
                loadPokData();
            }
        }

        async function loadPokData() {
            const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getPOKData' }) });
            window.rawPokData = await res.json();
            document.getElementById('pok-tbody').innerHTML = window.rawPokData.map((i, idx) => 
                `<tr><td>${i.kode}</td><td>${i.uraian}</td><td>${i.sisa}</td><td><button onclick="openRekamModal(${idx})" class="bg-blue-500 text-white px-2 py-1">Rekam</button></td></tr>`
            ).join('');
        }

        function openRekamModal(idx) {
            const data = window.rawPokData[idx];
            document.getElementById("rekamModal").classList.replace("hidden", "flex");
            document.getElementById("idUsulan").value = "ID-" + Date.now();
            document.getElementById("mak").value = data.kode; // Pastikan id="mak" ada di modal jika perlu
            document.getElementById("sisa").value = data.sisa;
            fetchLokasiData();
        }

        async function simpanData() {
            const payload = {
                action: 'simpanKegiatan',
                idKegiatan: document.getElementById("idUsulan").value,
                mak: document.getElementById("mak")?.value || "",
                uraian: document.getElementById("uraianKegiatan").value,
                tujuan: document.getElementById("inputTujuan").value,
                tglSt: document.getElementById("tglSt").value,
                estimasi: document.getElementById("estimasiBiaya").value.replace(/,/g, ''),
                userLogin: "User",
                tglRekam: new Date().toISOString().split('T')[0]
            };

            const response = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify(payload) });
            alert("Data disimpan!");
            closeRekamModal();
        }

        function closeRekamModal() { document.getElementById("rekamModal").classList.replace("flex", "hidden"); }
        function cekKecukupanDana() { /* logika Anda sebelumnya */ }
        function fetchLokasiData() { /* logika Anda sebelumnya */ }
    </script>
</body>
</html>

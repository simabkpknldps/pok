<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dokumentasi KPKNL Denpasar</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
    /* (CSS tetap sama dengan sebelumnya) */
    :root { --primary: #2563eb; --primary-dark: #1d4ed8; --secondary: #64748b; --success: #16a34a; --bg: #f8fafc; --card: #ffffff; --text: #1e293b; --border: #e2e8f0; }
    * { box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { margin: 0; background: var(--bg); padding: 20px; }
    .container { max-width: 800px; margin: auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .card { background: var(--card); padding: 16px; border-radius: 16px; border: 1px solid var(--border); }
    .card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; background: #eee; }
    .foto-actions { display: flex; gap: 8px; margin-top: 10px; }
    .btn-foto { flex: 1; padding: 10px; border: none; border-radius: 8px; background: var(--primary); color: white; cursor: pointer; font-size: 0.8rem; }
    .btn-upload { background: var(--secondary); }
    .download { width: 100%; padding: 16px; margin-top: 20px; background: #0f172a; color: white; border-radius: 12px; cursor: pointer; }
</style>
</head>
<body>
    <script>
    /* ============ PROSES FOTO BARU ============ */
    async function handleFile(id, file, isCamera) {
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async (e) => {
            const img = new Image();
            img.onload = async () => {
                let finalDataUrl;
                
                if (isCamera) {
                    // Mekanisme WATERMARK untuk Ambil Foto
                    const canvas = document.createElement("canvas");
                    canvas.width = img.width; canvas.height = img.height;
                    const ctx = canvas.getContext("2d");
                    ctx.drawImage(img, 0, 0);
                    
                    const loc = await new Promise(r => navigator.geolocation.getCurrentPosition(r, () => r(null), {timeout:5000}));
                    let infoText = new Date().toLocaleString("id-ID");
                    if (loc) {
                        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${loc.coords.latitude}&lon=${loc.coords.longitude}&zoom=16`).then(r=>r.json());
                        infoText += " • " + (res.display_name || (loc.coords.latitude.toFixed(4) + ", " + loc.coords.longitude.toFixed(4)));
                    }
                    
                    ctx.fillStyle = "rgba(0,0,0,0.5)";
                    ctx.fillRect(0, canvas.height - 100, canvas.width, 100);
                    ctx.fillStyle = "white";
                    ctx.font = "40px Arial";
                    ctx.fillText(infoText, 20, canvas.height - 30);
                    finalDataUrl = canvas.toDataURL("image/jpeg", 0.7);
                } else {
                    // Mekanisme TANPA WATERMARK untuk Upload
                    finalDataUrl = e.target.result;
                }

                foto[id] = finalDataUrl;
                document.getElementById("prev_" + id).src = finalDataUrl;
                document.getElementById("save_" + id).style.display = "block";
                localStorage.setItem("dokfoto_" + id, finalDataUrl);
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    /* ============ PERBAIKAN DOWNLOAD GALERI ============ */
    async function simpanKeGaleri(dataUrl, id) {
        if (!dataUrl) return;
        // Menggunakan fetch untuk mengubah dataURL ke BLOB agar lebih kompatibel
        const response = await fetch(dataUrl);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = "dokumentasi_" + id + ".jpg";
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    }
    
    // ... (Fungsi lain tetap sama)
    </script>
</body>
</html>

<!-- v3_pok.html -->
<div class="space-y-4">
    <h2 class="text-xl font-bold text-slate-800">Daftar POK</h2>
    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="p-4 text-left">Kode</th>
                    <th class="p-4 text-left">Uraian</th>
                    <th class="p-4 text-right">Pagu</th>
                    <th class="p-4 text-right">Realisasi</th>
                    <th class="p-4 text-right">Sisa</th>
                    <th class="p-4 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="pok-tbody">
                <tr><td colspan="6" class="p-8 text-center text-slate-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Memuat data...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
(function() {
    // Gunakan scope fungsi agar tidak mencemari global scope jika tidak perlu, 
    // tapi tetap ekspose fungsi yang dibutuhkan ke window.
    window.rawPokData = window.rawPokData || [];
    window.expandedCodes = window.expandedCodes || new Set();

    window.loadPokData = async function() {
        console.log("loadPokData dipanggil..."); // Tambahkan log ini
        const tbody = document.getElementById('pok-tbody');
        const url = sessionStorage.getItem('realUrl');
        
        if (!url) {
            tbody.innerHTML = `<tr><td colspan="6" class="text-red-500">Error: realUrl hilang!</td></tr>`;
            return;
        }
    
        try {
            const res = await fetch(url, { 
                method: 'POST', 
                body: JSON.stringify({ action: 'getPOKData' }) 
            });
            window.rawPokData = await res.json();
            window.renderPok();
        } catch (e) {
            console.error("Gagal:", e);
            tbody.innerHTML = `<tr><td colspan="6" class="text-red-500">Gagal load data.</td></tr>`;
        }
    };

    window.renderPok = function() {
        const tbody = document.getElementById('pok-tbody');
        if (!window.rawPokData || window.rawPokData.length === 0) return;

        const filtered = window.rawPokData.filter(i => {
            const codeStr = String(i.kode);
            if (codeStr.length === 12) return true;
            return Array.from(window.expandedCodes).some(parent => codeStr.startsWith(parent) && codeStr !== parent);
        });

        tbody.innerHTML = filtered.map(i => {
            const codeStr = String(i.kode);
            const isPNBP = i.sumber === 'PNBP';
            const bgClass = codeStr.length > 27 ? (isPNBP ? 'bg-pink-50' : 'bg-blue-50') : 'bg-white';
            const hasChildren = window.rawPokData.some(child => String(child.kode).startsWith(codeStr) && String(child.kode) !== codeStr);
            
            return `
                <tr class="border-b hover:bg-slate-100 ${bgClass} transition-colors cursor-pointer" onclick="window.toggleExpand('${codeStr}')">
                    <td class="p-3 font-mono text-xs font-bold">${codeStr}</td>
                    <td class="p-3 font-medium">${i.uraian} ${hasChildren ? (window.expandedCodes.has(codeStr) ? ' <i class="fa-solid fa-chevron-down text-[10px]"></i>' : ' <i class="fa-solid fa-chevron-right text-[10px]"></i>') : ''}</td>
                    <td class="p-3 text-right">${Number(i.pagu || 0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.realisasi || 0).toLocaleString()}</td>
                    <td class="p-3 text-right">${Number(i.sisa || 0).toLocaleString()}</td>
                    <td class="p-3 text-center">
                        ${codeStr.length > 27 ? `
                            <button class="bg-sky-500 text-white px-2 py-1 rounded text-[10px] mr-1 hover:bg-sky-600">Rekam</button>
                            <button class="bg-slate-500 text-white px-2 py-1 rounded text-[10px] hover:bg-slate-600">Detil</button>
                        ` : ''}
                    </td>
                </tr>
            `;
        }).join('');
    };

    window.toggleExpand = function(code) {
        if (window.expandedCodes.has(code)) {
            window.expandedCodes.delete(code);
        } else {
            window.expandedCodes.add(code);
        }
        window.renderPok();
    };
})();
</script>

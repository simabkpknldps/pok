<!-- v3_pok.html -->
<div class="space-y-4">
    <h2 class="text-xl font-bold text-slate-800">Daftar POK</h2>
    <div id="pok-container" class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-200">
                <tr>
                    <th class="p-4 text-left">Kode</th>
                    <th class="p-4 text-left">Uraian</th>
                    <th class="p-4 text-right">Pagu</th>
                    <th class="p-4 text-right">Realisasi</th>
                    <th class="p-4 text-right">Sisa</th>
                    <th class="p-4 text-center">Aksi</th>
                </tr>
            </thead>
            <tbody id="pok-tbody">
                <!-- Data akan dimuat lewat JS -->
            </tbody>
        </table>
    </div>
</div>

<script>
async function loadPokData() {
    const tbody = document.getElementById('pok-tbody');
    const res = await fetch(sessionStorage.getItem('realUrl'), { method: 'POST', body: JSON.stringify({ action: 'getPOKData' }) });
    const data = await res.json();

    // Tampilkan hanya kode dengan panjang 12 (Root level)
    const render = (items, parentCode = null) => {
        return items
            .filter(i => parentCode ? i.kode.startsWith(parentCode) && i.kode !== parentCode : i.kode.length === 12)
            .map(i => {
                const isPNBP = i.sumber === 'PNBP';
                const rowColor = isPNBP ? 'bg-pink-50' : 'bg-blue-50';
                const hasChildren = items.some(child => child.kode.startsWith(i.kode) && child.kode !== i.kode);
                
                return `
                    <tr class="border-b cursor-pointer hover:bg-slate-100 ${i.kode.length > 27 ? rowColor : ''}" onclick="toggleRow('${i.kode}')">
                        <td class="p-3 font-mono">${i.kode}</td>
                        <td class="p-3">${i.uraian}</td>
                        <td class="p-3 text-right">${i.pagu.toLocaleString()}</td>
                        <td class="p-3 text-right">${i.realisasi.toLocaleString()}</td>
                        <td class="p-3 text-right">${i.sisa.toLocaleString()}</td>
                        <td class="p-3 text-center">
                            ${i.kode.length > 27 ? `
                                <button class="bg-sky-500 text-white px-2 py-1 rounded text-xs">Rekam</button>
                                <button class="bg-sky-500 text-white px-2 py-1 rounded text-xs">Detil</button>
                            ` : ''}
                        </td>
                    </tr>
                `;
            }).join('');
    };

    tbody.innerHTML = render(data);
}

function toggleRow(code) {
    // Implementasi logika expand/collapse di sini
    console.log("Klik pada:", code);
}

loadPokData();
</script>
